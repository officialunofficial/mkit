# Template for the out-of-tree consumer built by scripts/check-primitives-consumer.py.
# Placeholders are filled from the packaged crate; there is no path dependency,
# [patch] table or workspace membership.
[package]
name = "primitives-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["pack-ruzstd"]
pack-ruzstd = ["mkit-primitives/pack-ruzstd"]

[dependencies]
mkit-primitives = { version = "=@VERSION@", default-features = false }
mkit-core = { version = "@CORE@", default-features = false }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
