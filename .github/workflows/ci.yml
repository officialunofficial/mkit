name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "${{ runner.os }}-$arch" in
            macOS-arm64)     tarball="zig-aarch64-macos-0.16.0.tar.xz" ;;
            macOS-x86_64)    tarball="zig-x86_64-macos-0.16.0.tar.xz" ;;
            Linux-x86_64)    tarball="zig-x86_64-linux-0.16.0.tar.xz" ;;
            Linux-aarch64)   tarball="zig-aarch64-linux-0.16.0.tar.xz" ;;
            *) echo "unsupported platform: ${{ runner.os }}-$arch"; exit 1 ;;
          esac
          url="https://ziglang.org/download/0.16.0/$tarball"
          echo "Downloading $url"
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Verify rename gate
        run: bash scripts/verify-rename.sh

      - name: Build
        run: zig build

      - name: Test (unit)
        run: zig build test

      - name: Test (integration)
        run: zig build test-integration

      # -Djemalloc smoke: ubuntu-latest only.
      #
      # The `-Djemalloc` option switches `main()` from the DebugAllocator to
      # `std.heap.c_allocator` and links libjemalloc. The code path has been
      # unchanged since the 0.15 era but had no CI coverage — it's easy to
      # silently break with a stray Allocator method rename. Install the
      # dev headers via apt and run a minimal init + commit + log smoke so
      # we exercise the allocator path end-to-end without paying for a full
      # test rerun.
      - name: Install libjemalloc (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libjemalloc-dev

      - name: Build + smoke-run -Djemalloc (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          zig build -Djemalloc
          MKIT="$(pwd)/zig-out/bin/mkit"
          # Confirm the built binary actually linked against jemalloc.
          # ldd output varies across distros (symlinks vs versioned); accept either.
          ldd "$MKIT" | grep -qE 'libjemalloc\.so'
          # Minimal lifecycle: init, keygen, commit, log, check the leak
          # tripwire by exiting cleanly.
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          "$MKIT" init
          "$MKIT" keygen
          echo "hello jemalloc" > f.txt
          "$MKIT" commit -m "jemalloc CI smoke"
          "$MKIT" log --oneline -n 1 | grep -q 'jemalloc CI smoke'
          cd /
          rm -rf "$WORKDIR"

  # Wire-level SSH transport e2e. Runs on ubuntu-latest only because sshd
  # isn't practical on the macOS runner (would need launchd config + a test
  # user). Runs AFTER build-and-test passes so we don't pay for sshd setup
  # on an already-red PR. Uses the binary built here directly (x86_64 linux
  # native for the runner), not a cross-compile.
  e2e-ssh:
    name: SSH transport e2e
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz" \
            -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: Build mkit (native x86_64-linux)
        run: zig build

      - name: Run tests/e2e-ssh.sh
        shell: bash
        run: |
          set -euo pipefail
          # The script default-hardcodes /src/zig-out/bin/mkit for container use;
          # override with the native build path on the runner.
          MKIT="$(pwd)/zig-out/bin/mkit" bash tests/e2e-ssh.sh
