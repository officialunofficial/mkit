name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "${{ runner.os }}-$arch" in
            macOS-arm64)     tarball="zig-aarch64-macos-0.16.0.tar.xz" ;;
            macOS-x86_64)    tarball="zig-x86_64-macos-0.16.0.tar.xz" ;;
            Linux-x86_64)    tarball="zig-x86_64-linux-0.16.0.tar.xz" ;;
            Linux-aarch64)   tarball="zig-aarch64-linux-0.16.0.tar.xz" ;;
            *) echo "unsupported platform: ${{ runner.os }}-$arch"; exit 1 ;;
          esac
          url="https://ziglang.org/download/0.16.0/$tarball"
          echo "Downloading $url"
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.local/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/.local/zig" --strip-components=1
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          "$HOME/.local/zig/zig" version

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Verify rename gate
        run: bash scripts/verify-rename.sh

      - name: Build
        run: zig build

      - name: Test (unit)
        run: zig build test

      - name: Test (integration)
        run: zig build test-integration
