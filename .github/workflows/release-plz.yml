# Release automation — release-plz (issue #225). Publishes the 9 library crates
# to crates.io. It does NOT create the git tag: release.yml's binary release is
# gated on an annotated, GPG-signed tag from an allowlisted fingerprint, which a
# token-created tag wouldn't satisfy — so the signed tag stays the existing human
# ceremony and remains the trigger for binaries/SBOM/GitHub-Release/npm. See
# rust/release-plz.toml for the model.
#
# Two jobs:
#  - release-plz-pr (open/update the single Release PR — next lockstep version,
#    rewritten internal dep requirements, CHANGELOG, cargo-semver-checks) runs
#    ONLY on manual `workflow_dispatch`. Trigger it when you want to cut a release.
#  - release-plz-release (`cargo publish` to crates.io) runs ONLY on push to main.
#    With `release_always = false` (release-plz.toml) it is a no-op unless the
#    pushed commit is a merged release-plz Release PR — so ordinary pushes (and
#    this setup PR's own merge) never publish.
#
# TOKENS (provision before enabling — see docs/release/CRATES-IO.md):
#  - CARGO_REGISTRY_TOKEN — crates.io API token (scopes: publish-new +
#    publish-update). Required for the release job to `cargo publish`.
#  - RELEASE_PLZ_APP_ID + RELEASE_PLZ_APP_PRIVATE_KEY — a GitHub App installation
#    token, minted per-run. release-plz creates no tag, so the App token is here
#    so the Release PR it opens can trigger CI (a `GITHUB_TOKEN`-authored PR does
#    not). Same App the polychrome repo uses — reuse it if installed on this repo.

name: release-plz

on:
  workflow_dispatch:        # open/update the Release PR (release-plz-pr).
  push:
    branches: [main]        # publish a merged Release PR (release-plz-release).

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  # crates.io publish when a Release PR merges (push to main). No-op otherwise
  # (release_always = false). Push-only; and gated on the `RELEASE_PLZ_ENABLED`
  # repo variable so the whole workflow stays DORMANT until you've provisioned
  # the secrets and flip the variable to `true` — merging this setup PR before
  # then is a clean skip (no failed App-token mint).
  release-plz-release:
    name: release-plz release
    if: github.event_name == 'push' && vars.RELEASE_PLZ_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # mkit-rpc compiles protobuf via buffa-build (shells out to protoc), and
      # `cargo publish` builds each crate to verify it before upload.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub App token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Run release-plz release
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db  # v0.5.129
        with:
          command: release
          manifest_path: rust/Cargo.toml
          config: rust/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update the single Release PR. MANUAL only, and likewise gated on
  # RELEASE_PLZ_ENABLED so a stray dispatch before setup does nothing.
  release-plz-pr:
    name: release-plz PR
    if: github.event_name == 'workflow_dispatch' && vars.RELEASE_PLZ_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # release-plz runs cargo-semver-checks (semver_check = true) to diff the
      # public API against the previous tag and propose the right version bump.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2
        with:
          tool: cargo-semver-checks

      - name: Mint GitHub App token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Run release-plz release-pr
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db  # v0.5.129
        with:
          command: release-pr
          manifest_path: rust/Cargo.toml
          config: rust/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
