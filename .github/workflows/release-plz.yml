# Release automation — release-plz (issue #225). RETIRED for publishing:
# crates.io publishing is now tag-driven via `.github/workflows/crates-publish.yml`
# (`cargo publish --workspace`), because release-plz's Release-PR/tag model fought
# this workspace's hand-owned versioning. See rust/release-plz.toml for the full
# rationale. This workflow is kept only as an OPTIONAL path back to release-plz-
# managed versioning; nothing here runs automatically.
#
# Two jobs, BOTH manual (`workflow_dispatch`) only — see `inputs.mode` below:
#  - release-plz-release (`cargo publish` to crates.io). Historically ran on
#    push to main, guarded by `release_always = false` (release-plz.toml) on
#    the assumption that guard would always skip since this flow "never
#    produces" a merged release-plz Release PR. That assumption broke on the
#    v0.4.2 release (2026-09-02): the mkit-release skill's own procedure DOES
#    merge release-plz's PR as the release-prep PR, and release-plz recognized
#    that merge commit as a real release and actually published every crate —
#    ~5 minutes before crates-publish.yml's tag-driven publish got there,
#    which then failed with "already exists" (harmless — publishes are
#    idempotent by version — but a confusing red X on the release tag). The
#    push trigger is removed for exactly this reason: crates-publish.yml is
#    the sole real publish path, and this job must never fire on its own.
#  - release-plz-pr (open a Release PR — next lockstep version, rewritten
#    internal dep requirements, CHANGELOG, cargo-semver-checks). OPTIONAL/
#    unused while the workspace hand-owns versioning (it errors when the
#    version is already bumped ahead of crates.io with the tag cut); kept for
#    the option of handing versioning to release-plz.
#
# TOKENS (provision before enabling — see docs/RELEASE.md):
#  - CRATES_PACKAGE_KEY — crates.io API token (scopes: publish-new +
#    publish-update), provided as an ORG-level secret and exposed to cargo as
#    the CARGO_REGISTRY_TOKEN env var below. Required for the release job to
#    `cargo publish`. The org secret must grant this repo access.
#  - RELEASE_PLZ_APP_ID + RELEASE_PLZ_APP_PRIVATE_KEY — a GitHub App installation
#    token, minted per-run. release-plz creates no tag, so the App token is here
#    so the Release PR it opens can trigger CI (a `GITHUB_TOKEN`-authored PR does
#    not). Same App already used elsewhere in the org — reuse it if installed on this repo.

name: "Release: release-plz (manual)"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which release-plz command to run"
        type: choice
        options: [release-pr, release]
        default: release-pr

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  # crates.io publish, manual-dispatch only (mode: release) — see the header
  # comment for why this no longer runs on push. Also gated on the
  # `RELEASE_PLZ_ENABLED` repo variable so the whole workflow stays DORMANT
  # until you've provisioned the secrets and flip the variable to `true`.
  release-plz-release:
    name: release-plz release
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && vars.RELEASE_PLZ_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # mkit-rpc compiles protobuf via buffa-build (shells out to protoc), and
      # `cargo publish` builds each crate to verify it before upload.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release
          manifest_path: rust/Cargo.toml
          config: rust/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PACKAGE_KEY }}

  # Open/update the single Release PR (mode: release-pr, the default). MANUAL
  # only, and likewise gated on RELEASE_PLZ_ENABLED so a stray dispatch before
  # setup does nothing.
  release-plz-pr:
    name: release-plz PR
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release-pr' && vars.RELEASE_PLZ_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # release-plz runs cargo-semver-checks (semver_check = true) to diff the
      # public API against the previous tag and propose the right version bump.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf  # v2
        with:
          tool: cargo-semver-checks

      - name: Mint GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9  # v0.5.131
        with:
          command: release-pr
          manifest_path: rust/Cargo.toml
          config: rust/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PACKAGE_KEY }}
