name: crates-owners

# Ensure crates.io ownership of the published mkit crates.
#
# Adds the `officialunofficial/makechain` GitHub team (so any team member can
# manage/publish) plus any extra individual crates.io usernames passed in.
# Re-runnable and idempotent: crates not yet published, and owners already
# present, are skipped — so it doubles as a repair/verify tool and as the step
# to run after a new crate first publishes. Manual trigger only (no PR/push
# noise).
#
# Requires the org `CRATES_PACKAGE_KEY` secret: a crates.io API token whose user
# is a member of the officialunofficial/makechain team (required to add the team
# as an owner). mkit-wasm is publish = false (npm-only) and is excluded.

on:
  workflow_dispatch:
    inputs:
      extra_owners:
        description: "Extra crates.io usernames to add as owners (comma-separated), in addition to the team"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  owners:
    name: ensure crate owners
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: "1.95"

      - name: Add owners to all publishable mkit crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_PACKAGE_KEY }}
          EXTRA_OWNERS: ${{ inputs.extra_owners }}
        run: |
          set -u
          # The 12 publishable library crates (matches crates-publish.yml;
          # mkit-wasm is publish = false / npm-only and is excluded).
          CRATES="mkit-core mkit-attest mkit-keystore mkit-git-bridge mkit-rpc \
                  mkit-cli mkit-transport-memory mkit-transport-file \
                  mkit-transport-http mkit-transport-s3 mkit-transport-ssh \
                  mkit-transport-enc"
          OWNERS="github:officialunofficial:makechain"
          IFS=',' read -ra EX <<< "${EXTRA_OWNERS}"
          for u in "${EX[@]}"; do u="$(echo "$u" | xargs)"; [ -n "$u" ] && OWNERS="$OWNERS $u"; done
          echo "Ensuring owners [$OWNERS] on: $CRATES"
          for c in $CRATES; do
            for o in $OWNERS; do
              echo "::group::$c  +=  $o"
              # Tolerate: crate not yet published, or already an owner — both are fine.
              cargo owner --add "$o" "$c" 2>&1 | sed 's/^/  /' \
                || echo "  (skipped: crate not published yet, already an owner, or invite pending)"
              echo "::endgroup::"
            done
          done
          echo "Done. Re-run after any new crate publishes to cover it too."
