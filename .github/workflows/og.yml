name: "CI: OG"

# Validation only. Deploy lives elsewhere: Cloudflare Workers Builds on merge
# to main (CF dashboard git integration; same model as apps/web and apps/mcp).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/og.yml'
      - 'apps/og/**'
  # No `paths:` filter on pull_request: the workflow ALWAYS triggers on PRs so
  # its required check (og-gate) is never absent. The `ci` job is gated on the
  # in-workflow paths-filter below instead — this avoids the
  # "required-but-skipped" trap where a path-filtered trigger leaves a
  # required status stuck pending on PRs that don't touch og paths.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this PR touches anything the OG worker depends on. The `ci`
  # job runs only when it does; the `og-gate` job below always runs and is the
  # stable required-check name.
  changes:
    name: Detect OG-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      og: ${{ steps.filter.outputs.og }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            og:
              - '.github/workflows/og.yml'
              - 'apps/og/**'

  ci:
    name: Typecheck and test the OG worker
    # Run on main pushes (push is path-filtered at the trigger), and on PRs
    # only when OG-relevant paths changed.
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || needs.changes.outputs.og == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install OG worker dependencies
        working-directory: apps/og
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/og
        run: bun run typecheck

      - name: Test (coverage-enforced)
        working-directory: apps/og
        run: bun run test:coverage

  # Stable required-check name for branch protection. Always runs on PRs
  # (if: always()) so the status is never absent — closing the
  # "required-but-skipped" trap. Passes when the `ci` job succeeded OR was
  # legitimately skipped because the PR touched no OG-relevant paths; fails if
  # `ci` actually failed or was cancelled.
  og-gate:
    name: OG CI gate
    if: always() && github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check OG ci job result
        shell: bash
        env:
          CI: ${{ needs.ci.result }}
        run: |
          echo "ci: ${CI}"
          case "${CI}" in
            success|skipped)
              echo "OG CI gate satisfied."
              ;;
            *)
              echo "::error::ci job did not succeed (result=${CI})"
              exit 1
              ;;
          esac
