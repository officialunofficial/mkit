name: "CI: Workers"

# apps/repo-worker, apps/keys-worker, apps/vcs-worker, and
# apps/mkit-worker-common are standalone Cargo packages (each with its own
# [package]/[workspace]) — none is a member of rust/Cargo.toml, so cargo
# fmt/clippy/nextest in cloudbuild/ci.yaml never touches them. This workflow
# is their dedicated gate: fmt, clippy, `cargo test --lib` for all four
# crates, a wasm32-unknown-unknown build for keys-worker and
# mkit-worker-common (repo-worker gets an incidental wasm build via the
# codegen-freshness check in cloudbuild/codegen.yaml — not duplicated here;
# vcs-worker gets its wasm32 clippy step and the conformance job's
# worker-build), and `buf lint` against apps/repo-worker/proto
# (apps/repo-worker/buf.yaml is otherwise dormant; no CI surface runs it
# today). vcs-worker has no app-local buf.yaml — it compiles against the
# repo-root `proto/` module, already covered by buf.yml/proto.yml — so
# there is no per-app buf lint step for it here.
#
# apps/mkit-worker-common (mkit#797) holds the CORS/body-cap/fetch-adapter
# glue shared by repo-worker and vcs-worker. It gets the SAME per-crate
# treatment as keys-worker rather than being folded into repo-worker's or
# vcs-worker's steps: it has no other CI footprint (no codegen-freshness
# check touches it, since it emits no generated proto code), and both
# consumer crates already build/test it transitively via their own `cargo
# test`/wasm32 build steps below — but that transitive coverage wouldn't
# catch a `cargo fmt`/`clippy` violation scoped to files ONLY this crate
# touches, or a case where a change compiles fine as a dependency but fails
# clippy/fmt on its own (e.g. an unused-in-context import). Explicit
# per-crate steps close that gap at negligible extra CI cost.
#
# Deploys live elsewhere (Cloudflare Workers Builds on merge to main, same
# model as apps/web) — this workflow is validation only.
# The TypeScript workspace Worker has a separate job below: rebuild the Rust
# WASM codec, generate binding types, test nanocodex integration, and bundle
# the Worker plus its Sandbox image.
#
# apps/vcs-worker is a thin deployment of rust/crates/mkit-server-worker
# (WP-M0-17), so changes to mkit-server* also trigger this workflow. The
# `vcs-worker-conformance` job runs the black-box wire suite
# (mkit-server-conformance) against it under `wrangler dev`
# (scripts/vcs-worker-conformance.sh). This workflow triggers only on `main`
# (pushes and PRs into it). The same script can be run locally. All jobs feed
# the existing stable gate.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/workers.yml'
      - 'apps/repo-worker/**'
      - 'apps/keys-worker/**'
      - 'apps/vcs-worker/**'
      - 'apps/embedded-worker/**'
      - 'apps/mkit-worker-common/**'
      - 'apps/workspace-worker/**'
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - 'rust/rust-toolchain.toml'
      - 'rust/crates/mkit-core/**'
      - 'rust/crates/mkit-attest/**'
      - 'rust/crates/mkit-rpc/**'
      - 'rust/crates/mkit-wasm/**'
      - 'rust/crates/mkit-server/**'
      - 'rust/crates/mkit-server-worker/**'
      - 'rust/crates/mkit-server-conformance/**'
      - 'rust/crates/mkit-transport-connect/**'
      - 'scripts/vcs-worker-conformance.sh'
      - 'scripts/workers-wire-diagnostics.py'
      - 'scripts/test-workers-wire-diagnostics.py'
      - 'scripts/workers-runtime-versions.cjs'
      - 'scripts/embedded-worker-conformance.*'
      - 'scripts/reference-worker-acceptance.py'
      - 'scripts/connect-deadline-runtime.py'
      - 'rust/vendor/ruzstd/**'
      - 'rust/crates/mkit-core-wasm-check/**'
      - 'rust/tests/golden/pack-v2/**'
      - 'scripts/paid-worker-acceptance.py'
      - 'scripts/embedded-worker-hooks.py'
      - 'scripts/vcs-worker-launch-runtime.py'
      - 'scripts/check-launch-feature-graph.py'
      - 'scripts/wasm-ruzstd-check.sh'
      - 'scripts/test-server-gates.py'
      - 'cloudbuild/ci.yaml'
      - 'apps/workspace-worker/package-lock.json'
      - 'apps/workspace-worker/package.json'
      - 'proto/mkit/transport/v1/**'
  # No `paths:` filter on pull_request: the workflow ALWAYS triggers on PRs so
  # its required check (workers-gate) is never absent. The `ci` job is gated
  # on the in-workflow paths-filter below instead — this avoids the
  # "required-but-skipped" trap where a path-filtered trigger leaves a
  # required status stuck pending on PRs that don't touch worker paths.
  # Mirrors the same pattern already used by web.yml/mcp.yml.
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; newer pushes cancel superseded runs. Pushes to main are
# never cancelled (key the guard off the event name, not github.ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this PR touches either worker crate. The `ci` job runs
  # only when it does; the `workers-gate` job below always runs and is the
  # stable required-check name.
  changes:
    name: Detect worker-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # paths-filter reads the PR's changed-file list from the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workers: ${{ steps.filter.outputs.workers }}
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # `workers` lists every in-repo path dependency of the four
          # worker crates and of the conformance runner (`cargo metadata`
          # of each app; `cargo tree -p mkit-server-conformance`), plus the
          # rust/ workspace files the runner builds with.
          filters: |
            workers:
              - '.github/workflows/workers.yml'
              - 'apps/repo-worker/**'
              - 'apps/keys-worker/**'
              - 'apps/vcs-worker/**'
              - 'apps/embedded-worker/**'
              - 'apps/mkit-worker-common/**'
              - 'rust/Cargo.lock'
              - 'rust/Cargo.toml'
              - 'rust/rust-toolchain.toml'
              - 'rust/crates/mkit-core/**'
              - 'rust/crates/mkit-attest/**'
              - 'rust/crates/mkit-rpc/**'
              - 'rust/crates/mkit-transport-connect/**'
              - 'rust/crates/mkit-server/**'
              - 'rust/crates/mkit-server-worker/**'
              - 'rust/crates/mkit-server-conformance/**'
              - 'scripts/vcs-worker-conformance.sh'
              - 'scripts/workers-wire-diagnostics.py'
              - 'scripts/test-workers-wire-diagnostics.py'
              - 'scripts/workers-runtime-versions.cjs'
              - 'scripts/embedded-worker-conformance.*'
              - 'scripts/reference-worker-acceptance.py'
              - 'scripts/connect-deadline-runtime.py'
              - 'rust/vendor/ruzstd/**'
              - 'rust/crates/mkit-core-wasm-check/**'
              - 'rust/tests/golden/pack-v2/**'
              - 'scripts/paid-worker-acceptance.py'
              - 'scripts/embedded-worker-hooks.py'
              - 'scripts/vcs-worker-launch-runtime.py'
              - 'scripts/check-launch-feature-graph.py'
              - 'scripts/wasm-ruzstd-check.sh'
              - 'scripts/test-server-gates.py'
              - 'cloudbuild/ci.yaml'
              - 'apps/workspace-worker/package-lock.json'
              - 'apps/workspace-worker/package.json'
              - 'proto/mkit/transport/v1/**'
            workspace:
              - '.github/workflows/workers.yml'
              - 'apps/workspace-worker/**'
              - 'rust/Cargo.lock'
              - 'rust/Cargo.toml'
              - 'rust/rust-toolchain.toml'
              - 'rust/crates/mkit-core/**'
              - 'rust/crates/mkit-attest/**'
              - 'rust/crates/mkit-rpc/**'
              - 'rust/crates/mkit-wasm/**'

  ci:
    name: fmt, clippy, test, wasm build, buf lint
    # Run on main pushes (push is path-filtered at the trigger), and on PRs
    # only when worker-relevant paths changed.
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || needs.changes.outputs.workers == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Neither worker is a rust/ workspace member, so the shared
      # .github/actions/setup-rust composite (hardcoded to `rust ->
      # rust/target`) doesn't fit — install the toolchain and cache directly,
      # scoped to both standalone crates. Both pin rust-version = "1.95.0" in
      # their own rust-toolchain.toml; match that here rather than picking a
      # different toolchain for CI (per the issue's MSRV-consistency note).
      - name: Install Rust 1.95.0 + wasm32 target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: |
            apps/repo-worker -> apps/repo-worker/target
            apps/keys-worker -> apps/keys-worker/target
            apps/vcs-worker -> apps/vcs-worker/target
            apps/embedded-worker -> apps/embedded-worker/target
            apps/mkit-worker-common -> apps/mkit-worker-common/target
          prefix-key: "rust-ci-workers"
          cache-on-failure: false
          cache-bin: false

      # apps/repo-worker/buf.yaml defines STANDARD lint + FILE breaking rules
      # but no CI image installs buf (cloudbuild/Dockerfile.ci installs protoc
      # only) — this is the first CI surface to exercise it. `buf breaking` is
      # deliberately out of scope here (companion buf-lint/breaking issue).
      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99  # v1.50.0
        with:
          github_token: ${{ github.token }}
          # Match proto.yml's BUF_VERSION rather than buf-setup-action's
          # stale default (1.50.0) -- see web.yml's identical pin for why.
          version: '1.66.0'

      - name: buf lint (apps/repo-worker/proto)
        working-directory: apps/repo-worker
        run: buf lint

      - name: mkit-worker-common - Check formatting
        working-directory: apps/mkit-worker-common
        run: cargo fmt --check

      - name: mkit-worker-common - Clippy
        working-directory: apps/mkit-worker-common
        run: cargo clippy --all-targets -- -D warnings

      - name: mkit-worker-common - Test
        working-directory: apps/mkit-worker-common
        run: cargo test

      # mkit-worker-common has no other CI footprint (unlike repo-worker/
      # vcs-worker, no codegen-freshness check incidentally builds it for
      # wasm32) — build it explicitly, mirroring keys-worker's identical
      # rationale below.
      - name: mkit-worker-common - wasm32 build
        working-directory: apps/mkit-worker-common
        run: cargo build --target wasm32-unknown-unknown

      - name: repo-worker - Check formatting
        working-directory: apps/repo-worker
        run: cargo fmt --check

      - name: repo-worker - Clippy
        working-directory: apps/repo-worker
        run: cargo clippy --all-targets -- -D warnings

      # repo-worker's wasm32 build is already exercised (incidentally) by the
      # codegen-freshness check on Cloud Build (cloudbuild/codegen.yaml ->
      # scripts/regen-repo-proto.sh) — not duplicated here.
      - name: repo-worker - Test (lib)
        working-directory: apps/repo-worker
        run: cargo test --lib

      - name: keys-worker - Check formatting
        working-directory: apps/keys-worker
        run: cargo fmt --check

      - name: keys-worker - Clippy
        working-directory: apps/keys-worker
        run: cargo clippy --all-targets -- -D warnings

      - name: keys-worker - Test (lib)
        working-directory: apps/keys-worker
        run: cargo test --lib

      # keys-worker has no other CI footprint anywhere today (zero references
      # in .github/workflows/ or cloudbuild/*.yaml) and no incidental wasm
      # build like repo-worker's codegen check — build it explicitly.
      - name: keys-worker - wasm32 build
        working-directory: apps/keys-worker
        run: cargo build --target wasm32-unknown-unknown

      - name: vcs-worker - Check formatting
        working-directory: apps/vcs-worker
        run: cargo fmt --check

      - name: vcs-worker - Clippy
        working-directory: apps/vcs-worker
        run: cargo clippy --all-targets -- -D warnings

      - name: vcs-worker - Clippy (wasm32)
        working-directory: apps/vcs-worker
        run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings

      # vcs-worker's wasm32 build is exercised by the clippy (wasm32) step
      # above and by the vcs-worker-conformance job's worker-build.
      - name: vcs-worker - Test (lib)
        working-directory: apps/vcs-worker
        run: cargo test --lib

      - name: embedded-worker - Check formatting
        working-directory: apps/embedded-worker
        run: cargo fmt --check

      - name: embedded-worker - Clippy (wasm32)
        working-directory: apps/embedded-worker
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

  workspace:
    name: Workspace typecheck, tests, and production bundle
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || needs.changes.outputs.workspace == 'true')
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust 1.95.0 + wasm32 target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: rust -> rust/target
          prefix-key: rust-ci-workspace

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/workspace-worker/package-lock.json

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Install workspace dependencies
        working-directory: apps/workspace-worker
        run: npm ci

      - name: Build workspace object codec from current Rust sources
        run: wasm-pack build rust/crates/mkit-wasm --release --target web --out-dir "$GITHUB_WORKSPACE/apps/workspace-worker/vendor/mkit-wasm"

      - name: Generate current binding types
        working-directory: apps/workspace-worker
        run: npm run types

      - name: Typecheck workspace
        working-directory: apps/workspace-worker
        run: npm run typecheck

      - name: Test workspace and real nanocodex protocol integration
        working-directory: apps/workspace-worker
        run: npm test

      # ubuntu-latest includes Docker, required to build the Sandbox image.
      # This is a bundle/image validation; no deployment or secret is needed.
      - name: Build workspace deployment
        working-directory: apps/workspace-worker
        run: npm run build

  # The M0 wire-conformance check of the vcs-worker port (WP-M0-17): the
  # black-box wire suite against the Worker under `wrangler dev`, in both
  # the release feature set and the `test-faults` one (clock skew, stats,
  # quota and growth cases, and the adapter's body-buffer bound).
  vcs-worker-conformance:
    name: vcs-worker wire conformance (wrangler dev)
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || needs.changes.outputs.workers == 'true')
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust 1.95.0 + wasm32 target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: |
            rust -> rust/target
            apps/vcs-worker -> apps/vcs-worker/target
            rust/crates/mkit-server-worker/tests/connect-deadline-probe -> rust/crates/mkit-server-worker/tests/connect-deadline-probe/target
          prefix-key: "rust-ci-vcs-conformance"
          cache-on-failure: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install worker-build
        run: cargo install worker-build --locked --version 0.8.6

      - name: Install independent admin signer hash tool
        run: cargo install b3sum --locked --version 1.8.5

      # D34 is the default sharding (WP-1.28c); the explicit single phase
      # keeps the snapshot round-trip and single-sharding growth coverage.
      - name: Create diagnostic log directory
        run: |
          mkdir -p "${RUNNER_TEMP}/wire-logs"
          npx --yes --package wrangler@4.134.0 -c 'node scripts/workers-runtime-versions.cjs' \
            >"${RUNNER_TEMP}/wire-logs/runtime-versions.json"

      - name: Portable contracts on the native test host (show case verdicts)
        working-directory: rust
        env:
          TMPDIR: ${{ runner.temp }}/wire-logs
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          cargo test --locked -p mkit-server-conformance --features test-host --test test_host portable_file_cases_run_against_the_native_host_without_skips -- --exact --nocapture
          cargo test --locked -p mkit-server-conformance --features test-host --test test_host signed_takedown_contract_survives_native_listener_and_pipeline_restart -- --exact --nocapture

      - name: Portable contracts and Connect deadlines on wasm (all dispatch entry points)
        timeout-minutes: 15
        env:
          TMPDIR: ${{ runner.temp }}/wire-logs
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: python3 scripts/connect-deadline-runtime.py --portable

      - name: Wire suite (release features, D34)
        env:
          TMPDIR: ${{ runner.temp }}/wire-logs
          VCS_CONFORMANCE_KEEP: '1'
        run: scripts/vcs-worker-conformance.sh

      - name: Wire suite (test-faults, D34, Multi)
        env:
          TMPDIR: ${{ runner.temp }}/wire-logs
          VCS_CONFORMANCE_KEEP: '1'
        run: scripts/vcs-worker-conformance.sh --test-faults --multi

      - name: Wire suite (test-faults, single sharding)
        env:
          TMPDIR: ${{ runner.temp }}/wire-logs
          VCS_CONFORMANCE_KEEP: '1'
        run: scripts/vcs-worker-conformance.sh --test-faults --sharding single

      - name: Paid indexed slice failure, resume and commit
        timeout-minutes: 20
        env:
          TMPDIR: ${{ runner.temp }}/wire-logs
          VCS_CONFORMANCE_KEEP: '1'
        run: scripts/vcs-worker-conformance.sh --indexed-only

      - name: Summarize connection losses and retries
        id: wire-diagnostics
        if: always()
        run: |
          python3 scripts/test-workers-wire-diagnostics.py
          python3 scripts/workers-wire-diagnostics.py "${RUNNER_TEMP}/wire-logs" \
            --output "${RUNNER_TEMP}/wire-logs/diagnostics.json" \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      - name: Upload Wrangler and Miniflare diagnostics
        if: always() && (failure() || steps.wire-diagnostics.outputs.keep == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workers-wire-logs
          path: ${{ runner.temp }}/wire-logs/**
          if-no-files-found: warn
          retention-days: 7

  paid-acceptance:
    name: Paid embedded release acceptance
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || needs.changes.outputs.workers == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create diagnostic directory
        run: |
          mkdir -p "${RUNNER_TEMP}/paid-logs"
          echo "TMPDIR=${RUNNER_TEMP}/paid-logs" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            rust -> rust/target
            apps/embedded-worker -> apps/embedded-worker/target
            apps/embedded-worker/tests/embedding-conformance -> apps/embedded-worker/tests/embedding-conformance/target
          prefix-key: paid-acceptance
          cache-on-failure: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install pinned build tools
        run: |
          cargo install worker-build --locked --version 0.8.6
          cargo install wasm-pack --locked --version 0.13.1
          cargo install b3sum --locked --version 1.8.5
      - name: Install locked local runtime
        working-directory: apps/workspace-worker
        run: npm ci --ignore-scripts
      - name: Verify hosted gates and launch decoder graphs
        timeout-minutes: 5
        run: |
          python3 scripts/test-server-gates.py --hosted-only
          time python3 scripts/check-launch-feature-graph.py
      - name: Bounded decoder on wasm32
        timeout-minutes: 10
        run: time bash scripts/wasm-ruzstd-check.sh
      - name: Locked wasm release build of embedding fixture
        working-directory: apps/embedded-worker/tests/embedding-conformance
        timeout-minutes: 10
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Release push, published read, URL token and cold outcome retry
        timeout-minutes: 10
        env:
          MKIT_MINIFLARE_MODULE: ${{ github.workspace }}/apps/workspace-worker/node_modules/miniflare
        run: python3 scripts/paid-worker-acceptance.py
      - name: Generic reference sessions, storage projection, purge and cold retry
        timeout-minutes: 10
        env:
          MKIT_MINIFLARE_MODULE: ${{ github.workspace }}/apps/workspace-worker/node_modules/miniflare
        run: python3 scripts/reference-worker-acceptance.py
      - name: Retain acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: paid-acceptance-logs
          path: ${{ runner.temp }}/paid-logs/**
          if-no-files-found: error
          retention-days: 7

  # Stable required-check name for branch protection. Always runs on PRs
  # (if: always()) so the status is never absent — closing the
  # "required-but-skipped" trap. All jobs must succeed or be legitimately
  # skipped because their relevant paths did not change. A failure or
  # cancellation in any job fails this gate.
  workers-gate:
    name: Workers CI gate
    if: always() && github.event_name == 'pull_request'
    needs: [ci, workspace, vcs-worker-conformance, paid-acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Check ci job result
        shell: bash
        env:
          CI: ${{ needs.ci.result }}
          WORKSPACE: ${{ needs.workspace.result }}
          CONFORMANCE: ${{ needs.vcs-worker-conformance.result }}
          PAID: ${{ needs.paid-acceptance.result }}
        run: |
          for result in "${CI}" "${WORKSPACE}" "${CONFORMANCE}" "${PAID}"; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "::error::Workers job did not succeed (Rust=${CI}, workspace=${WORKSPACE}, conformance=${CONFORMANCE}, paid=${PAID})"
                exit 1
                ;;
            esac
          done
          echo "Workers CI gate satisfied."
