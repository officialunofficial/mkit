name: "Nightly: Fuzz"

# Nightly libfuzzer smoke run for workspace and primitives targets.
# Each target runs for ~60 s; this is a
# spot-check, not a campaign. Failures are surfaced but do not block
# anything because (a) cargo-fuzz needs nightly so toolchain churn is
# a known source of flakes, and (b) we have not yet wired corpus
# persistence. Tighten `continue-on-error` once the harness is stable.
#
# Manual repro:
#   cd rust/fuzz && cargo +nightly fuzz run delta --features libfuzzer -- -max_total_time=60

on:
  schedule:
    # 04:00 UTC daily — pick a low-contention window.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [delta, pack, tree, software_key_record, rpc_decode, git_commit_parse, git_tag_parse, git_tree_parse, merkle_packlist, merkle_proof, sparse_verify, disclosure_decode, verify_disclosure, pack_entries, verify_closure, grant_parse, epoch_visibility_parse, span_decode, verify_span]
        include:
          - target: compute_schedule
            directory: rust/crates/mkit-primitives/fuzz
          - target: acceptance_decode
            directory: rust/crates/mkit-primitives/fuzz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable action, nightly toolchain
        with:
          toolchain: nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          # cargo-fuzz builds inside rust/fuzz with its own target dir,
          # but pulls workspace deps from rust/. Cache both.
          workspaces: |
            rust -> rust/target
            rust/fuzz -> rust/fuzz/target
            rust/crates/mkit-primitives/fuzz -> rust/crates/mkit-primitives/fuzz/target
          prefix-key: "rust-fuzz-${{ matrix.target }}"
          cache-on-failure: false

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed acceptance evidence from canonical fixtures
        if: matrix.target == 'acceptance_decode'
        run: |
          mkdir -p rust/crates/mkit-primitives/fuzz/corpus/acceptance_decode
          cp rust/crates/mkit-primitives/fixtures/acceptance/*.bin rust/crates/mkit-primitives/fuzz/corpus/acceptance_decode/

      - name: Run fuzz target (${{ matrix.target }}, 60s)
        working-directory: ${{ matrix.directory || 'rust/fuzz' }}
        run: |
          # libfuzzer-sys is gated behind the `libfuzzer` feature (see
          # each fuzz package Cargo.toml) so a plain `cargo build`/`cargo test`
          # never pulls the nightly-only crate into stable builds.
          # cargo-fuzz does not infer required-features on its own, so
          # this must be passed explicitly or every target fails at the
          # build step with "requires the features: libfuzzer".
          cargo +nightly fuzz run ${{ matrix.target }} --features libfuzzer -- -max_total_time=60

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            rust/fuzz/fuzz/artifacts/**
            rust/fuzz/artifacts/**
            rust/crates/mkit-primitives/fuzz/artifacts/**
            rust/crates/mkit-primitives/fuzz/fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  primitives-closure:
    name: primitives fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [closure_steps, closure_pages, pair_steps, pair_checkpoint]
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: nightly
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          workspaces: rust
          prefix-key: "primitives-fuzz-${{ matrix.target }}"
          cache-on-failure: false
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run bounded closure fuzz target
        working-directory: rust/crates/mkit-primitives/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} --features libfuzzer -- -max_total_time=60
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: primitives-fuzz-crashes-${{ matrix.target }}
          path: rust/crates/mkit-primitives/fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 14
