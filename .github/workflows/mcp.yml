name: "CI: MCP"

# Validation only. Deploys live elsewhere:
#   - Worker-code deploy on merge to main  -> Cloudflare Workers Builds (CF
#     dashboard git integration; same model as the web app)
#   - release-gated corpus seed on tags    -> mcp-release.yml

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp.yml'
      - 'mcp/**'
      - 'docs/**'
      - 'SKILL.md'
      - 'README.md'
      - 'man/**'
  pull_request:
    paths:
      - '.github/workflows/mcp.yml'
      - 'mcp/**'
      - 'docs/**'
      - 'SKILL.md'
      - 'README.md'
      - 'man/**'

permissions:
  contents: read

jobs:
  ci:
    name: Index, typecheck, and test the MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Build corpus index (validates the indexer + parsers)
        working-directory: mcp
        run: npm run index

      - name: Typecheck
        working-directory: mcp
        run: npm run build

      - name: Test
        working-directory: mcp
        run: npm run test
