name: "Security: Rust (scheduled advisory sweep)"

# REMINDER: rust/deny.toml ignores RUSTSEC-2023-0071 (yubikey transitive RSA
# decrypt timing leak), re-justification deadline 2026-08-21. See also
# rust/crates/mkit-keystore/tests/no_rsa_decrypt.rs.
#
# Scope: this workflow keeps ONLY the time-based advisory sweep. The per-PR /
# per-push cargo-audit + cargo-deny gate moved to Cloud Build
# (cloudbuild/security.yaml). A Cloud Build repo trigger has no native cron, so
# the Monday sweep — which catches newly-published advisories against an
# UNCHANGED dependency tree (no Cargo.* edit to path-trigger on) — stays here.

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit (advisory sweep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: "1.95.0"

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # The reference external signers (contrib/signers/) are a SEPARATE Cargo
      # workspace with their own lockfile — audit both. Keep the --ignore list
      # in lockstep with rust/deny.toml [advisories.ignore] and
      # cloudbuild/security.yaml.
      - name: cargo audit (rust workspace)
        working-directory: rust
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0055

      - name: cargo audit (contrib/signers workspace)
        working-directory: contrib/signers
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0055
