name: "Security: Rust (scheduled advisory sweep)"

# REMINDER: rust/deny.toml ignores RUSTSEC-2023-0071 (yubikey transitive RSA
# decrypt timing leak), re-justification deadline 2026-11-19. See also
# rust/crates/mkit-keystore/tests/no_rsa_decrypt.rs.
#
# Scope: this workflow keeps ONLY the time-based advisory sweep. The per-PR /
# per-push cargo-audit + cargo-deny gate moved to Cloud Build
# (cloudbuild/security.yaml). A Cloud Build repo trigger has no native cron, so
# the Monday sweep — which catches newly-published advisories against an
# UNCHANGED dependency tree (no Cargo.* edit to path-trigger on) — stays here.

on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit (advisory sweep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Enforces the REMINDER above: the TODO(YYYY-MM-DD) deadline is parsed
      # straight out of rust/deny.toml (single source of truth) so this step
      # can't drift out of sync with the ignore it's gating. Mirrored as a
      # pre-step in cloudbuild/security.yaml for the per-PR/per-push gate.
      - name: Check RUSTSEC-2023-0071 ignore has not expired
        run: |
          set -euo pipefail
          deadline=$(grep -oP 'TODO\(\K\d{4}-\d{2}-\d{2}(?=\))' rust/deny.toml | head -n1)
          if [ -z "$deadline" ]; then
            echo "::error::Could not find a TODO(YYYY-MM-DD) deadline in rust/deny.toml for RUSTSEC-2023-0071" >&2
            exit 1
          fi
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" > "$deadline" || "$today" == "$deadline" ]]; then
            echo "::error::RUSTSEC-2023-0071 ignore in rust/deny.toml expired on $deadline (today: $today). Re-justify or drop the ignore (see rust/deny.toml and rust/crates/mkit-keystore/tests/no_rsa_decrypt.rs)." >&2
            exit 1
          fi
          echo "RUSTSEC-2023-0071 ignore still valid until $deadline (today: $today)."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: "1.95.0"

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # The reference external signers (contrib/signers/) are a SEPARATE Cargo
      # workspace with their own lockfile — audit both. Keep the --ignore list
      # in lockstep with rust/deny.toml [advisories.ignore] and
      # cloudbuild/security.yaml.
      - name: cargo audit (rust workspace)
        working-directory: rust
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0055

      - name: cargo audit (contrib/signers workspace)
        working-directory: contrib/signers
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0055

      # apps/{keys,repo,vcs}-worker and apps/mkit-worker-common are separate
      # Cargo workspaces (own Cargo.lock, path-dep on rust/crates/mkit-core)
      # that a /rust or /contrib/signers audit never sees. None of them use
      # yubikey/openpgp-card (RUSTSEC-2023-0071 / RUSTSEC-2025-0055 don't
      # apply), but repo-worker and vcs-worker path-dep on mkit-core, which
      # pulls commonware-codec -> paste (unmaintained, RUSTSEC-2024-0436) —
      # the same advisory already ignored for rust/ and contrib/signers/.
      # keys-worker and mkit-worker-common don't pull mkit-core (keys-worker
      # deliberately avoids it, see its Cargo.toml) so they stay ignore-free.
      - name: cargo audit (apps/keys-worker workspace)
        working-directory: apps/keys-worker
        run: cargo audit --deny warnings

      - name: cargo audit (apps/repo-worker workspace)
        working-directory: apps/repo-worker
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: cargo audit (apps/vcs-worker workspace)
        working-directory: apps/vcs-worker
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: cargo audit (apps/mkit-worker-common workspace)
        working-directory: apps/mkit-worker-common
        run: cargo audit --deny warnings
