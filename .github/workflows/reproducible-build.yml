name: Reproducible Build Smoke Test

# Build mkit twice from the same commit and diff the outputs.
# A non-zero diff indicates a non-deterministic input (embedded timestamp,
# random seed, absolute path, non-sorted directory read, etc.) slipped in.
#
# See docs/release/REPRODUCIBILITY.md for the full set of inputs that
# determine a mkit binary, and for the standalone steps that a user can
# run to reproduce a published release binary from source.
#
# NOTE: diffoscope provides rich, human-readable diffs (ELF sections, debug
# info, etc.) but is heavyweight to install. For now this is a smoke test
# that compares raw SHA256s + falls back to cmp. A fully-fleshed-out version
# would install `diffoscope` via apt and emit an HTML report to artifacts.

on:
  # Expensive CI: on PRs, run only once a review is approved. Note
  # pull_request_review can't filter by path, so this now runs on any
  # approved PR regardless of which files changed.
  pull_request_review:
    types: [submitted]
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - '.github/workflows/reproducible-build.yml'
  schedule:
    # Mondays at 12:00 UTC — weekly drift check on main.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded approval runs; pushes/schedules to main are never
  # cancelled. (On pull_request_review github.ref is the default branch, so we
  # can't key the guard off github.ref — gate on the event name instead.)
  cancel-in-progress: ${{ github.event_name == 'pull_request_review' }}

env:
  RUST_VERSION: "1.95.0"
  BINARY_NAME: mkit

jobs:
  two-pass-build:
    name: Build twice, diff outputs
    # Run on push/schedule/dispatch; on PRs only after an approving review.
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # pull_request_review defaults to the base branch — check out the
          # PR head. github.sha is correct on push/schedule.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: rust -> rust/target
          prefix-key: "rust-reproducible"
          key: reproducible-build
          cache-on-failure: false
          cache-bin: false

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `--remap-path-prefix` rewrites embedded source paths to a
      # stable virtual prefix so two build passes from different
      # `--target-dir` values can still produce byte-identical
      # binaries. Without it, debug-info-stripped release builds STILL
      # leak the absolute build-dir (e.g. via $OUT_DIR-derived symbol
      # names that buffa codegen + thiserror inlines into rodata).
      #
      # We map both:
      #   - the source dir (`$PWD`) to `/src` — same in both passes
      #   - each pass's per-pass target dir to `/target` — different
      #     argv per pass, same string in the binary
      - name: Build pass 1
        working-directory: rust
        run: |
          export RUSTFLAGS="-C codegen-units=1 -C strip=symbols \
            --remap-path-prefix=$(pwd)=/src \
            --remap-path-prefix=$(pwd)/target-r1=/target \
            --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked -p mkit-cli --target-dir target-r1
          sha256sum target-r1/release/${{ env.BINARY_NAME }} | tee /tmp/hash1.txt

      - name: Build pass 2
        working-directory: rust
        run: |
          export RUSTFLAGS="-C codegen-units=1 -C strip=symbols \
            --remap-path-prefix=$(pwd)=/src \
            --remap-path-prefix=$(pwd)/target-r2=/target \
            --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked -p mkit-cli --target-dir target-r2
          sha256sum target-r2/release/${{ env.BINARY_NAME }} | tee /tmp/hash2.txt

      - name: Compare outputs (SHA256)
        id: compare
        run: |
          H1=$(awk '{print $1}' /tmp/hash1.txt)
          H2=$(awk '{print $1}' /tmp/hash2.txt)
          echo "pass1=${H1}"
          echo "pass2=${H2}"
          if [ "${H1}" != "${H2}" ]; then
            echo "::error::Non-deterministic build. pass1=${H1} pass2=${H2}"
            # Fall back to a byte-level cmp to show the first differing offset.
            cmp rust/target-r1/release/${{ env.BINARY_NAME }} \
                rust/target-r2/release/${{ env.BINARY_NAME }} || true
            exit 1
          fi
          echo "Build is byte-reproducible: ${H1}"

      # TODO: install diffoscope and emit a richer report for investigators.
      # - name: Install diffoscope
      #   if: failure()
      #   run: sudo apt-get update && sudo apt-get install -y --no-install-recommends diffoscope
      # - name: Diffoscope report
      #   if: failure()
      #   run: |
      #     diffoscope --html diffoscope-report.html \
      #       rust/target-r1/release/${{ env.BINARY_NAME }} \
      #       rust/target-r2/release/${{ env.BINARY_NAME }} || true
      # - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      #   if: failure()
      #   with:
      #     name: diffoscope-report
      #     path: diffoscope-report.html
