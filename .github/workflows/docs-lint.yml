name: "Meta: docs lint"

on:
  push:
    branches: [main]
    paths:
      - 'docs/specs/**'
      - 'scripts/check-spec-status.sh'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    paths:
      - 'docs/specs/**'
      - 'scripts/check-spec-status.sh'
      - '.github/workflows/docs-lint.yml'

permissions:
  contents: read

jobs:
  spec-status:
    name: SPEC-*.md status frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check every docs/specs/SPEC-*.md has a recognized status
        run: bash scripts/check-spec-status.sh
        shell: bash
