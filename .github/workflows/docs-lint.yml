name: "Meta: docs lint"

on:
  push:
    branches: [main]
    paths:
      - 'docs/specs/**'
      - 'scripts/check-spec-status.sh'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    paths:
      - 'docs/specs/**'
      - 'scripts/check-spec-status.sh'
      - '.github/workflows/docs-lint.yml'

permissions:
  contents: read

jobs:
  spec-status:
    name: SPEC-*.md status frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Check every docs/specs/SPEC-*.md has a recognized status
        run: bash scripts/check-spec-status.sh
        shell: bash
