name: "Scheduled: Benchmark Freshness"

# Non-gating drift check for the two static benchmark artifacts README.md
# points readers at: benchmarks/charts/*.svg (README.md #benchmarks section)
# and the mkit-vs-git methodology baked into apps/web/src/lib/perf-data.ts
# (rendered at mkit.sh/performance). Neither is regenerated by any other
# workflow, so a change to core hashing/packing/transport code can silently
# invalidate every published number with zero CI signal (#720).
#
# This workflow regenerates both and reports whether they've drifted from
# what's committed. It is deliberately scheduled + workflow_dispatch only —
# never on pull_request — so a red run here NEVER blocks a PR. Bench noise
# (even on the same GitHub-hosted runner across weeks) makes exact numeric
# reproduction unreliable; a failure here is a nudge to a human to eyeball
# and, if warranted, regenerate the charts and re-run scripts/bench-vs-git.sh
# — not a correctness signal by itself.
#
# Two independent checks, both run even if one fails, summarized at the end:
#   1. Chart freshness: do benchmarks/charts/*.svg still match a fresh
#      `cargo run -p mkit-benches --bin render-charts`?
#   2. Methodology freshness: does perf-data.ts's baked-in
#      `methodology.commit` still match HEAD? (scripts/bench-vs-git.sh's
#      MKIT_BENCH_PROVENANCE_ONLY=1 fast path emits the same provenance
#      format — commit + dirty flag — without running the ~3 GiB hyperfine
#      suite, see #607.)
#
# Manual repro of check 1:
#   cargo bench -p mkit-benches --bench hashing --bench sign_verify \
#     --bench object_commit --bench pack_create -- --quick
#   cargo run -p mkit-benches --bin render-charts
#   git diff --exit-code benchmarks/charts/
#
# Manual repro of check 2:
#   cargo build --release --locked -p mkit-cli
#   MKIT_BENCH_PROVENANCE_ONLY=1 scripts/bench-vs-git.sh

on:
  schedule:
    # 07:00 UTC every Sunday — low-contention window, distinct from
    # fuzz.yml's daily 04:00 and rust-security.yml's Monday 06:00.
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  bench-freshness:
    name: Benchmark + methodology freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No protoc: mkit-rpc's build.rs stages pre-committed generated/
      # sources by default (see .github/workflows/rust.yml's build-and-test
      # job for the same reasoning) — nothing built here needs codegen mode.
      - name: Set up Rust and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: "rust-bench-freshness"
          protoc: "false"

      # --- Check 1: chart freshness -----------------------------------
      - name: Regenerate benches (named targets, --quick)
        working-directory: rust
        # README.md's own repro warning: `--workspace -- --quick` fails
        # because --quick isn't a valid option for the lib unittest target,
        # so the bench targets are named explicitly.
        run: |
          cargo bench -p mkit-benches --bench hashing --bench sign_verify \
            --bench object_commit --bench pack_create -- --quick

      - name: Render charts
        working-directory: rust
        run: cargo run -p mkit-benches --bin render-charts

      - name: Diff benchmarks/charts against a fresh render
        id: chart_diff
        continue-on-error: true
        run: |
          if git diff --exit-code -- benchmarks/charts/ > /tmp/chart-diff.txt 2>&1; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::benchmarks/charts/*.svg drifted from a fresh render-charts run"
            cat /tmp/chart-diff.txt
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      # Reset the working tree before check 2 so the mkit-cli release build
      # below can't be confused by (and check 2's provenance dirty flag
      # can't be poisoned by) the regenerated SVGs from check 1.
      - name: Restore benchmarks/charts/ (isolate check 2)
        if: always()
        run: git checkout -- benchmarks/charts/

      # --- Check 2: methodology freshness -----------------------------
      - name: Build mkit-cli release binary
        working-directory: rust
        run: cargo build --release --locked -p mkit-cli

      - name: Capture fresh bench provenance (fast path, no hyperfine run)
        id: provenance
        env:
          MKIT_BENCH_PROVENANCE_ONLY: "1"
        run: |
          scripts/bench-vs-git.sh rust/target/release/mkit "$RUNNER_TEMP/bench-provenance"
          fresh_commit=$(sed -n 's/^mkit commit: \([0-9a-f]\{40\}\).*/\1/p' "$RUNNER_TEMP/bench-provenance/provenance.txt")
          if [ -z "$fresh_commit" ]; then
            echo "::error::could not parse a commit SHA out of provenance.txt"
            exit 1
          fi
          echo "fresh_commit=$fresh_commit" >> "$GITHUB_OUTPUT"

      - name: Compare against perf-data.ts's baked methodology.commit
        id: methodology_diff
        continue-on-error: true
        run: |
          baked_commit=$(sed -n "s/^[[:space:]]*commit: '\([0-9a-f]\{40\}\)'.*/\1/p" apps/web/src/lib/perf-data.ts)
          fresh_commit="${{ steps.provenance.outputs.fresh_commit }}"
          echo "perf-data.ts methodology.commit: $baked_commit"
          echo "HEAD (freshly measured):         $fresh_commit"
          if [ -z "$baked_commit" ]; then
            echo "::error::could not parse methodology.commit out of apps/web/src/lib/perf-data.ts"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          elif [ "$baked_commit" != "$fresh_commit" ]; then
            echo "::warning::apps/web/src/lib/perf-data.ts's methodology.commit ($baked_commit) is behind HEAD ($fresh_commit) — the published mkit-vs-git numbers were measured on an older commit"
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Summary -------------------------------------------------------
      # This job's own pass/fail IS the freshness signal — deliberately not
      # wired to any pull_request trigger or required-check, so it never
      # gates a merge (see header). A red run here means: go look, and
      # decide by eye whether to regenerate charts / re-run
      # scripts/bench-vs-git.sh and update perf-data.ts.
      - name: Evaluate drift
        if: always()
        run: |
          chart_drift="${{ steps.chart_diff.outputs.drift }}"
          methodology_drift="${{ steps.methodology_diff.outputs.drift }}"
          echo "chart drift:       ${chart_drift:-unknown}"
          echo "methodology drift: ${methodology_drift:-unknown}"
          if [ "$chart_drift" = "true" ] || [ "$methodology_drift" = "true" ] || \
             [ -z "$chart_drift" ] || [ -z "$methodology_drift" ]; then
            echo "::error::benchmark freshness drift detected (or a check errored) — see warnings above. Non-gating: this does not block any PR."
            exit 1
          fi
