name: Semver checks

# Guards the public API of the publishable library crates against accidental
# breaking changes. mkit is not on crates.io yet, so there is no published
# baseline — instead we diff each PR's API against the BASE BRANCH (git rev).
# This catches an unintended break the moment it's introduced; once we start
# publishing, the baseline can switch to the crates.io release.
#
# cargo-semver-checks understands 0.x semver (a 0.MINOR bump may break), so it
# only fails when an API break is NOT accompanied by an appropriate version
# bump — not on every additive change.

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  semver:
    name: Public API semver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the baseline rev)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: rust -> rust/target
          prefix-key: "rust-semver"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `--all-features` checks the feature-gated public surface too
      # (history-mmr, sparse-checkout, pack-shards, the keystore backends) —
      # the same API docs.rs renders. keystore's backend-yubikey needs
      # libpcsclite to build.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev libpcsclite-dev pkg-config

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4  # v2
        with:
          tool: cargo-semver-checks

      # The publishable LIBRARY crates — exactly the `publish = true` members.
      # Excluded by construction (all `publish = false`): mkit-cli (the binary;
      # its lib surface is unstable CLI internals), mkit-wasm (npm-only), and
      # mkit-transport-enc (Phase-2). `--baseline-rev` builds the base branch's
      # API for comparison.
      - name: cargo-semver-checks vs base branch
        working-directory: rust
        run: |
          cargo semver-checks \
            --baseline-rev "origin/${{ github.base_ref }}" \
            --all-features \
            -p mkit-core \
            -p mkit-attest \
            -p mkit-keystore \
            -p mkit-rpc \
            -p mkit-transport-file \
            -p mkit-transport-http \
            -p mkit-transport-memory \
            -p mkit-transport-s3 \
            -p mkit-transport-ssh
