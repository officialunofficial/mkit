name: Semver checks

# Guards the public API of the publishable library crates against accidental
# breaking changes. mkit publishes to crates.io, so we diff each PR's API
# against the LAST RELEASE TAG (the released baseline), discovered with
# `git describe`. Diffing against the base branch instead would false-positive
# the entire post-bump development window: `main` already carries the next,
# unreleased version, so a legitimate breaking change destined for that release
# would be flagged as "broke vs an identical version number". The release tag is
# a real published boundary, so 0.MINOR-bump breaks are correctly permitted.
#
# cargo-semver-checks understands 0.x semver (a 0.MINOR bump may break), so it
# only fails when an API break is NOT accompanied by an appropriate version
# bump — not on every additive change.

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  semver:
    name: Public API semver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the baseline rev)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: rust -> rust/target
          prefix-key: "rust-semver"

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `--all-features` checks the feature-gated public surface too
      # (history-mmr, sparse-checkout, pack-shards, the keystore backends).
      # This is a SUPERSET of what docs.rs renders — it also covers
      # mkit-keystore's `backend-yubikey`, which the keystore's docs.rs
      # metadata omits — and that broader coverage is intentional. yubikey
      # needs libpcsclite to build.
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev libpcsclite-dev pkg-config

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2
        with:
          tool: cargo-semver-checks

      # The publishable LIBRARY crates whose API we guard. Excluded: mkit-cli
      # (the `mkit` binary — published for `cargo install`, but its lib surface
      # is unstable CLI internals we intentionally do NOT semver-guard) and
      # mkit-wasm (npm-only).
      #
      # mkit-git-bridge is intentionally absent: it has no released baseline
      # yet (new in the upcoming release), so cargo-semver-checks cannot build
      # the baseline rev for it. Add `-p mkit-git-bridge` once it has shipped
      # in a tagged release.
      - name: cargo-semver-checks vs last release tag
        working-directory: rust
        run: |
          baseline="$(git describe --tags --abbrev=0 --match 'v*')"
          echo "Baseline (last release tag): $baseline"
          cargo semver-checks \
            --baseline-rev "$baseline" \
            --all-features \
            -p mkit-core \
            -p mkit-attest \
            -p mkit-keystore \
            -p mkit-rpc \
            -p mkit-transport-file \
            -p mkit-transport-http \
            -p mkit-transport-memory \
            -p mkit-transport-s3 \
            -p mkit-transport-enc \
            -p mkit-transport-ssh
