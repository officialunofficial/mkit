name: "CI: Web"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web.yml'
      - 'web/**'
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - 'rust/rust-toolchain.toml'
      - 'rust/crates/mkit-attest/**'
      - 'rust/crates/mkit-core/**'
      - 'rust/crates/mkit-rpc/**'
      - 'rust/crates/mkit-wasm/**'
      - 'scripts/patch-wasm-bundler-glue.mjs'
  pull_request:
    paths:
      - '.github/workflows/web.yml'
      - 'web/**'
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - 'rust/rust-toolchain.toml'
      - 'rust/crates/mkit-attest/**'
      - 'rust/crates/mkit-core/**'
      - 'rust/crates/mkit-rpc/**'
      - 'rust/crates/mkit-wasm/**'
      - 'scripts/patch-wasm-bundler-glue.mjs'

permissions:
  contents: read

# One run per PR; newer pushes cancel superseded runs. Pushes to main are
# never cancelled (key the guard off the event name, not github.ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Install, test, and build web demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install Rust 1.95.0 + wasm32 target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      # Node stays: waku/vitest/wrangler run on the node runtime — bun is the
      # package manager and script runner only (see web/README.md).
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build local mkit-wasm package
        working-directory: web
        run: bun run wasm:build

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Test
        working-directory: web
        run: bun run test

      - name: Lint
        working-directory: web
        run: bun run lint

      - name: Format check
        working-directory: web
        run: bun run fmt:check

      - name: Production build
        working-directory: web
        run: bun run build

      # The web demo above builds `--target web`, but the *published* npm
      # package ships `--target bundler` + the Bun/Workers glue patch. Build
      # that artifact shape here so a regression in the bundler output or the
      # patcher is caught in CI rather than by consumers (#209, #223). The
      # patcher exits non-zero if wasm-pack's glue shape changes, so this
      # doubles as a structural assertion.
      - name: Bundler-target wasm smoke build
        working-directory: rust
        run: |
          wasm-pack build crates/mkit-wasm --release --target bundler --out-dir pkg-bundler
          node ../scripts/patch-wasm-bundler-glue.mjs crates/mkit-wasm/pkg-bundler
