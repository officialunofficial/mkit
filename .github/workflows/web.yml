name: "CI: Web"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web.yml'
      - 'apps/web/**'
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - 'rust/rust-toolchain.toml'
      - 'rust/crates/mkit-attest/**'
      - 'rust/crates/mkit-core/**'
      - 'rust/crates/mkit-rpc/**'
      - 'rust/crates/mkit-wasm/**'
      - 'scripts/patch-wasm-bundler-glue.mjs'
  # No `paths:` filter on pull_request: the workflow ALWAYS triggers on PRs so
  # its required check (web-gate) is never absent. The heavy `web` job is
  # gated on the in-workflow paths-filter below instead — this avoids the
  # "required-but-skipped" trap where a path-filtered trigger leaves a
  # required status stuck pending on PRs that don't touch web paths.
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR; newer pushes cancel superseded runs. Pushes to main are
# never cancelled (key the guard off the event name, not github.ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this PR touches anything the web build depends on. The
  # heavy `web` job runs only when it does; the `web-gate` job below always
  # runs and is the stable required-check name.
  changes:
    name: Detect web-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # paths-filter reads the PR's changed-file list from the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
        id: filter
        with:
          filters: |
            web:
              - '.github/workflows/web.yml'
              - 'apps/web/**'
              - 'rust/Cargo.lock'
              - 'rust/Cargo.toml'
              - 'rust/rust-toolchain.toml'
              - 'rust/crates/mkit-attest/**'
              - 'rust/crates/mkit-core/**'
              - 'rust/crates/mkit-rpc/**'
              - 'rust/crates/mkit-wasm/**'
              - 'scripts/patch-wasm-bundler-glue.mjs'

  web:
    name: Install, test, and build web demo
    # Run on main pushes (push is path-filtered at the trigger), and on PRs
    # only when web-relevant paths changed.
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust 1.95.0 + wasm32 target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      # Node stays: waku/vitest/wrangler run on the node runtime — bun is the
      # package manager and script runner only (see apps/web/README.md).
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
        with:
          version: '31.0'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Build local mkit-wasm package
        working-directory: apps/web
        run: bun run wasm:build

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Test
        working-directory: apps/web
        run: bun run test

      - name: Lint
        working-directory: apps/web
        run: bun run lint

      - name: Format check
        working-directory: apps/web
        run: bun run fmt:check

      - name: Production build
        working-directory: apps/web
        run: bun run build

      # The web demo above builds `--target web`, but the *published* npm
      # package ships `--target bundler` + the Bun/Workers glue patch. Build
      # that artifact shape here so a regression in the bundler output or the
      # patcher is caught in CI rather than by consumers (#209, #223). The
      # patcher exits non-zero if wasm-pack's glue shape changes, so this
      # doubles as a structural assertion.
      - name: Bundler-target wasm smoke build
        working-directory: rust
        run: |
          wasm-pack build crates/mkit-wasm --release --target bundler --out-dir pkg-bundler
          node ../scripts/patch-wasm-bundler-glue.mjs crates/mkit-wasm/pkg-bundler

  # Stable required-check name for branch protection. Always runs on PRs
  # (if: always()) so the status is never absent — closing the
  # "required-but-skipped" trap. Passes when the `web` job succeeded OR was
  # legitimately skipped because the PR touched no web-relevant paths; fails
  # if `web` actually failed or was cancelled.
  web-gate:
    name: Web CI gate
    if: always() && github.event_name == 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: Check web job result
        shell: bash
        env:
          WEB: ${{ needs.web.result }}
        run: |
          echo "web: ${WEB}"
          case "${WEB}" in
            success|skipped)
              echo "Web CI gate satisfied."
              ;;
            *)
              echo "::error::web job did not succeed (result=${WEB})"
              exit 1
              ;;
          esac
