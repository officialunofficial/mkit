name: "Nightly: Criterion micro-bench regression check"

# Tier-3 absolute-timing guard (#609): the criterion suite under
# rust/benches/ measures real wall-clock (hashing throughput,
# object-commit / pack-create wallclock vs git2 / the git CLI). Those
# numbers are machine-dependent, so they run nightly with a documented
# tolerance instead of gating PRs — a Cloud Build repo trigger has no
# native cron (see rust-security.yml's scheduled-sweep comment for the
# same reasoning), so this lives on GitHub Actions like fuzz.yml.
#
# `rust/target/criterion/` is gitignored build output; the reference
# numbers this job compares against live in
# rust/benches/criterion-baselines/ (see scripts/bench-baseline.sh and
# that directory's README for how the baseline is recorded/updated).
#
# On regression: this job fails and the "Regression check" step output
# — a plain-text table of every benchmark's mean %Δ against the
# committed baseline — is the report. Nothing here blocks a PR; update
# the tracked baseline deliberately (scripts/bench-baseline.sh save)
# when a change is an intentional, accepted perf shift.

on:
  schedule:
    # 05:00 UTC daily — after rust-security.yml's Monday sweep window,
    # before the fuzz.yml 04:00 UTC run finishes on a loaded shared
    # runner pool.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      tolerance:
        description: 'Regression tolerance fraction (e.g. "0.25" for 25%), forwarded to MKIT_BENCH_TOLERANCE'
        required: false
        default: "0.25"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"

jobs:
  bench-regression:
    name: Criterion bench regression check
    # Nightly-with-tolerance, never PR-blocking (#609 tier 3): this is
    # a standalone scheduled workflow, not part of any pull_request
    # trigger or branch-protection required check, so a red run here
    # cannot fail a PR — but it SHOULD show red in the Actions tab
    # (no `continue-on-error`) so a real regression is visible, not
    # muted to a neutral/skipped-looking status.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: rust -> rust/target
          prefix-key: "rust-bench-nightly"
          cache-on-failure: false

      # Seed target/criterion/ from the tracked baseline so
      # `--baseline committed` below has something to compare against
      # (target/ is gitignored — it does not survive between commits,
      # only the cache above, which is best-effort).
      - name: Restore committed baseline
        run: scripts/bench-baseline.sh restore

      # Explicit bench targets (not `--workspace -- --quick`): the lib
      # unittest target rejects --quick — see README's Performance
      # section and PR #604. pack_shard_transfer stays out (feature
      # -gated, "not gated on in CI" per its Cargo.toml comment).
      #
      # `--baseline committed` compares against (and does NOT
      # overwrite) the restored baseline, writing
      # target/criterion/**/change/estimates.json per benchmark.
      - name: Run benches against the committed baseline
        working-directory: rust
        run: |
          cargo bench -p mkit-benches \
            --bench hashing --bench sign_verify \
            --bench object_commit --bench pack_create \
            -- --baseline committed

      - name: Regression check
        working-directory: rust
        env:
          MKIT_BENCH_TOLERANCE: ${{ github.event.inputs.tolerance || '0.25' }}
        run: cargo run -p mkit-benches --bin check-regressions

      # Report artifact even on a passing run: cheap, and useful for
      # eyeballing trend without re-running locally.
      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: criterion-report
          path: rust/target/criterion/**/report/**
          if-no-files-found: ignore
          retention-days: 14
