name: 'CI: Protocol conformance'

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'docs/specs/SPEC-SERVER.md'
      - 'docs/specs/SPEC-TRANSPORT-CONNECT.md'
      - '.github/workflows/conformance.yml'
      - '.github/actions/setup-rust/**'
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: '3'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  native-conformance:
    name: Native protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: '1.99.1'
          components: clippy
          cache-prefix: native-protocol-conformance
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest
      - name: Portable runner builds without reference orchestration
        run: |
          cargo check --locked -p mkit-server-conformance --no-default-features --all-targets
          cargo tree --locked -p mkit-server-conformance --no-default-features -e normal --prefix none --format '{p}' > "${RUNNER_TEMP}/conformance-dependencies.txt"
          if rg '^mkit-server v' "${RUNNER_TEMP}/conformance-dependencies.txt"; then
            echo '::error::portable conformance depends on reference orchestration'
            exit 1
          fi
      - name: Native wire, server-control, and optional storage suites
        run: cargo nextest run --locked -p mkit-server-conformance --all-features -j 3
