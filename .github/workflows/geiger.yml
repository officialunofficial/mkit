name: "Quality: cargo-geiger"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR; newer pushes cancel superseded runs. Pushes to main are
# never cancelled (key the guard off the event name, not github.ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  unsafe-ceiling:
    name: Assert unsafe ceiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-geiger
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            rust/target
          key: geiger-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            geiger-${{ runner.os }}-

      - name: Install cargo-geiger
        run: |
          if ! command -v cargo-geiger >/dev/null 2>&1; then
            cargo install --locked cargo-geiger --version 0.13.0
          fi

      - name: Check per-crate unsafe ceiling
        run: bash scripts/check-geiger-baseline.sh

      - name: Publish full geiger report (artifact)
        if: always()
        run: |
          cd rust/crates/mkit-cli
          cargo geiger --quiet > "$RUNNER_TEMP/geiger.txt" 2>&1 || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: cargo-geiger-report
          path: ${{ runner.temp }}/geiger.txt
          if-no-files-found: warn
          retention-days: 30
