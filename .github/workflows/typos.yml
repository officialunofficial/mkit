name: Typos

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spell-check:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run typos
        uses: crate-ci/typos@v1.46.1
        with:
          # Config lives at the repo root so contributors can run
          # `typos` locally with no extra flags.
          config: ./typos.toml
