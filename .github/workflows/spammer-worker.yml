name: "CI: Spammer Worker"

# Validation only. This Worker is workers.dev-only (no custom_domain/route —
# see wrangler.jsonc) and is NOT wired to Cloudflare Workers Builds' git
# integration the way apps/web/apps/mcp/apps/og are — deploying it is a
# manual `wrangler deploy` today, not merge-triggered. This workflow still
# exists to make sure typecheck/test/build never silently regress.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spammer-worker.yml'
      - 'apps/spammer-worker/**'
  # No `paths:` filter on pull_request: the workflow ALWAYS triggers on PRs so
  # its required check (spammer-worker-gate) is never absent. The `ci` job is
  # gated on the in-workflow paths-filter below instead — same pattern as
  # apps/og's workflow, avoiding the "required-but-skipped" trap where a
  # path-filtered trigger leaves a required status stuck pending on PRs that
  # don't touch spammer-worker paths.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether this PR touches anything the spammer worker depends on.
  # The `ci` job runs only when it does; the `spammer-worker-gate` job below
  # always runs and is the stable required-check name.
  changes:
    name: Detect spammer-worker-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      spammer-worker: ${{ steps.filter.outputs.spammer-worker }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            spammer-worker:
              - '.github/workflows/spammer-worker.yml'
              - 'apps/spammer-worker/**'

  ci:
    name: Typecheck and test the spammer worker
    # Run on main pushes (push is path-filtered at the trigger), and on PRs
    # only when spammer-worker-relevant paths changed.
    needs: changes
    if: >-
      always() &&
      (github.event_name == 'push' || needs.changes.outputs.spammer-worker == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install Rust 1.95.0 + wasm32 target
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: '1.95.0'
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Build the vendored wasm crates (mkit-wasm, mkit-repo-client)
        working-directory: apps/spammer-worker
        run: bun run wasm:build

      - name: Install spammer-worker dependencies
        working-directory: apps/spammer-worker
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/spammer-worker
        run: bun run typecheck

      - name: Test (coverage-enforced)
        working-directory: apps/spammer-worker
        run: bun run test:coverage

      - name: Build (wrangler deploy --dry-run)
        working-directory: apps/spammer-worker
        run: bun run build

  # Stable required-check name for branch protection. Always runs on PRs
  # (if: always()) so the status is never absent — closing the
  # "required-but-skipped" trap. Passes when the `ci` job succeeded OR was
  # legitimately skipped because the PR touched no spammer-worker-relevant
  # paths; fails if `ci` actually failed or was cancelled.
  spammer-worker-gate:
    name: Spammer Worker CI gate
    if: always() && github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check spammer-worker ci job result
        shell: bash
        env:
          CI: ${{ needs.ci.result }}
        run: |
          echo "ci: ${CI}"
          case "${CI}" in
            success|skipped)
              echo "Spammer Worker CI gate satisfied."
              ;;
            *)
              echo "::error::ci job did not succeed (result=${CI})"
              exit 1
              ;;
          esac
