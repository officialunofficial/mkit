# Nightly cargo-mutants run on mkit-core + mkit-attest. Reports the
# mutation score (% of injected bugs the test suite catches) and posts
# a comment to the commonware umbrella tracking issue so the score's
# trend is visible without needing to dig into Actions UI.
#
# Mutation testing flips operators (`+` → `-`, `==` → `!=`, etc.) and
# fails any mutation the test suite doesn't kill. Target ≥ 80% per
# issue #164.
#
# Scoped to mkit-core + mkit-attest in Phase 1 — the two crates with
# the highest invariant density. Expand to mkit-keystore / mkit-cli
# / mkit-rpc once the baseline is stable.

name: Mutation score

on:
  schedule:
    # 04:00 UTC daily — same window as other long-running nightly jobs.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # posting the comment

jobs:
  mutants:
    name: cargo-mutants ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crate: [mkit-core, mkit-attest]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: "1.95.0"

      - name: Install cargo-mutants + cargo-nextest
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154  # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: cargo-mutants
        id: mutants
        working-directory: rust
        # `--test-tool=nextest`: nextest's per-test process isolation
        # keeps mutated builds from corrupting cached artefacts.
        # `--no-shuffle`: deterministic for log diff readability.
        # `--timeout-multiplier 5`: mutated tests can be slower than
        # the baseline; default 1.5× is too tight on heavy invariants.
        run: |
          set -euo pipefail
          cargo mutants \
            --package "${{ matrix.crate }}" \
            --test-tool nextest \
            --no-shuffle \
            --timeout-multiplier 5 \
            --output ../mutants-report \
            --json > mutants.json || true
          # Score = caught / (caught + missed). Unviable + timeout are
          # excluded from the denominator (they didn't really test).
          python3 - <<'PY'
          import json, os, sys
          with open("mutants.json") as f:
              data = [json.loads(line) for line in f if line.strip()]
          caught = sum(1 for m in data if m.get("outcome") == "CaughtMutant")
          missed = sum(1 for m in data if m.get("outcome") == "MissedMutant")
          total = caught + missed
          score = caught / total * 100 if total else 0.0
          line = f"score={score:.1f} caught={caught} missed={missed} total={total}"
          print(line)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"score={score:.1f}\n")
              f.write(f"caught={caught}\n")
              f.write(f"missed={missed}\n")
              f.write(f"total={total}\n")
          PY

      - name: Upload mutation report
        uses: actions/upload-artifact@de65e23aa2b7e23d713bb51fbfcb6d502f8667d8  # v5
        with:
          name: mutants-${{ matrix.crate }}
          path: mutants-report/
          if-no-files-found: ignore

      - name: Comment score on tracking issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 161 --repo "$GITHUB_REPOSITORY" --body \
            "mutation-score nightly (${{ matrix.crate }}, $(date -u +%Y-%m-%d)): \
            **${{ steps.mutants.outputs.score }}%** \
            (caught=${{ steps.mutants.outputs.caught }}, \
            missed=${{ steps.mutants.outputs.missed }}, \
            total=${{ steps.mutants.outputs.total }})"
