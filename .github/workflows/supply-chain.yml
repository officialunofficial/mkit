name: Supply chain

# Guards:
#   1. Dependency review on every PR (fails on new deps or license changes
#      that violate policy).
#   2. OSSF Scorecard run weekly to produce a supply-chain health score.
#   3. SBOM refresh weekly so main always has a current CycloneDX SBOM
#      uploaded as an artifact.
#
# Policy lives in docs/release/SUPPLY-CHAIN.md.
#
# Post-Rust-cutover audit (Phase 10):
#   - dependency-review: enabled on pull_request events. Public-repo
#     Dependency Graph is sufficient for the advisory feed; license
#     blocking degrades to no-op without GHAS but we still get the
#     vulnerability gate, which is the priority.
#   - scorecard: language-agnostic; no changes needed.
#   - sbom-refresh: anchore/sbom-action (Syft) auto-detects Cargo.lock;
#     scanning path: . picks up rust/Cargo.lock correctly. No changes needed.
#   - cargo-audit: handled by rust-security.yml; not duplicated here.

on:
  pull_request:
  schedule:
    # Sundays at 09:00 UTC.
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (PRs)
    # Public-repo Dependency Graph gives us the advisory feed for free;
    # license enforcement requires GHAS but advisory enforcement does
    # not. If GHAS is off the action still runs and reports advisories;
    # license `deny-licenses` checks may no-op silently. That's an
    # acceptable failure mode: we'd rather get the vulnerability gate
    # than nothing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4
        with:
          # Fail the PR if any dep has a vuln at "moderate" or higher.
          fail-on-severity: moderate
          # Disallow licenses that are incompatible with MIT OR Apache-2.0.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: on-failure

  scorecard:
    name: OSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225  # v4
        with:
          sarif_file: scorecard-results.sarif

  sbom-refresh:
    name: Refresh SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: weekly-sbom
          path: sbom.cdx.json
          retention-days: 90
