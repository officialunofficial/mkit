name: "Security: Supply Chain"

# Guards:
#   1. Dependency review on every PR (fails on new deps or license changes
#      that violate policy).
#   2. OSSF Scorecard run weekly to produce a supply-chain health score.
#   3. SBOM refresh weekly so main always has a current CycloneDX SBOM
#      uploaded as an artifact.
#
# Policy lives in docs/RELEASE.md.
#
# Supply-chain audit pass:
#   - dependency-review: opt-in via `ENABLE_DEPENDENCY_REVIEW=1` so
#     forks / mirrors without Dependency Graph do not fail closed.
#     Once enabled, it gates PRs on new vulns + blocked licenses.
#   - scorecard: language-agnostic; no changes needed.
#   - sbom-refresh: anchore/sbom-action (Syft) auto-detects Cargo.lock;
#     scanning path: . picks up rust/Cargo.lock correctly. No changes needed.
#   - cargo-audit: handled by rust-security.yml; not duplicated here.

on:
  pull_request:
  schedule:
    # Sundays at 09:00 UTC.
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (PRs, opt-in)
    # This action fails closed with "Dependency review is not supported
    # on this repository" when Dependency Graph is unavailable. To keep
    # the workflow reusable across forks and internal mirrors, the job is
    # guarded by a repo/org Actions variable instead of a hardcoded
    # `if: false`.
    #
    # Safe default:
    #   - Leave `ENABLE_DEPENDENCY_REVIEW` unset (or != '1') on repos
    #     that do not expose Dependency Graph. The job stays skipped.
    #   - Set `ENABLE_DEPENDENCY_REVIEW=1` after Dependency Graph is
    #     available in Settings -> Security -> Dependency graph.
    #
    # The vulnerability gate is meanwhile covered by:
    #   - cargo-audit (rust-security.yml, runs on every push + weekly)
    #   - cargo-deny advisories (deny.toml, gates `cargo deny check`)
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
        with:
          # Fail the PR if any dep has a vuln at "moderate" or higher.
          fail-on-severity: moderate
          # Disallow licenses that are incompatible with MIT OR Apache-2.0.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: on-failure

  scorecard:
    name: OSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          sarif_file: scorecard-results.sarif

  sbom-refresh:
    name: Refresh SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: weekly-sbom
          path: sbom.cdx.json
          retention-days: 90
