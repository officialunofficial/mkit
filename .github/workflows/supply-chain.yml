name: Supply chain

# Guards:
#   1. Dependency review on every PR (fails on new deps or license changes
#      that violate policy).
#   2. OSSF Scorecard run weekly to produce a supply-chain health score.
#   3. SBOM refresh weekly so main always has a current CycloneDX SBOM
#      uploaded as an artifact.
#
# Policy lives in docs/release/SUPPLY-CHAIN.md.

on:
  pull_request:
  schedule:
    # Sundays at 09:00 UTC.
    - cron: '0 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # TODO(ci): flip back to a hard gate (drop this line) once
    # `actions/dependency-review-action` stops reporting "not supported
    # on this repository". Dependency Graph has been enabled in repo
    # settings but the action still 404s — likely a GHAS sub-feature
    # toggle or propagation delay. Until then, keep this non-blocking
    # so the workflow doesn't block PRs on a repo-level admin setting.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the PR if any dep has a vuln at "moderate" or higher.
          fail-on-severity: moderate
          # Disallow licenses that are incompatible with MIT OR Apache-2.0.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          comment-summary-in-pr: on-failure

  scorecard:
    name: OSSF Scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif

  sbom-refresh:
    name: Refresh SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-sbom
          path: sbom.cdx.json
          retention-days: 90
