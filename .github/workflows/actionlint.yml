name: "Meta: actionlint"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/dependabot.yml'
      - 'scripts/check-dependabot-coverage.sh'
      - 'scripts/check-no-windows-target.sh'
      - 'justfile'
      - 'rust/crates/*/Cargo.toml'
      - 'contrib/**/Cargo.toml'
      - 'install.sh'
      - 'apps/web/package.json'
      - 'apps/web/scripts/*.mjs'
      - 'apps/web/.gitignore'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/dependabot.yml'
      - 'scripts/check-dependabot-coverage.sh'
      - 'scripts/check-no-windows-target.sh'
      - 'justfile'
      - 'rust/crates/*/Cargo.toml'
      - 'contrib/**/Cargo.toml'
      - 'install.sh'
      - 'apps/web/package.json'
      - 'apps/web/scripts/*.mjs'
      - 'apps/web/.gitignore'

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `rhysd/actionlint` is the upstream; the docker image is pinned
      # by tag for reproducibility. shellcheck is bundled so the
      # `run:` blocks get linted too.
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
        shell: bash

      # shellcheck is bundled into actionlint. We restrict it to
      # `error` severity so the gate fails only on real bugs, not on
      # pre-existing style suggestions (SC2129, SC2155, etc.) across
      # release.yml / reproducible-build.yml. Tighten the severity here
      # once those are cleaned up in a follow-up.
      - name: Run actionlint
        run: |
          ${{ steps.get_actionlint.outputs.executable }} \
            -color \
            -shellcheck="shellcheck -S error"
        shell: bash

      # Dependabot opens a PR that edits a manifest but never touches a
      # lockfile of the wrong format, which then fails CI's frozen-lockfile
      # install and gets closed unmerged (see .github/dependabot.yml's
      # per-entry comments). Catch a mismatched or missing entry here,
      # before it costs a PR round-trip.
      - name: Check Dependabot coverage
        run: bash scripts/check-dependabot-coverage.sh
        shell: bash

      # Windows is not a supported build/test/release target (MKIT-6; see
      # docs/INVARIANTS.md) — commonware-runtime 2026.9.0's non-Linux sync
      # path calls a libc function absent on the Windows MSVC target, so the
      # workspace no longer builds there. Catch a reintroduced Windows CI
      # leg, keystore backend, or installer artifact here instead of a red
      # build discovered later.
      - name: Check no Windows target
        run: bash scripts/check-no-windows-target.sh
        shell: bash
