# SECURITY: This workflow runs with pull_request_target privileges.
# Do NOT add `actions/checkout` with `ref: ${{ github.event.pull_request.head.sha }}`
# or any step that executes code from the PR — that would create a privilege
# escalation path. Keep this workflow strictly to metadata checks on PR fields.

name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits types we accept on PR titles. The
          # squash-merge strategy in this repo turns the PR title into
          # the commit subject, so this is the gate for commit-message
          # quality on main.
          types: |
            feat
            fix
            chore
            docs
            ci
            build
            perf
            refactor
            revert
            style
            test
            release
            security
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The PR title subject (everything after the type/scope) must start
            with a lowercase letter. Examples:
              feat(cli): add `mkit attest verify` flag
              fix(transport-http): retry on 429 with backoff
