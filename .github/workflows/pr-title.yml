name: PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits types we accept on PR titles. The
          # squash-merge strategy in this repo turns the PR title into
          # the commit subject, so this is the gate for commit-message
          # quality on main.
          types: |
            feat
            fix
            chore
            docs
            ci
            build
            perf
            refactor
            revert
            style
            test
            release
            security
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The PR title subject (everything after the type/scope) must start
            with a lowercase letter. Examples:
              feat(cli): add `mkit attest verify` flag
              fix(transport-http): retry on 429 with backoff
