name: "CI: Coverage"

on:
  push:
    branches: [main]
    # Coverage only reflects the Rust workspace + contrib signers; skip it on
    # main pushes that can't change them (docs/MCP/web-only commits).
    paths:
      - '.github/workflows/coverage.yml'
      - '.github/actions/setup-rust/**'
      - 'rust/**'
      - 'contrib/signers/**'
  # Expensive CI: on PRs, run only once a review is approved (gated below).
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded approval runs; pushes to main are never cancelled.
  # (On pull_request_review github.ref is the default branch, so we can't key
  # the guard off github.ref — gate on the event name instead.)
  cancel-in-progress: ${{ github.event_name == 'pull_request_review' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"
  CARGO_INCREMENTAL: 0

jobs:
  llvm-cov:
    name: cargo-llvm-cov (nextest)
    # Run on main pushes; on PRs only after an approving review.
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # pull_request_review defaults to the base branch — check out the
          # PR head so coverage reflects the PR. github.sha on push.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Phase-2 commonware adoption doubled the workspace target footprint.
      # cargo-llvm-cov compiles instrumented binaries that are ~3x larger
      # than a regular debug build — free ~14 GiB before the run.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # Toolchain (llvm-tools-preview) + protoc + cache. cache-prefix is
      # partitioned so this key can't poison a privileged workflow's cache.
      - name: Set up Rust, protoc, and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
          cache-prefix: coverage-${{ runner.os }}

      # Same native deps as rust.yml — the workspace's --all-features
      # path pulls in the TPM / CTAP signers on Linux, and coverage
      # needs every test target to compile.
      - name: Install native signer deps
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev libpcsclite-dev pkg-config swtpm

      - name: Install cargo-llvm-cov + cargo-nextest
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595  # v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # mkit-cli's attest_roundtrip tests drive the mkit-sign-file reference
      # binary from contrib/signers/target/debug/ (a separate workspace, see
      # #225). Prebuild it so the tests don't fall back to building it
      # on-the-fly inside the coverage run, where cargo-llvm-cov's RUSTFLAGS
      # would leak into the fixture build.
      - name: Prebuild contrib signer fixture (mkit-sign-file)
        working-directory: contrib/signers
        run: cargo build --locked -p mkit-sign-file

      # Coverage from the same nextest run rust.yml gates on. Doctests
      # are NOT included: `cargo llvm-cov --doc` needs nightly
      # (`-Z unstable-options --persist-doctests`), and the workspace
      # pins to stable per rust-toolchain.toml. rust.yml already
      # exercises doctests for correctness in a separate step.
      - name: Collect coverage
        working-directory: rust
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report nextest --locked --workspace --all-features
          cargo llvm-cov report --html --output-dir "$RUNNER_TEMP/coverage-html"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/coverage.lcov"
          # Emit a numeric summary for the workflow output.
          cargo llvm-cov report --summary-only | tee "$RUNNER_TEMP/coverage-summary.txt"

      - name: Append summary to job output
        run: |
          {
            echo "## Coverage summary"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/coverage-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-html
          path: ${{ runner.temp }}/coverage-html
          retention-days: 14

      - name: Upload lcov
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-lcov
          path: ${{ runner.temp }}/coverage.lcov
          retention-days: 14

  # Codecov upload is split into its own job so CODECOV_TOKEN is NEVER present
  # in the job above, which checks out and EXECUTES untrusted PR-head code on
  # the privileged `pull_request_review` event. This job runs only the
  # base-branch workflow file plus pinned actions — it downloads the lcov
  # artifact and never builds or runs PR source, so the token cannot be
  # exfiltrated by a malicious fork PR.
  codecov-upload:
    name: Upload coverage to Codecov
    needs: llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Download lcov artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: coverage-lcov
          path: coverage

      # Codecov receives the lcov for badge / trend / PR-diff overlay.
      # The action uploads under codecov.io/gh/officialunofficial/mkit.
      # Failures are non-fatal: CI green doesn't depend on Codecov's
      # availability.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.lcov
          flags: rust
          name: cargo-llvm-cov
          fail_ci_if_error: false
          # Point Codecov at the PR head on approval so the diff overlay lands
          # on the right commit; fall back to github.sha on push so
          # override_commit is never empty. override_pr is naturally empty on
          # push — a baseline upload has no PR.
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_pr: ${{ github.event.pull_request.number }}
