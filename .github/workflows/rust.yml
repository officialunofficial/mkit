name: "CI: Rust"

on:
  push:
    branches:
      - main
    # Skip the full matrix on main pushes that can't affect the Rust build
    # (docs-only, MCP-only, web-only commits). The pull_request_review trigger
    # below is unaffected — it can't be path-filtered and stays approval-gated.
    paths:
      - '.github/workflows/rust.yml'
      - '.github/actions/setup-rust/**'
      - 'rust/**'
      - 'contrib/signers/**'
  # Expensive CI: on PRs this runs only once a review is approved. The
  # pull_request_review event can't filter by branch/path, so each job
  # guards on the approval state + base ref below.
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# One run per PR (or per branch on push); newer events cancel older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded approval runs; pushes to main are never cancelled.
  # (On pull_request_review github.ref is the default branch, so we can't key
  # the guard off github.ref — gate on the event name instead.)
  cancel-in-progress: ${{ github.event_name == 'pull_request_review' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"
  # Match Swatinem/rust-cache's expectations.
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    # Run on main pushes; on PRs only after an approving review.
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          # On approval (pull_request_review) the default ref is the base
          # branch — check out the PR head so we test the PR's code. On
          # push, github.sha is already the right commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Phase-2 commonware adoption pulled in tokio + axum + criterion +
      # reed-solomon, doubling the post-nextest `target/` footprint past
      # what the ubuntu-latest runner ships with (~14 GiB free of 75 GiB).
      # Free the Android SDK / .NET / Haskell tree before the build so the
      # doctest step has room. ~14 GiB recovered; the action is a no-op on
      # macOS (only runs when `if` matches).
      - name: Free disk space (Linux only)
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # Toolchain (rustfmt + clippy) + protoc + lockfile-keyed cargo cache.
      # cache-prefix is partitioned per-workflow + per-runner so a malicious PR
      # cannot poison a key a privileged workflow (release.yml) later reads —
      # see .github/actions/setup-rust and docs/RELEASE.md.
      - name: Set up Rust, protoc, and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          cache-prefix: "rust-ci-${{ matrix.os }}"

      # cargo-nextest: faster + structured test runner. Replaces
      # `cargo test`. Pinned via taiki-e/install-action which fetches a
      # cosign-signed prebuilt binary from the cargo-nextest release.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9  # v2
        with:
          tool: cargo-nextest

      # Native packages needed by optional signers when --all-features
      # turns them on across the workspace. macOS gates these deps out
      # via target_os, so we only install on Linux:
      #   libtss2-dev   → mkit-sign-tpm's `tpm2` feature (tss-esapi)
      #   libudev-dev   → mkit-sign-ctap (via hidapi → libudev)
      #   libpcsclite-dev → mkit-keystore `backend-yubikey` PC/SC support
      #   swtpm         → integration tests against a software TPM
      #                   when -F tpm-mssim is enabled
      - name: Install native signer deps (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev libpcsclite-dev pkg-config swtpm

      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Build
        working-directory: rust
        run: cargo build --locked --workspace

      # The reference external signers are a SEPARATE workspace
      # (contrib/signers/) so they don't break release-plz's crates.io publish
      # (#225). `--workspace` above no longer covers them, so build/test/lint
      # them here. --all-features turns on tpm2 (tss-esapi, Linux/Windows-gated)
      # and ctap-hw (ctap-hid-fido2); the native deps installed above cover the
      # Linux build. This step must run BEFORE the workspace nextest step:
      # mkit-cli's attest_roundtrip tests drive the mkit-sign-file binary from
      # contrib/signers/target/debug/ and only fall back to building it
      # on-the-fly when it's missing.
      # No doctest pass here: the signers are bin-only crates and
      # `cargo test --doc` hard-errors with "no library targets found"
      # when a workspace has no lib targets (doctests only exist in libs).
      - name: Contrib signers (separate workspace)
        working-directory: contrib/signers
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo build --locked --all-features
          cargo nextest run --locked --all-features

      - name: Test (nextest)
        working-directory: rust
        run: cargo nextest run --locked --workspace --all-features

      - name: Fuzz unit tests
        working-directory: rust
        run: cargo test --manifest-path fuzz/Cargo.toml

      # Doctests are not run by `cargo nextest`. Run them separately so
      # docstring examples still get exercised.
      - name: Doctests
        working-directory: rust
        run: cargo test --locked --doc --workspace

      # The repo-wide rename gate moved to its own workflow (rename-gate.yml):
      # its scan covers paths beyond this matrix's Rust-only push:main filter,
      # so coupling it here would skip it on main pushes that touch only those
      # other paths. See that workflow's header.

      - name: Version contract
        working-directory: rust
        shell: bash
        run: |
          cargo build --release --locked -p mkit-cli
          out=$(./target/release/mkit version)
          expected="mkit $(awk -F\" '/^version/ {print $2; exit}' Cargo.toml)"
          echo "stdout:   [$out]"
          echo "expected: [$expected]"
          if [ "$out" != "$expected" ]; then
            echo "::error::mkit version contract violated — stdout is not exactly 'mkit <X.Y.Z>\\n'"
            exit 1
          fi

      # Phase 2 of issue #156: build the CLI with the dedicated
      # `enc-transport` cargo feature and run the encrypted-transport
      # e2e test. The above `--all-features` test pass already covers
      # this in aggregate; the dedicated invocation pins the feature
      # gate so a future refactor can't silently break the
      # opt-in-only build path.
      - name: Encrypted-transport feature build (Phase 2)
        working-directory: rust
        run: |
          cargo build --locked -p mkit-cli --features enc-transport
          cargo test --locked -p mkit-transport-enc --features tcp --no-fail-fast

  keystore-backends:
    name: Keystore backends (${{ matrix.name }})
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-keychain-yubikey
            os: macos-latest
            features: backend-macos-keychain backend-yubikey
          - name: windows-credential
            os: windows-latest
            features: backend-windows-credential
          - name: linux-secret-systemd-yubikey
            os: ubuntu-latest
            features: backend-linux-secret-service backend-systemd-creds backend-yubikey
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          # On approval (pull_request_review) the default ref is the base
          # branch — check out the PR head so we test the PR's code. On
          # push, github.sha is already the right commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Keystore backends never compile mkit-rpc, so protoc is skipped here.
      - name: Set up Rust and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
          cache-prefix: "rust-keystore-${{ matrix.name }}"
          protoc: "false"

      - name: Install Linux keystore native deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libpcsclite-dev pkg-config

      - name: Test keystore backend feature set
        working-directory: rust
        shell: bash
        env:
          MKIT_RUN_NATIVE_KEYSTORE_TESTS: "1"
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            dbus-run-session -- bash -lc '
              set -euo pipefail
              eval "$(printf "mkit-ci\n" | gnome-keyring-daemon --unlock --components=secrets)"
              cargo test --locked -p mkit-keystore --features "${{ matrix.features }}"
              cargo test --locked -p mkit-keystore --features "${{ matrix.features }}" \
                backend_linux_secret_service::tests::live_backend_create_open_list_export_delete_roundtrip -- --exact --ignored
            '
            sudo env \
              "PATH=$PATH" \
              "CARGO_HOME=$CARGO_HOME" \
              "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              "CARGO_TARGET_DIR=$RUNNER_TEMP/mkit-systemd-creds-target" \
              "MKIT_RUN_NATIVE_KEYSTORE_TESTS=1" \
              "MKIT_RUN_SYSTEMD_CREDS_TESTS=1" \
            cargo test --locked -p mkit-keystore --features "backend-systemd-creds" \
                backend_systemd_creds::tests::live_backend_create_open_list_export_delete_roundtrip -- --exact --ignored
          else
            cargo test --locked -p mkit-keystore --features "${{ matrix.features }}"
            cargo test --locked -p mkit-keystore --features "${{ matrix.features }}" -- --ignored
          fi

      - name: Clippy keystore backend feature set
        working-directory: rust
        shell: bash
        run: cargo clippy --locked -p mkit-keystore --features "${{ matrix.features }}" --all-targets -- -D warnings


  # Minimum-supported Rust version gate. Reads `rust-version` from
  # rust/Cargo.toml so the source of truth stays in one place; if a dep
  # bump pulls in something that requires a newer rustc, this job fails
  # before users on the pinned MSRV are affected.
  msrv:
    name: MSRV check
    if: >-
      github.event_name != 'pull_request_review' ||
      (github.event.review.state == 'approved' &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          # On approval (pull_request_review) the default ref is the base
          # branch — check out the PR head so we test the PR's code. On
          # push, github.sha is already the right commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve MSRV from rust/Cargo.toml
        id: msrv
        shell: bash
        run: |
          # Pulls the first `rust-version = "X.Y"` line from the
          # workspace package table. Quote-stripped via awk -F'"'.
          MSRV=$(awk -F'"' '/^[[:space:]]*rust-version[[:space:]]*=/ {print $2; exit}' rust/Cargo.toml)
          if [ -z "${MSRV}" ]; then
            echo "::error::could not read rust-version from rust/Cargo.toml"
            exit 1
          fi
          echo "msrv=${MSRV}" >> "$GITHUB_OUTPUT"
          echo "MSRV resolved to ${MSRV}"

      - name: Set up Rust, protoc, and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
          cache-prefix: "rust-msrv-${{ steps.msrv.outputs.msrv }}"

      - name: Install native deps
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev

      - name: cargo check (workspace, locked)
        working-directory: rust
        env:
          CARGO_INCREMENTAL: 0
        run: cargo check --workspace --locked --all-targets
