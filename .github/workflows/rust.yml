name: "CI: Rust"

# Scope note: the Linux Rust gates (fmt/clippy/build/nextest/doctests, msrv,
# codegen-freshness, supply-chain, docs, geiger, coverage) and the Darwin
# type-check run on Google Cloud Build — see cloudbuild/README.md. The macOS
# and keystore legs live in native.yml. This workflow keeps the server
# feature-combination clippy and the patch API checks, which feed the stable
# Rust CI gate below.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per branch on manual dispatch); newer PR events cancel
# older ones. Manual dispatch runs are never auto-cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"
  # Match Swatinem/rust-cache's expectations.
  CARGO_INCREMENTAL: 0

jobs:
  primitives:
    name: Primitives contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: clippy
          protoc: "false"
          cache-prefix: primitives
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-nextest,cargo-hack,just,sccache
      - name: Native feature contracts
        working-directory: rust
        run: |
          cargo clippy --locked -p mkit-primitives -p mkit-primitives-fuzz --all-targets --all-features -- -D warnings
          cargo nextest run --locked -p mkit-primitives -p mkit-primitives-fuzz -j 3
          cargo nextest run --locked -p mkit-primitives --no-default-features --features pack-zstd -j 3
          cargo hack check --locked -p mkit-primitives --lib --feature-powerset
          cargo nextest run --locked -p mkit-primitives --no-default-features --test closure_platform -j 3
          cargo nextest run --locked -p mkit-primitives --all-features --test closure_platform -j 3
          cargo test --locked -p mkit-primitives --doc
          cargo test --locked -p mkit-primitives --no-default-features --doc
      - name: Wasm contracts
        working-directory: rust
        run: |
          cargo check --locked -p mkit-primitives --target wasm32-unknown-unknown
          cargo check --locked -p mkit-primitives --no-default-features --target wasm32-unknown-unknown
      - name: Install wasm fixture runner
        run: cargo install wasm-pack --locked --version 0.13.1
      - name: Execute closure fixtures on 32-bit wasm
        working-directory: rust/crates/mkit-primitives
        run: wasm-pack test --node
      - name: Packaged consumer, native and wasm32
        run: python3 scripts/check-primitives-consumer.py
      - name: Graph, fixtures, and stability
        run: |
          python3 scripts/test-publish-primitives.py
          python3 scripts/publish-primitives.py check
          python3 scripts/fmt-primitives.py --check
          python3 scripts/check-primitives-graph.py
          python3 scripts/check-primitives-fixtures.py
          python3 scripts/test-primitives-infrastructure.py
          just check-primitives-stability

  server-feature-clippy:
    name: Server feature combinations (${{ matrix.crate }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        crate: [mkit-server, mkit-rpc, mkit-client, mkit-sync]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          cache-prefix: server-feature-clippy-${{ matrix.crate }}
          protoc: "false"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-hack
      # Library-only avoids dev-dependency feature unification. Depth two
      # and the per-crate timeout bound the combinatorial cost.
      - name: Check feature names
        working-directory: rust
        run: python3 ../scripts/check-feature-names.py
      - name: Clippy feature powerset (depth two)
        working-directory: rust
        run: cargo hack clippy --locked -p ${{ matrix.crate }} --lib --feature-powerset --depth 2 -- -D warnings
      - name: Clippy default features (including tests)
        working-directory: rust
        run: cargo clippy --locked -p ${{ matrix.crate }} --all-targets -- -D warnings
      - name: Clippy all features (library)
        working-directory: rust
        run: cargo clippy --locked -p ${{ matrix.crate }} --lib --all-features -- -D warnings

  native-wire-conformance:
    name: Native HTTP wire conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: native-wire-conformance
          targets: wasm32-unknown-unknown
          protoc: "false"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-nextest,wasm-pack@0.13.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify native gate wiring and bounded decoder graph
        run: |
          python3 scripts/test-publish-bounded-decoder.py
          python3 scripts/test-server-gates.py --hosted-only
          python3 scripts/check-launch-feature-graph.py
      - name: Native bounded decoder parity
        working-directory: rust
        run: cargo nextest run --locked -p mkit-core --all-features --lib -j 3 -E 'test(zstd_tests)' --failure-output immediate
      - name: Bounded decoder on wasm32
        run: bash scripts/wasm-ruzstd-check.sh
      - name: Native TestHost contracts over HTTP
        working-directory: rust
        run: cargo nextest run --locked -p mkit-server-conformance --features test-host --lib --test test_host --test test_host_migrations --test test_host_regressions -j 3 --success-output immediate --failure-output immediate --no-fail-fast

  server-semver:
    name: Server patch API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: server-semver
          protoc: "false"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-semver-checks
      # main retains the released version until release preparation, and is
      # accumulating 0.6 changes with no 0.5.x patch release planned. A 0.x
      # crate's next minor release (0.6.0) may break its public API, which
      # cargo-semver-checks calls the "major" release type for 0.x versions;
      # "minor" would still reject a breaking change.
      # TODO(0.6.0 release prep): restore `--release-type patch` against the
      # 0.6.0 baseline once 0.6.0 is tagged (see docs/RELEASE.md).
      - name: Check server 0.6 API against 0.5.0
        working-directory: rust
        run: cargo semver-checks -p mkit-server --all-features --baseline-version 0.5.0 --release-type major

      # All-features enables the performance wrapper, which already boxes
      # stages. Exercise the plain path and the wasm-compatible decoder too.
      - name: Extraction stack and future bounds without performance instrumentation
        working-directory: rust
        env:
          CARGO_BUILD_JOBS: '3'
          CARGO_PROFILE_DEV_DEBUG: '2'
        run: |
          cargo test --locked -p mkit-server --no-default-features --features memory,pack-ruzstd,futures/default --lib fifty_deep_quota_boundary_uses_a_small_stack -- --test-threads 3
          cargo test --locked -p mkit-server --no-default-features --features memory,pack-ruzstd,futures/default --lib maximum_configured_member_chain_matches_native_on_a_small_stack -- --test-threads 3
          cargo test --locked -p mkit-server --no-default-features --features memory,pack-ruzstd,futures/default --lib extraction_step_futures_stay_small -- --test-threads 3

  # mkit-client is the runtime-independent protocol client. Its wasm32 build is
  # the product requirement, so it is built (not only checked) for the real
  # target, and its dependency graph is held free of async runtimes and C
  # compression (scripts/check-wasm-dep-graph.sh).
  client-wasm:
    name: mkit-client wasm32 build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          cache-prefix: client-wasm
      - name: Build mkit-client for wasm32
        working-directory: rust
        run: cargo build --locked -p mkit-client --target wasm32-unknown-unknown
      - name: Build mkit-client without a zstd decoder for wasm32
        working-directory: rust
        run: cargo build --locked -p mkit-client --no-default-features --target wasm32-unknown-unknown
      - name: Dependency graph has no runtime or C compression
        run: bash scripts/check-wasm-dep-graph.sh

  # mkit-sync's `connect-native` feature is a small native HTTP channel: gzip
  # only, no zstd-sys, no second C crypto library, no HTTP/2 or Connect runtime.
  # The gate reads the resolved dependency graph for the embedding addon's build.
  sync-native-deps:
    name: mkit-sync connect-native dependency gate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: sync-native-deps
          protoc: "false"
      - name: Dependency graph has no zstd and no heavy runtime
        run: bash scripts/check-sync-native-deps.sh

  ci-gate:
    name: Rust CI gate
    if: always()
    needs: [primitives, server-feature-clippy, server-semver, client-wasm, sync-native-deps, native-wire-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no critical job failed
        shell: bash
        env:
          PRIMITIVES: ${{ needs.primitives.result }}
          SERVER_FEATURE_CLIPPY: ${{ needs.server-feature-clippy.result }}
          NATIVE_WIRE: ${{ needs.native-wire-conformance.result }}
          SERVER_SEMVER: ${{ needs.server-semver.result }}
          CLIENT_WASM: ${{ needs.client-wasm.result }}
          SYNC_NATIVE_DEPS: ${{ needs.sync-native-deps.result }}
        run: |
          fail=0

          if [ "${PRIMITIVES}" != success ]; then
            echo "::error::Primitives contract gates did not succeed"
            fail=1
          fi

          for result in "${NATIVE_WIRE}" "${SERVER_FEATURE_CLIPPY}" "${SERVER_SEMVER}" "${CLIENT_WASM}" "${SYNC_NATIVE_DEPS}"; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "::error::Server compatibility job did not succeed (result=${result})"
                fail=1
                ;;
            esac
          done

          if [ "${fail}" -ne 0 ]; then
            echo "::error::Rust CI gate failed — see job results above."
            exit 1
          fi
          echo "All critical Rust jobs satisfied the gate."
