name: MCP Worker Deploy

# Continuous deploy of the MCP Worker CODE on merge to main, so fixes to the
# server `instructions`, tool descriptions, and search logic reach connected
# agents without waiting for the next release tag. This NEVER touches the
# corpus: the Worker is stateless and reads whatever versions D1 already
# holds, so it cannot violate the per-version immutability that
# mcp-release.yml maintains. Paths are deliberately narrow — docs/SKILL/README
# edits do NOT trigger a deploy (their content only ships with a release seed).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-worker-deploy.yml'
      - 'mcp/src/**'
      - 'mcp/wrangler.jsonc'
      - 'mcp/package.json'
      - 'mcp/package-lock.json'
      - 'mcp/tsconfig.json'

permissions:
  contents: read

# Serialize against the release workflow.
concurrency:
  group: mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Typecheck, test, and deploy the Worker
    runs-on: ubuntu-latest
    environment: mcp
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Typecheck + test (gates the deploy)
        working-directory: mcp
        run: npm run ci

      - name: Deploy Worker
        working-directory: mcp
        run: npm run deploy
