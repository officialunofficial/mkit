name: "Meta: Rename Gate"

# Asserts the public build surface carries no pre-rename upstream-project
# tokens (the exact strings live in scripts/verify-rename.sh's FORBIDDEN array,
# not here — this file is itself scanned). This was previously a step inside
# CI:Rust, but that workflow's push:main trigger is path-filtered to the Rust
# build (rust/, contrib-signers); the scan must cover a WIDER set of paths
# (man/, completions/, README, etc.). Coupling the gate to the Rust matrix
# would silently skip it on main pushes that touch only those other paths. So
# it lives here with its own filter mirroring verify-rename.sh's SCAN_PATHS —
# keep the two lists in lockstep. (actionlint rejects a YAML anchor for
# `paths:`, so the push/pull_request lists are duplicated literally.)
#
# Cheap (a grep scan, no toolchain), so unlike the review-gated CI:Rust it runs
# on every PR rather than waiting for an approving review.

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'contrib/**'
      - 'completions/**'
      - 'man/**'
      - '.github/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'scripts/verify-rename.sh'
  pull_request:
    paths:
      - 'rust/**'
      - 'contrib/**'
      - 'completions/**'
      - 'man/**'
      - '.github/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'scripts/verify-rename.sh'

permissions:
  contents: read

# Cancel superseded PR runs; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rename-gate:
    name: Assert no pre-rename tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Rename gate
        run: bash scripts/verify-rename.sh
