name: Feature request
description: Propose a new capability or behaviour change.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for design discussions and concrete proposals.
        For changes to on-disk or wire formats, plan on a SPEC update
        landing alongside the implementation — see
        [CONTRIBUTING.md](https://github.com/officialunofficial/mkit/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: user-story
    attributes:
      label: User story
      description: Who is this for and what are they trying to do?
      placeholder: "As a <role>, I want <capability>, so that <outcome>."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why this one is preferable.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Willing to contribute the change?
      options:
        - "Yes — I plan to send a PR"
        - "Maybe — happy to help with review or testing"
        - "No — filing for visibility only"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links to prior art, related issues, or sketches.
    validations:
      required: false
