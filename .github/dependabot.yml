# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(actions)"
    groups:
      # Batch minor/patch bumps of actions into a single PR each week so
      # the reviewer load stays low; open separate PRs only for major
      # bumps (where a breaking change review matters).
      actions-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/rust"
    # buffa & connectrpc are vendored-codegen deps: their generated code is
    # committed under */generated/ and only compiles against a runtime when
    # regenerated by the matching *-build. A version-only bump leaves stale
    # codegen that fails against the new runtime, so they are bumped by hand
    # via scripts/regen-*.sh (enforced by scripts/check-generated-fresh.sh),
    # not by Dependabot.
    ignore:
      - dependency-name: "buffa*"
      - dependency-name: "connectrpc*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(rust)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "deps(web)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mcp"
    commit-message:
      prefix: "deps(mcp)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contrib/signers"
    # buffa is a vendored-codegen dep: its generated code is committed and only
    # compiles against a runtime when regenerated by the matching buffa-build.
    # Bump by hand via scripts/regen-*.sh, not Dependabot.
    ignore:
      - dependency-name: "buffa*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(signers)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"
