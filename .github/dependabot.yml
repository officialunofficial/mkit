# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(actions)"
    groups:
      # Batch minor/patch bumps of actions into a single PR each week so
      # the reviewer load stays low; open separate PRs only for major
      # bumps (where a breaking change review matters).
      actions-minor:
        update-types:
          - "minor"
          - "patch"

  # A `directory: "/"` github-actions entry only scans .github/workflows/ —
  # it does NOT reach into composite actions under .github/actions/, so each
  # composite action needs its own entry to get version-pin bumps at all.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-rust"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/rust"
    # buffa & connectrpc are vendored-codegen deps: their generated code is
    # committed under */generated/ and only compiles against a runtime when
    # regenerated by the matching *-build. A version-only bump leaves stale
    # codegen that fails against the new runtime, so they are bumped by hand
    # via scripts/regen-*.sh (enforced by scripts/check-generated-fresh.sh),
    # not by Dependabot.
    ignore:
      - dependency-name: "buffa*"
      - dependency-name: "connectrpc*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(rust)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"

  # apps/repo-worker, apps/vcs-worker, apps/keys-worker, and
  # apps/mkit-worker-common are separate Cargo workspaces (own Cargo.lock)
  # that path-depend on rust/crates/mkit-core; a bump in /rust does not
  # touch their locks, so they need their own entries to get security and
  # transitive updates at all. repo-worker and vcs-worker also vendor
  # buffa/connectrpc codegen under generated/ (see /rust's ignore comment
  # above) — the same ignore applies here for the same reason.
  - package-ecosystem: "cargo"
    directory: "/apps/keys-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(workers)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/apps/repo-worker"
    ignore:
      - dependency-name: "buffa*"
      - dependency-name: "connectrpc*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(workers)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/apps/vcs-worker"
    ignore:
      - dependency-name: "buffa*"
      - dependency-name: "connectrpc*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(workers)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/apps/mkit-worker-common"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(workers)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "deps(web)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mcp"
    commit-message:
      prefix: "deps(mcp)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/apps/og"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "og"
    commit-message:
      prefix: "deps(og)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bun"
    directory: "/apps/spammer-worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(spammer-worker)"
    groups:
      npm-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/contrib/signers"
    # contrib/signers is a SEPARATE workspace with its own lockfile; its buffa
    # RUNTIME version must stay in lockstep with the main workspace's
    # vendored-codegen buffa (they share the signer wire protocol). Bump it
    # deliberately alongside the main workspace, not via a standalone PR.
    ignore:
      - dependency-name: "buffa*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(signers)"
    groups:
      cargo-minor:
        update-types:
          - "minor"
          - "patch"
