[workspace]
resolver = "3"
# `fuzz` is the cargo-fuzz crate. It's a workspace member so
# `cargo test -p mkit-fuzz` runs its plain-unit-test fallback path
# (without libfuzzer / nightly). The libfuzzer-driven binaries under
# `fuzz/fuzz_targets/` are gated behind `--features libfuzzer` so the
# default `cargo build` skips them.
members = [
    "crates/mkit-core",
    "crates/mkit-attest",
    "crates/mkit-git-bridge",
    "crates/mkit-keystore",
    "fuzz",
    "crates/mkit-transport-memory",
    "crates/mkit-transport-file",
    "crates/mkit-transport-http",
    "crates/mkit-transport-s3",
    "crates/mkit-transport-ssh",
    "crates/mkit-transport-enc",
    "crates/mkit-cli",
    "crates/mkit-rpc",
    "crates/mkit-wasm",
    "crates/mkit-repo-client",
    "benches",
    # The reference external-signer binaries (mkit-sign-{file,ctap,tpm}) are a
    # SEPARATE workspace under contrib/signers/ — see contrib/signers/Cargo.toml.
    # They were members here, but out-of-tree members (`../contrib/...`) break
    # release-plz's crates.io publishing (#225), and they're publish=false
    # reference impls anyway. CI builds/tests them via their own steps.
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/officialunofficial/mkit"
authors = ["Official Unofficial, Inc."]

# commonware-* is shipped as a single 2026.5.x release train; pinning
# the version here keeps every consumer (mkit-core, mkit-attest,
# mkit-transport-enc) in lockstep. Per-feature `default-features` /
# `features` flags are set at the consumer site because they vary by
# crate. Bump in a single commit when the train rolls.
[workspace.dependencies]
# default-features = false here matches the strictest consumer
# (mkit-attest / mkit-core). Consumers that want the default feature
# set can NOT re-enable it via `workspace = true` — they would need a
# direct path/version dep instead. The commonware crates only have a
# `std` default that we always pass explicitly anyway, so this is safe.
commonware-storage = { version = "=2026.5.0", default-features = false }
commonware-cryptography = { version = "=2026.5.0", default-features = false }
commonware-runtime = { version = "=2026.5.0" }
commonware-coding = { version = "=2026.5.0" }
commonware-codec = { version = "=2026.5.0", default-features = false }
commonware-parallel = { version = "=2026.5.0", default-features = false }
commonware-utils = { version = "=2026.5.0", default-features = false }
commonware-stream = { version = "=2026.5.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# `doc_lazy_continuation` fires on style-only indentation in module docs.
# We use it intentionally for vertically-aligned bullet lists — the
# auto-fix rewrites prose into one-line-per-item form which hurts
# readability. Silence at the workspace root.
doc_lazy_continuation = "allow"
# `module_inception` is fine for our generated buffa modules.
module_inception = "allow"
# Downstream transitive deps (wit-bindgen via getrandom, hashbrown via tempfile)
# carry their own duplicate-version baggage we do not control. Revisit once
# the ecosystem converges.
multiple_crate_versions = "allow"
# Panicking on a `None`/`Err` hides failure modes from callers. Production code
# must surface errors via `?`/typed errors; tests are exempt
# (`allow-unwrap-in-tests` in clippy.toml), where a failed unwrap *is* the
# assertion.
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
panic = "abort"
overflow-checks = true

# Profiling profile for `samply` (and other sampling profilers). Mirrors
# release codegen (inherits `codegen-units = 1` + `lto = "thin"`) so the
# numbers stay representative, but keeps full debug info and symbols so
# the profiler can attribute samples to inline frames and source lines —
# `release` strips symbols, which makes its profiles unreadable. Build
# with `cargo build --profile profiling` and record with
# `samply record ./target/profiling/mkit ...`. See docs/PROFILING.md.
[profile.profiling]
inherits = "release"
debug = true
strip = false
