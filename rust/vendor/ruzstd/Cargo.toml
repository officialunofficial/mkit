# Bounded decoder fork; upstream package metadata is in Cargo.upstream.toml.
# Source and MIT attribution remain from ruzstd 0.9.1; see VENDORED.md.

[package]
edition = "2018"
rust-version = "1.87"
name = "mkit-ruzstd"
version = "0.9.1"
authors = ["Moritz Borcherding <moritz.borcherding@web.de>"]
build = false
exclude = [
    "decodecorpus_files/*",
    "dict_tests/*",
    "fuzz_decodecorpus/*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Bounded pure-Rust Zstandard decoder for mkit"
homepage = "https://github.com/KillingSpark/zstd-rs"
readme = "Readme.md"
keywords = [
    "zstd",
    "zstandard",
    "decompression",
]
categories = ["compression"]
license = "MIT"
repository = "https://github.com/officialunofficial/mkit"
resolver = "3"

[features]
default = [
    "hash",
    "std",
]
dict_builder = [
    "std",
    "dep:fastrand",
]
fuzz_exports = []
hash = ["dep:twox-hash"]
rustc-dep-of-std = [
    "dep:core",
    "dep:alloc",
]
std = []

[lib]
name = "ruzstd"
path = "src/lib.rs"

[[example]]
name = "compression_ratio"
path = "examples/compression_ratio.rs"

[[bench]]
name = "decode_all"
path = "benches/decode_all.rs"
harness = false

[dependencies.alloc]
version = "1.0.0"
optional = true
package = "rustc-std-workspace-alloc"

[dependencies.core]
version = "1.0.0"
optional = true
package = "rustc-std-workspace-core"

[dependencies.fastrand]
version = "2.3.0"
optional = true

[dependencies.twox-hash]
version = "2.0"
features = ["xxhash64"]
optional = true
default-features = false

[dev-dependencies.criterion]
version = "0.5"

[dev-dependencies.rand]
version = "0.8.5"
features = ["small_rng"]

[dev-dependencies.zstd]
version = "0.13.2"
