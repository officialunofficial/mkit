# nextest configuration — `cargo nextest run` reads this file.
# See https://nexte.st/docs/configuration/

[profile.default]
# Most mkit tests are sub-second; anything above 60 s is almost
# certainly a hang. Slow-test warnings fire at 10 s.
slow-timeout = { period = "10s", terminate-after = 6 }
# Don't retry on local runs — bugs should be reproducible, not papered
# over. CI overrides this in the `ci` profile below.
retries = 0
# Stop at the first failure when developing locally; CI overrides to
# surface the full failure surface.
fail-fast = true

[profile.ci]
# Surface every failure in one run on CI so we don't iterate through
# them one push at a time.
fail-fast = false
# Transient flakes in CI (network, fs latency) get one retry. A real
# bug fails twice; flakes succeed on the retry and are reported.
retries = 2
# Same slow-test envelope as default; CI machines vary so cap higher.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
# Emit JUnit XML alongside the human-readable output so GitHub Actions
# can render failure annotations inline on PR diffs.
path = "junit.xml"

# The bounded PR run of the stateful suite (tests/state_machine.rs, 32 cases)
# is ~12s locally, but it spawns the `mkit` binary per op, so a slow/loaded
# (especially macOS) runner could drift toward the default 60s / ci 120s kill
# envelope and spuriously fail. It is NOT a hang — give just this test a
# generous per-test ceiling in the PR profiles. The nightly deep run uses the
# `state-machine` profile instead.
[[profile.default.overrides]]
filter = 'test(=stateful_invariants)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(=stateful_invariants)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The fault-injection suites reconstruct many on-disk crash images and
# spawn N concurrent mutators, so each spawns the binary a lot. Deterministic,
# not hangs — give the crash-recovery and lock-contention binaries the same
# generous per-test ceiling so a slow/loaded (especially macOS) runner can't
# kill them under the default 60s / ci 120s envelope.
[[profile.default.overrides]]
filter = 'binary(crash_recovery) or binary(lock_contention)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(crash_recovery) or binary(lock_contention)'
slow-timeout = { period = "300s", terminate-after = 1 }

# branch_rename_commit_race races a real rename against a real concurrent
# commit and asserts the outcome, so it legitimately takes ~40s even
# running alone (confirmed by an isolated rerun) — comfortably past the
# 10s slow-test warning and uncomfortably close to the default 60s / ci
# 120s kill envelope under the contention of a full parallel run. Not a
# hang; give it the same generous per-test ceiling as the other
# real-timing-dependent suites above.
#
# WP-M0-20 (the MKIT-29 M0 exit run, 2026-09-26, a quiet 10-core M1 Pro
# with nothing else building): alone it takes 33s, but inside the full
# workspace run it was killed at 150s, then at 300s, and took 526s under a
# 600s ceiling. It calibrates its race delays from one `commit` it times at
# the start, so a loaded start inflates all 36 rounds. It now runs with no
# other test beside it (`threads-required`); serialized it took 40s, so the
# 150s ceiling stays.
[[profile.default.overrides]]
filter = 'binary(branch_rename_commit_race)'
threads-required = "num-test-threads"
slow-timeout = { period = "150s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(branch_rename_commit_race)'
threads-required = "num-test-threads"
slow-timeout = { period = "150s", terminate-after = 1 }

# CPU-bound debug-build tests that the suite's own parallelism pushes past
# the default 60s. Named one by one: each took 40s or more in a full
# `cargo nextest run --workspace --all-features` in WP-M0-20's quiet-machine
# runs (10-core M1 Pro, nothing else building), measured under a 600s
# ceiling on this branch and on `main`; every other test in these modules
# keeps the 60s (ci: 120s) hang detection.
#   history::ancestry, the 4 scrub/full-walk tests      20-23s alone; 117-123s
#                                                       in the suite (TIMEOUT)
#   history::ancestry, the other 3 scrub tests          40-64s in the suite
#   refs::tests::cas_{match,delete_vs_match}_* races    44-73s in the suite
#   batch_write_hash_equals_store_write_hash            8s alone; 88-90s (TIMEOUT)
#   write_parts_equals_concatenated_write               38-48s in the suite
#   mkit-cli verify_new_object_signatures_mixed_*       11.5s alone; 56-60s (TIMEOUT)
# None hangs: each walks, hashes or verifies a large fixture in an
# unoptimized build and is starved of CPU by the other test threads. They
# get 300s, about 2.4x the worst measured. That margin was calibrated on an
# M1 Pro, not on the CI machines.
[[profile.default.overrides]]
filter = '''
package(mkit-core) and (
    test(=history::ancestry::tests::corruption_outside_the_current_window_is_caught_within_a_bounded_number_of_publishes)
    or test(=history::ancestry::tests::fast_forward_scrubs_a_bounded_window_not_the_whole_prefix)
    or test(=history::ancestry::tests::full_walk_fallback_still_verifies_the_spliced_prefix)
    or test(=history::ancestry::tests::missing_scrub_state_forces_a_full_walk_instead_of_trusting_nothing)
    or test(=history::ancestry::tests::scrub_lap_completion_forces_a_full_walk_but_keeps_the_generation)
    or test(=history::ancestry::tests::scrub_state_from_a_superseded_generation_is_discarded_not_misapplied)
    or test(=history::ancestry::tests::stale_scrub_state_forces_a_full_walk_regardless_of_cursor_position)
    or test(=refs::tests::cas_delete_vs_match_advance_race_never_lets_both_win_or_loses_the_advance)
    or test(=refs::tests::cas_match_race_never_loses_an_update_across_uncoordinated_callers)
    or test(=batch::tests::batch_write_hash_equals_store_write_hash)
    or test(=batch::tests::write_parts_equals_concatenated_write)
)
or (package(mkit-cli) and test(=remote_dispatch::packmap::tests::verify_new_object_signatures_mixed_with_unsigned_object_kinds))
'''
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = '''
package(mkit-core) and (
    test(=history::ancestry::tests::corruption_outside_the_current_window_is_caught_within_a_bounded_number_of_publishes)
    or test(=history::ancestry::tests::fast_forward_scrubs_a_bounded_window_not_the_whole_prefix)
    or test(=history::ancestry::tests::full_walk_fallback_still_verifies_the_spliced_prefix)
    or test(=history::ancestry::tests::missing_scrub_state_forces_a_full_walk_instead_of_trusting_nothing)
    or test(=history::ancestry::tests::scrub_lap_completion_forces_a_full_walk_but_keeps_the_generation)
    or test(=history::ancestry::tests::scrub_state_from_a_superseded_generation_is_discarded_not_misapplied)
    or test(=history::ancestry::tests::stale_scrub_state_forces_a_full_walk_regardless_of_cursor_position)
    or test(=refs::tests::cas_delete_vs_match_advance_race_never_lets_both_win_or_loses_the_advance)
    or test(=refs::tests::cas_match_race_never_loses_an_update_across_uncoordinated_callers)
    or test(=batch::tests::batch_write_hash_equals_store_write_hash)
    or test(=batch::tests::write_parts_equals_concatenated_write)
)
or (package(mkit-cli) and test(=remote_dispatch::packmap::tests::verify_new_object_signatures_mixed_with_unsigned_object_kinds))
'''
slow-timeout = { period = "60s", terminate-after = 5 }

# The storage suite over the `.mkit`-layout stores makes every write durable
# (fsync the file, rename, fsync the directory): a few cases apply 1,000-2,000
# single-key batches, ~40s each on a loaded macOS runner (F_FULLFSYNC). Not
# hangs; the same generous ceiling as the other real-I/O suites.
[[profile.default.overrides]]
filter = 'binary(fs_backends)'
slow-timeout = { period = "150s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(fs_backends)'
slow-timeout = { period = "150s", terminate-after = 1 }

# The wire suite's growth case waits out replay expiry plus the server's
# prune grace on the real clock (~80s; so do its store mutants):
# pruning never follows the test-faults clock skew. Not a hang.
[[profile.default.overrides]]
filter = 'binary(baseline_pipeline_memory) and (test(=pipeline_auth_v2_test_faults) or test(/_fails_growth$/))'
slow-timeout = { period = "180s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(baseline_pipeline_memory) and (test(=pipeline_auth_v2_test_faults) or test(/_fails_growth$/))'
slow-timeout = { period = "180s", terminate-after = 1 }

[profile.ignored-lane]
# #505 PR 5/5: a handful of irreducibly-real tests (subprocess sleeps,
# real localhost TCP, the ~5s worktree-lock wait, a real `ssh` connect
# attempt to 127.0.0.1:22) were quarantined behind `#[ignore]` instead
# of determinized. This profile is the single source of truth for
# which quarantined tests the serial ignored-only CI lane runs — both
# rust.yml and cloudbuild/ci.yaml invoke
# `cargo nextest run --profile ignored-lane --run-ignored ignored-only`
# instead of duplicating this test-name filter inline in two YAML files.
#
# Scoped by an explicit test-name filter rather than a blanket
# `--run-ignored ignored-only`: this workspace also has PRE-EXISTING
# `#[ignore]`d tests (native-keystore backends gated on
# MKIT_RUN_NATIVE_KEYSTORE_TESTS, the real-ssh e2e suite gated on
# MKIT_SSH_E2E_REAL) that are NOT provisioned on CI runners. The
# keystore tests in particular panic outright when their gate is unset
# (`assert!(!require_backend, ...)` in mkit-keystore's native_list.rs)
# rather than skipping quietly, so a blanket ignored-only run would
# fail regardless of MKIT_TEST_STRICT. Naming exactly the tests this
# PR quarantined keeps the lane green regardless of what other
# `#[ignore]`d tests exist.
#
# The four `listen_enc_*` real-TCP tests live in mkit-server-native's
# `enc_listener` (`mkit-server serve --listen-enc`); WP-M0-15 deleted their
# mkit-cli copies with `mkit serve --listen-enc`.
default-filter = 'test(/hang_before_stdout_times_out_and_reaps_child|fills_stderr_before_stdout_does_not_deadlock|valid_response_then_never_exits_is_bounded|listen_enc_rejected_upload_does_not_overwrite_existing_pack|listen_enc_rejects_non_hello_first_frame|listen_enc_cas_conflict_classifies_as_ref_conflict|listen_enc_terminates_connection_past_frame_budget|open_accepts_syntactically_valid_mkit_ssh_url|second_mutating_command_blocks_on_worktree_lock|list_refs_round_trip_over_real_tcp|post_handshake_idle_timeout_drops_silent_peer|wait_child_timeout_kills_stalled_child|list_refs_retries_past_dropped_connection_via_reconnect|ssh_clone_retries_past_a_dropped_first_connection/)'
# Run serially so the quarantined tests' real timers/sockets don't
# contend with each other; only localhost networking is needed, which
# every CI runner (Linux + macOS) provides.
test-threads = 1

[profile.state-machine]
# Nightly deep run of the stateful invariant suite
# (tests/state_machine.rs). It drives the real `mkit` binary through
# hundreds of randomly-generated op sequences (PROPTEST_CASES=512), so a
# single test legitimately runs for many minutes — far past the default
# 60s / ci 120s slow-test kill envelope. Give it a generous ceiling
# rather than treating the long runtime as a hang. (The bounded PR run on
# the default/ci profiles gets its own, smaller, per-test override above.)
slow-timeout = { period = "1200s", terminate-after = 1 }
retries = 0
fail-fast = false
