# nextest configuration — `cargo nextest run` reads this file.
# See https://nexte.st/docs/configuration/

[profile.default]
# Most mkit tests are sub-second; anything above 60 s is almost
# certainly a hang. Slow-test warnings fire at 10 s.
slow-timeout = { period = "10s", terminate-after = 6 }
# Don't retry on local runs — bugs should be reproducible, not papered
# over. CI overrides this in the `ci` profile below.
retries = 0
# Stop at the first failure when developing locally; CI overrides to
# surface the full failure surface.
fail-fast = true

[profile.ci]
# Surface every failure in one run on CI so we don't iterate through
# them one push at a time.
fail-fast = false
# Transient flakes in CI (network, fs latency) get one retry. A real
# bug fails twice; flakes succeed on the retry and are reported.
retries = 2
# Same slow-test envelope as default; CI machines vary so cap higher.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
# Emit JUnit XML alongside the human-readable output so GitHub Actions
# can render failure annotations inline on PR diffs.
path = "junit.xml"

# The bounded PR run of the stateful suite (tests/state_machine.rs, 32 cases)
# is ~12s locally, but it spawns the `mkit` binary per op, so a slow/loaded
# (especially macOS) runner could drift toward the default 60s / ci 120s kill
# envelope and spuriously fail. It is NOT a hang — give just this test a
# generous per-test ceiling in the PR profiles. The nightly deep run uses the
# `state-machine` profile instead.
[[profile.default.overrides]]
filter = 'test(=stateful_invariants)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(=stateful_invariants)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The Phase-2 fault-injection suites reconstruct many on-disk crash images and
# spawn N concurrent mutators, so each spawns the binary a lot. Deterministic,
# not hangs — give the crash-recovery and lock-contention binaries the same
# generous per-test ceiling so a slow/loaded (especially macOS) runner can't
# kill them under the default 60s / ci 120s envelope.
[[profile.default.overrides]]
filter = 'binary(crash_recovery) or binary(lock_contention)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(crash_recovery) or binary(lock_contention)'
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.state-machine]
# Nightly deep run of the stateful invariant suite
# (tests/state_machine.rs). It drives the real `mkit` binary through
# hundreds of randomly-generated op sequences (PROPTEST_CASES=512), so a
# single test legitimately runs for many minutes — far past the default
# 60s / ci 120s slow-test kill envelope. Give it a generous ceiling
# rather than treating the long runtime as a hang. (The bounded PR run on
# the default/ci profiles gets its own, smaller, per-test override above.)
slow-timeout = { period = "1200s", terminate-after = 1 }
retries = 0
fail-fast = false
