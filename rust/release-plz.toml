# Release automation for the mkit workspace (issue #225).
#
# This workspace owns versioning by hand: the lockstep version bump and the
# root CHANGELOG land in the feature/release-prep PR, and the signed
# `v{version}` tag is cut manually. release-plz does NOT own the version.
#
# release-plz is RETIRED for publishing (`release_always = false`, below — the
# release job is inert). crates.io publishing moved to the tag-driven
# `.github/workflows/crates-publish.yml` (`cargo publish --workspace`), because
# release-plz's model fought this hand-versioned flow two ways: it publishes
# only from a release-plz-authored Release PR (never merged here), and once the
# signed tag exists it treats the version as already released (the tag is its
# "published" marker) and skips it. `cargo publish` ignores tags, so the
# tag-driven workflow has no such conflict and the signed tag stays the single,
# deliberate release trigger.
#
# Division of labour — all keyed off the one signed `v{version}` tag:
#   crates-publish.yml → crates.io (`cargo publish --workspace`)
#   release.yml        → binaries, cosign, SBOM, GitHub Release, npm wasm
#   mcp-release.yml    → docs MCP corpus
# This config is kept only so the `release-plz-pr` job (workflow_dispatch)
# remains available IF the workspace ever hands versioning back to release-plz;
# nothing here runs automatically.
#
# Publishability is controlled per-crate via `publish = false` in each
# Cargo.toml (mkit-wasm, the contrib signers, fuzz, benches). release-plz skips
# those automatically; the remaining library and CLI crates (including mkit-cli
# and mkit-transport-enc) publish. We deliberately do NOT set a workspace-wide
# `publish = false` (unlike
# the polychrome repo, which never goes to crates.io).

[workspace]
# Tagging/release/changelog happen on ONE anchor package — mkit-core, below — so
# a release yields a single `v{version}` tag (matching release.yml's pattern)
# and one root CHANGELOG.md. Left on per-package, release-plz would emit a
# `<crate>-v…` tag for every crate, none matching release.yml. Disable here;
# enable on the anchor.
git_tag_enable = false
git_release_enable = false
changelog_update = false

# Gate the public API: cargo-semver-checks flags a breaking change against the
# previous tag so the Release PR proposes the right bump. (The standalone
# semver-checks.yml still runs per-PR against the base branch; this is the
# release-time gate.) No prior crates.io version exists on the first release, so
# it is a no-op then and meaningful from the first publish onward.
semver_check = true

# Release PRs carry version + changelog only. Dependency bumps come from
# Dependabot, not the Release PR.
dependencies_update = false

# Keep the release job INERT. crates.io publishing is tag-driven via
# crates-publish.yml (see header). `release_always = true` would be wrong here
# for two reasons: (1) this workspace bumps the version EARLY in the cycle (in a
# feature/perf PR), so publishing on any push to main would ship a version
# before it is ready; (2) once the signed tag exists, release-plz skips the
# version anyway (tag = its "published" marker), then dependent crates fail to
# resolve. With `false`, the release job skips ("commit is not from a release
# PR") and never races the tag-driven publish.
release_always = false

# ---------------------------------------------------------------------------
# Lockstep: every workspace crate inherits `version.workspace = true`, so they
# all move to the SAME next version. `version_group = "mkit"` makes release-plz
# compute ONE next version for the whole set (verify with
# `release-plz update --dry-run` that exactly one version number moves).
# ---------------------------------------------------------------------------

# The anchor: writes the one root CHANGELOG.md for the whole train. It does NOT
# create a git tag or GitHub Release — release.yml's binary release requires an
# annotated, GPG-signed tag from an allowlisted fingerprint (it runs
# `git verify-tag`), which release-plz's token-created tag would NOT satisfy.
# So release-plz publishes ONLY to crates.io + writes the changelog; the signed
# `v{version}` tag (and the binaries/SBOM/GitHub-Release/npm it drives) stays the
# existing human release ceremony. This also avoids a tag firing those artifacts
# mid-publish if a later crate in the train fails.
[[package]]
name = "mkit-core"
version_group = "mkit"
git_tag_enable = false
# release-plz creates no tag, but it still uses this template to build the
# changelog's compare links. Point them at the human-created `v{version}` tags
# instead of release-plz's multi-crate-workspace default `mkit-core-v{version}`,
# which wouldn't exist.
git_tag_name = "v{{ version }}"
git_release_enable = false
changelog_update = true
changelog_path = "../CHANGELOG.md"  # repo-root CHANGELOG.md (workspace is rust/).
# A package's changelog defaults to commits under its OWN directory only. Pull
# in the rest of the lockstep train so the single root CHANGELOG.md captures
# every crate's changes, not just mkit-core's.
changelog_include = [
  "mkit-rpc",
  "mkit-attest",
  "mkit-keystore",
  "mkit-transport-memory",
  "mkit-transport-file",
  "mkit-transport-http",
  "mkit-transport-s3",
  "mkit-transport-ssh",
  "mkit-cli",
  "mkit-wasm",
  "mkit-transport-enc",
  "mkit-git-bridge",
]

# Every other crate: shares the lockstep version_group, never tags/releases.
[[package]]
name = "mkit-attest"
version_group = "mkit"
[[package]]
name = "mkit-git-bridge"
version_group = "mkit"
[[package]]
name = "mkit-keystore"
version_group = "mkit"
[[package]]
name = "mkit-rpc"
version_group = "mkit"
[[package]]
name = "mkit-transport-file"
version_group = "mkit"
[[package]]
name = "mkit-transport-http"
version_group = "mkit"
[[package]]
name = "mkit-transport-memory"
version_group = "mkit"
[[package]]
name = "mkit-transport-s3"
version_group = "mkit"
[[package]]
name = "mkit-transport-ssh"
version_group = "mkit"
# mkit-cli (the `mkit` binary) and mkit-transport-enc are now published too,
# in the lockstep version_group. mkit-wasm stays publish = false (npm-only) —
# and `publish = false` MUST be restated here to match its Cargo.toml, since
# release-plz (>=0.3.159) validates the config against the manifest and a bare
# `[[package]]` entry otherwise defaults to `publish = true`.
[[package]]
name = "mkit-cli"
version_group = "mkit"
[[package]]
name = "mkit-wasm"
version_group = "mkit"
publish = false
[[package]]
name = "mkit-transport-enc"
version_group = "mkit"

# Changelog grouping, aligned to the Conventional Commit types the
# commit-lint / PR-title gate already enforces. Noise types are dropped from
# the changelog body; breaking changes are always surfaced.
[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs?", group = "Documentation" },
  { message = "^revert", group = "Reverts" },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
]
