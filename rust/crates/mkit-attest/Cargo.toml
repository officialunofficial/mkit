[package]
name = "mkit-attest"
description = "mkit attestations: JCS + in-toto v1 Statement + DSSE envelope + signers"
keywords = ["mkit", "attestation", "in-toto", "dsse", "jcs"]
categories = ["cryptography", "encoding"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Internal monorepo crate; not published to crates.io during the Rust
# port. Flip to `true` once the 1.0 cutover freezes the public API.
publish = false

[lints]
workspace = true

[dependencies]
mkit-core = { path = "../mkit-core" }
blake3 = "1"
base64 = "0.22"
thiserror = "2"
# `serde` + `serde_json` are used ONLY on the parsing side (envelope decode +
# external-signer response). The canonical JCS encoder is hand-rolled per
# RFC 8785 — `serde_json::to_string` does NOT satisfy JCS sort/escape rules.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Atomic-rename writes for `store::save`; mirrors mkit-core::store.
tempfile = "3"
# Re-used directly so signer_repo_key + verify can talk to the SAME dalek
# version mkit-core::sign already pulls in. We inherit the same default-
# features = false + std posture so the dep graph does not widen.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
hex = "0.4"
