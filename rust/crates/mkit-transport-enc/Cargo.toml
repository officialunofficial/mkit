[package]
name = "mkit-transport-enc"
description = "Encrypted-stream transport for mkit, layering mkit-rpc SshFrame on top of commonware-stream::encrypted (ChaCha20-Poly1305, X25519+ed25519 handshake)"
keywords = ["mkit", "vcs", "transport", "encryption", "commonware"]
categories = ["network-programming", "cryptography"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Phase 1: not yet ready for crates.io. URL parsing / CLI plumbing
# (Phase 2) lands before we publish. Workspace member so workspace
# `cargo test` / `cargo clippy` cover it.
publish = false

[lints]
workspace = true

[dependencies]
# Inter-workspace deps need explicit version + path so `cargo publish`
# accepts them once `publish = true` is flipped on in Phase 2.
mkit-core = { version = "0.1", path = "../mkit-core" }
mkit-rpc = { version = "0.1", path = "../mkit-rpc" }
buffa = "0.6"
thiserror = "2"

# commonware: pinned to 2026.4.0 — the current stable release on
# crates.io as of 2026-05-21. All four crates share the same
# release cadence so they're version-locked here.
commonware-stream = "=2026.4.0"
commonware-runtime = "=2026.4.0"
commonware-cryptography = { version = "=2026.4.0", features = ["std"] }
commonware-codec = "=2026.4.0"

[dev-dependencies]
# Deterministic runner for the in-process round-trip test. The test
# uses `commonware_runtime::deterministic::Runner` so we don't depend
# on real wall-clock time or a multi-threaded executor.
commonware-utils = "=2026.4.0"
hex = "0.4"
