[package]
name = "mkit-primitives-fuzz"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bounded replay harnesses for mkit-primitives"
keywords = ["mkit", "fuzz"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[dependencies]
mkit-primitives = { path = "..", default-features = false }
libfuzzer-sys = { version = "0.4", optional = true }

[package.metadata]
cargo-fuzz = true

[features]
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
name = "fork_acceptance"
path = "fuzz_targets/fork_acceptance.rs"
required-features = ["libfuzzer"]
test = false
doc = false
bench = false
