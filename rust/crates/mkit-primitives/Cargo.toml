[package]
name = "mkit-primitives"
version = "0.1.0"
description = "Sans-IO verification and guarded protocol decisions for mkit"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mkit", "protocol", "verification", "sans-io"]
categories = ["data-structures", "encoding", "cryptography"]

[lints]
workspace = true

[features]
default = ["pack-ruzstd"]
pack-ruzstd = ["mkit-core/pack-ruzstd"]
pack-zstd = ["mkit-core/pack-zstd"]

[dependencies]
mkit-core = { path = "../mkit-core", version = "0.5", default-features = false }
commonware-macros.workspace = true
thiserror = "2"

[lib]
bench = false

[package.metadata.docs.rs]
no-default-features = true
features = ["pack-ruzstd"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[dev-dependencies]
serde_json = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }

[[bench]]
name = "compute"
harness = false
