schema_version = 1
# Encoded formats and semantic contracts register inside their owning module section.

# evidence
[[formats]]
type = "AcceptanceEvidence"
format_version = 1
decoder = "evidence::acceptance::AcceptanceEvidence::decode"
fuzz_target = "acceptance_decode"
spec = "SPEC-ACCEPTANCE-EVIDENCE#2-canonical-binary-encoding"

[[formats]]
type = "evidence-page"
format_version = 1
decoder = "evidence::pages::PageView::from_bytes"
fuzz_target = "page"
spec = "SPEC-PRIMITIVE-EVIDENCE"

[[formats]]
type = "evidence-proof"
format_version = 1
decoder = "evidence::proof::verify_path"
fuzz_target = "proof"
spec = "SPEC-PRIMITIVE-EVIDENCE"

[[formats]]
type = "framing-checkpoint"
format_version = 1
decoder = "evidence::checkpoint::Checkpoint::from_bytes"
fuzz_target = "checkpoint"
spec = "SPEC-PRIMITIVE-EVIDENCE"

[[formats]]
type = "verify-checkpoint"
format_version = 4
decoder = "evidence::checkpoint::Checkpoint::from_bytes"
fuzz_target = "checkpoint"
spec = "SPEC-PRIMITIVE-EVIDENCE"

