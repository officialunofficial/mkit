[package]
name = "mkit-transport-s3"
description = "mkit S3 / Cloudflare R2 transport — SigV4-signed HTTPS backend"
keywords = ["mkit", "vcs", "transport", "s3", "r2"]
categories = ["network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mkit-core = { path = "../mkit-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
thiserror = "2"

[dev-dependencies]
mockito = "1"
serde_json = "1"
