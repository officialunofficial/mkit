# Local-only workerd probe, isolated from the workspace and production Workers.
[package]
name = "mkit-server-worker-http-mount-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
worker = { version = "0.8", features = ["http"] }
mkit-server-worker = { path = "../..", features = ["http-objects"] }
mkit-server = { path = "../../../mkit-server", features = ["http-objects"] }
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

mkit-core = { path = "../../../mkit-core", default-features = false }
