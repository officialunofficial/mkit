# mkit-server-worker — the Cloudflare Workers adapter of the mkit server
# (production server work §5.1), storage half: a streaming R2 `BlobStore`, a Durable
# Object `SqlConn` under `mkit-server`'s shared `SqlKvStore`, the Durable
# Object request handler, the Worker-side `NamespaceStore` client that
# routes each partition to its own Durable Object, and the fetch adapter
# that serves the pipeline's Connect binding over them (`adapter`, which
# apps/vcs-worker mounts).
#
# Everything that touches `worker` handles is `#[cfg(target_arch =
# "wasm32")]`; the logic around it (the verifying sink, the wire codec, the
# routing, the error classifiers) is host-compiled and host-tested against
# simulated R2 and Durable Object backends. The `worker` dependencies are
# therefore wasm32-only.
#
# `publish = false` for good (planner default Q6): a deployment crate.
# It depends on `apps/mkit-worker-common` (a standalone package with its own
# `[workspace]` table, which Cargo ignores for a path dependency: it is not a
# member of this workspace).
[package]
name = "mkit-server-worker"
description = "Cloudflare Workers adapter of the mkit server: R2 blobs and Durable Object metadata"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Store-level fault injection (a failed final R2 chunk, a Durable Object
# batch that fails once after its writes), plus the pipeline seam of
# `mkit-server/test-faults`. Never enabled by a release build.
test-faults = ["mkit-server/test-faults"]
signed-http-hooks = []
published-view = ["mkit-server/published-view"]
http-objects = ["mkit-server/http-objects"]
# The launch profile opts into R-203's bounded pure-Rust decoder.
pack-ruzstd = ["mkit-server/pack-ruzstd"]

[dependencies]
# `connect` (on by default) for M0-17's fetch adapter; `sql` for the shared
# `SqlKvStore`; `remote-hooks` for the service-binding hook channel
# (WP-3.9). No `fs` (native only) and no `memory`.
mkit-server = { version = "0.4", path = "../mkit-server", features = ["connect", "sql", "remote-hooks"] }
# default-features = false keeps `pack-zstd` (zstd-sys, C) out of wasm32.
mkit-core = { version = "0.4", path = "../mkit-core", default-features = false }
url = "2"
zeroize = "1"
bytes = "1"
# mpsc/oneshot channels between a sink and its spawned R2 put.
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keys and values cross the Worker <-> Durable Object JSON wire as base64.
base64 = "0.22"
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Registry owns span IDs; event formatting uses a small console layer.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry"] }
# The fetch adapter: a streaming `http::Request` for connectrpc and the
# body limiter around the Worker's request stream.
http = "1"
http-body = "1"
# `ServiceExt::oneshot` over the Connect service (already in the graph
# through connectrpc).
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same pin and features as apps/vcs-worker and apps/mkit-worker-common.
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal"] }
worker = { version = "0.8", features = ["http"] }
mkit-worker-common = { path = "../../../apps/mkit-worker-common" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mkit-attest = { path = "../mkit-attest" }
mkit-server = { version = "0.4", path = "../mkit-server", features = ["memory"] }
mkit-server-conformance = { path = "../mkit-server-conformance" }
# `RusqliteConn` under the simulated Durable Object connection.
mkit-server-native = { path = "../mkit-server-native" }
futures = { version = "0.3", features = ["executor"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
# The adapter tests build and collect bodies, and name the Connect service
# type (connectrpc is already in the graph through mkit-server).
http-body-util = "0.1"
connectrpc = { version = "0.9.1", default-features = false, features = ["gzip", "json"] }
tempfile = "3"
