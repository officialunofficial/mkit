[package]
name = "mkit-transport-http"
description = "mkit HTTP/HTTPS transport — REST dialect over reqwest + rustls"
keywords = ["mkit", "transport", "http", "https", "reqwest"]
categories = ["network-programming"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Internal monorepo crate; not published to crates.io during the Rust
# port. Flip to `true` once the 1.0 cutover freezes the public API.
publish = false

[lints]
workspace = true

[dependencies]
mkit-core = { path = "../mkit-core" }
# rustls-only — the whole point of this crate is no system TLS baggage.
# default-features = false drops default-tls (native-tls on desktop).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
mockito = "1"
