[package]
name = "mkit-transport-http"
description = "HTTP/HTTPS transport for mkit, with rustls TLS, JSON REST dialect, and bounded body sizes"
keywords = ["mkit", "transport", "http", "https", "reqwest"]
categories = ["network-programming"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishable to crates.io. `publish` left unset (cargo default = true).

[lints]
workspace = true

[dependencies]
# Inter-workspace dep needs an explicit `version = ...` alongside the
# path so `cargo publish` accepts it.
mkit-core = { version = "0.4", path = "../mkit-core" }
# `Bytes` backs `upload_pack`'s request body: reqwest already depends on
# `bytes` transitively (`reqwest::blocking::Body: From<Bytes>`), so this
# names it explicitly rather than relying on an unstated transitive
# version. `Bytes::clone()` is a refcount bump (not a copy), which is
# the fix for the per-retry full-body clone this crate used to do
# (mkit#702).
bytes = "1"
# rustls-only — the whole point of this crate is no system TLS baggage.
# default-features = false drops default-tls (native-tls on desktop).
# reqwest 0.13 verifies certs via rustls-platform-verifier (OS trust
# store) by default; this crate accepts that as the intended trust
# model rather than pinning back to a bundled webpki-roots list.
# Not the same trust model as mkit-transport-connect's hyper-rustls
# client (explicit webpki-roots, SPEC-TRANSPORT-CONNECT.md §7.3) — the
# two transports are independent and don't need to agree.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "blocking",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
default = []
# Wire-level sparse-checkout fetch (issue #158). Mirrors the
# mkit-core feature; both must be enabled together. Off by default —
# the bulk of HTTP consumers never need the sparse path.
sparse-checkout = ["mkit-core/sparse-checkout"]
# Issue #159 — Pack-Shards request/response header,
# parallel-fetch client. Pulls the pack-shards feature in mkit-core
# (which in turn pulls the commonware dep stack).
pack-shards = ["mkit-core/pack-shards"]

[dev-dependencies]
mockito = "1"

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
