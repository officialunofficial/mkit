# mkit-transport-connect — both halves of `mkit.transport.v1.TransportService`
# (SPEC-TRANSPORT-CONNECT), the implementation behind the `mkit+https://`
# remote scheme:
#   - a native (non-wasm) ConnectRPC CLIENT implementing `Transport` itself,
#     used by `mkit-cli`'s `remote_dispatch` for `mkit+https://` / loopback
#     `mkit+http://` — mandatory, always compiled.
#   - an axum-hosted ConnectRPC SERVER generic over any
#     `mkit_core::protocol::Transport` backend (`mkit serve --http`) — behind
#     this crate's own `server` cargo feature, mirroring `mkit-cli`'s
#     `http-transport` feature (which enables it) so a client-only consumer
#     (the common case) doesn't pay axum/hyper-server's compile cost.
#
# Mirrors `mkit-repo-client`'s "zero-duplication" codegen approach (compiled
# directly from the canonical `proto/mkit/transport/v1/transport.proto` via a
# workspace-relative `build.rs` path — never a hand-copied proto), but on the
# client side targets native (Tokio, `connectrpc`'s hyper-rustls client
# transport) instead of wasm (Fetch API). Drops the wasm-only deps
# (`wasm-bindgen`, `web-sys`, `send_wrapper`) `mkit-repo-client` needs and
# enables `connectrpc`'s native/TLS client features instead.
[package]
name = "mkit-transport-connect"
description = "mkit.transport.v1 Connect service: native ConnectRPC client for mkit+https://, plus an optional axum-hosted TransportService server (SPEC-TRANSPORT-CONNECT)"
keywords = ["mkit", "vcs", "transport", "connectrpc", "axum"]
categories = ["network-programming", "web-programming::http-server"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.clippy]
# Same rationale as mkit-rpc: the buffa/connectrpc-generated code (staged
# into $OUT_DIR from generated/) inherits docstrings from transport.proto
# and trips pedantic/nursery lints hundreds of times. Keep `clippy::all`
# (correctness + style baseline); our own hand-written src/ code stays
# under it.
all = { level = "warn", priority = -1 }

[dependencies]
# Inter-workspace deps need explicit version + path so `cargo publish`
# accepts them.
mkit-core = { version = "0.3", path = "../mkit-core" }

# ConnectRPC native client: hyper/hyper-util transport + rustls TLS. This is
# the crate's mandatory baseline; `server`/`axum` are added by the `server`
# feature below (see `[features]`).
# `streaming` is tokio-based async-compression for `UploadPack`/
# `DownloadPack`'s client-streaming/server-streaming RPCs (fine natively,
# unlike on wasm — re-enabled explicitly since `default-features = false`
# drops it). `json` keeps the buffa-generated message types' serde derives
# (matches every other connectrpc consumer in this workspace).
connectrpc = { version = "0.8", default-features = false, features = [
    "client",
    "client-tls",
    "streaming",
    "gzip",
    "zstd",
    "json",
] }
buffa = "0.8.1"
buffa-types = "0.8"

# Only pulled in by the `server` feature — see `[features]`.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio"], optional = true }

# Async runtime driving the ConnectRPC client (and, under `server`, the axum
# server too). The `Transport` trait (mkit_core::protocol::Transport) is
# synchronous; `mkit_core::protocol::async_shim::Executor` bridges the
# client side, mirroring mkit-transport-enc's `tcp::TokioExecutor`.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "macros",
    "time",
] }

http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1.6"
futures = "0.3"
url = "2"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pure-Rust TLS root store for `HttpClient::with_tls` (Mozilla root program
# via the `webpki-roots` crate) — no OS trust-store dependency.
webpki-roots = "1"

# Explicit dependency (beyond connectrpc's own re-export of `rustls`) so
# this crate can deterministically install a `ring`-backed default
# `CryptoProvider` regardless of what crypto backend(s) a consuming
# workspace's OTHER dependencies pull in for the same `rustls` version
# (`aws-lc-rs`, `ring`, or both) — see `client::ensure_crypto_provider`.
# `ring` needs no `cmake` (unlike `aws-lc-rs`), matching this crate's
# minimal-system-dependency posture.
rustls = { version = "0.23", features = ["ring"] }

[build-dependencies]
connectrpc-build = "0.8"

[dev-dependencies]
tempfile = "3"
mkit-transport-file = { path = "../mkit-transport-file" }
mkit-transport-memory = { version = "0.3", path = "../mkit-transport-memory" }
# `tests/roundtrip.rs` builds its own in-process `TransportService` server
# directly against `connectrpc::server`/`Router` (the client-side regression
# gate — SPEC-TRANSPORT-CONNECT's testing decision) independent of this
# crate's own `server` feature, so `server` is listed unconditionally here.
connectrpc = { version = "0.8", default-features = false, features = [
    "client",
    "client-tls",
    "server",
    "gzip",
    "zstd",
    "streaming",
    "json",
] }

[features]
default = []
# `mkit serve --http`'s axum-hosted `mkit.transport.v1.TransportService`
# server (issue #700, SPEC-TRANSPORT-CONNECT §7.2), generic over any
# `mkit_core::protocol::Transport` backend. Off by default so a consumer
# that only needs the `mkit+https://` client (the mandatory baseline,
# e.g. `mkit-cli`'s unconditional `remote_dispatch` dependency) doesn't pay
# axum/hyper-server's compile cost. Turn on directly, or transitively via
# `mkit-cli`'s `http-transport` feature.
server = ["dep:axum", "connectrpc/server", "connectrpc/axum"]

# `tests/e2e.rs` drives a real `mkit_transport_connect::serve` (this crate's
# OWN server API, not just connectrpc's), so it needs the `server` feature
# to compile at all — `cargo test -p mkit-transport-connect` without it
# still runs `tests/roundtrip.rs` (the client-side regression gate). With
# `--features server` (or `--all-features`) both run.
[[test]]
name = "e2e"
required-features = ["server"]

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
