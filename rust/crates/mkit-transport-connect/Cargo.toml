# Native Transport and host-policy adapter over mkit-client's canonical
# mkit.transport.v1 per-RPC implementation. The CLI lends ClientSource for
# repository operations; remaining Transport callers keep this facade.
# Generated bindings and pooled HTTP utilities remain public compatibility APIs.
[package]
name = "mkit-transport-connect"
description = "Native Transport and host-policy adapter over the mkit-client Connect protocol implementation"
keywords = ["mkit", "vcs", "transport", "connectrpc", "client"]
categories = ["network-programming", "web-programming::http-client"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.clippy]
# Shared generated types inherit transport.proto docstrings that trip
# pedantic/nursery lints. Keep `clippy::all` (correctness + style baseline)
# and this crate's existing lint policy for handwritten client modules.
all = { level = "warn", priority = -1 }

[dependencies]
mkit-sync = { version = "0.5", path = "../mkit-sync", default-features = false, features = ["connect-native"] }
mkit-client = { version = "0.5", path = "../mkit-client", default-features = false }
mkit-rpc = { version = "0.5", path = "../mkit-rpc", features = ["transport"] }
# Inter-workspace deps need explicit version + path so `cargo publish`
# accepts them.
mkit-core = { version = "0.5", path = "../mkit-core" }

# ConnectRPC native client: hyper/hyper-util transport + rustls TLS.
# `UploadPack`/`DownloadPack`'s client-streaming/server-streaming RPCs work
# natively without a separate opt-in — connectrpc 0.9 dropped the
# `streaming` cargo feature (and `StreamingCompressionProvider`) entirely;
# streaming RPCs themselves are unaffected. `json` keeps the
# buffa-generated message types' serde derives (matches every other
# connectrpc consumer in this workspace).
connectrpc = { version = "0.9.0", default-features = false, features = [
    "client",
    "client-tls",
    "gzip",
    "zstd",
    "json",
] }
buffa = "0.9.1"
base64 = "0.23"

# Async runtime driving the ConnectRPC client. The `Transport` trait (mkit_core::protocol::Transport) is
# synchronous; `mkit_core::protocol::async_shim::Executor` bridges the
# client side, mirroring mkit-transport-enc's `tcp::TokioExecutor`.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "macros",
    "time",
] }

hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "ring"] }
pin-project-lite = "0.2"
tower-service = "0.3"
http = "1"
http-body-util = "0.1"
bytes = "1.6"
futures = "0.3"
url = "2"

serde = { version = "1", features = ["derive"] }
log = "0.4"

# CSPRNG for the write-envelope idempotency key (`envelope::EnvelopeTransport`)
# — same crate/version mkit-core, mkit-cli, and mkit-keystore already pull in
# for their own random-value needs (key generation, ephemeral enc-transport
# keys).
getrandom = "0.4"

# Pure-Rust TLS root store for `HttpClient::with_tls` (Mozilla root program
# via the `webpki-roots` crate) — no OS trust-store dependency.
webpki-roots = "1"

# Explicit dependency (beyond connectrpc's own re-export of `rustls`) so
# this crate can deterministically install a `ring`-backed default
# `CryptoProvider` regardless of what crypto backend(s) a consuming
# workspace's OTHER dependencies pull in for the same `rustls` version
# (`aws-lc-rs`, `ring`, or both) — see `tls::client_config`.
# `ring` needs no `cmake` (unlike `aws-lc-rs`), matching this crate's
# minimal-system-dependency posture.
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
mkit-test-util = { path = "../mkit-test-util" }
serde_json = "1"
mkit-transport-memory = { version = "0.5", path = "../mkit-transport-memory" }
# Test-only: `envelope::tests::parity` independently re-verifies the write
# envelope headers `EnvelopeTransport` produces against a from-scratch
# implementation of the server-side envelope verification contract, so
# canonical-string or header regressions are caught without a live server.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "rand_core"] }
hex = "0.4"
# `tests/roundtrip.rs`, `retry.rs` and `rpc_timeout.rs` build their own
# in-process `TransportService` servers directly against
# `connectrpc::server`/`Router` (the client-side regression gate —
# SPEC-TRANSPORT-CONNECT's testing decision), so connectrpc's `server`
# feature is a dev-only feature here.
connectrpc = { version = "0.9.0", default-features = false, features = [
    "client",
    "client-tls",
    "server",
    "gzip",
    "zstd",
    "json",
] }

# Native TLS trust and streaming RPC regression fixture only.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
