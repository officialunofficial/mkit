[package]
name = "mkit-transport-memory"
description = "In-memory transport for mkit, HashMap-backed, used in unit tests and fuzz harnesses"
keywords = ["mkit", "vcs", "transport", "in-memory", "testing"]
categories = ["data-structures", "development-tools::testing"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishable to crates.io. `publish` left unset (cargo default = true).

[lints]
workspace = true

[dependencies]
# Inter-workspace dep needs an explicit `version = ...` alongside the
# path so `cargo publish` accepts it.
mkit-core = { version = "0.3", path = "../mkit-core" }

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
