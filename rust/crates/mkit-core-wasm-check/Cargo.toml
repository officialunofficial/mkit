# Internal test-only crate — NOT published, never a dependency. Runs
# mkit-core's decode-only `pack-ruzstd` path on a real 32-bit
# `wasm32-unknown-unknown` target (under node, via wasm-bindgen-test) over
# the committed C-encoded SPEC-PACKFILE v2 fixtures in
# `rust/tests/golden/pack-v2/`, plus the 32-bit pack-framing overflow
# checks (`tests/pack_framing_32bit.rs`). Native `cargo test` runs the same checks
# on 64-bit. Run the wasm32 lane with `bash scripts/wasm-ruzstd-check.sh`
# (part of `just ci-scripts`).
#
# mkit-core is a dev-dependency only, so this crate never changes the
# feature set of a normal (non-test) workspace build.
[package]
name = "mkit-core-wasm-check"
description = "Internal wasm32 test harness for mkit-core's pack-ruzstd decoder"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
mkit-core = { path = "../mkit-core", default-features = false, features = ["pack-ruzstd"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
