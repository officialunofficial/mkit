# mkit-server-conformance (PRD MKIT-29 §5.1, §5.3), in two parts:
#   (a) the storage-trait suite: every `NamespaceStore` / `BlobStore`
#       backend, in this workspace or a third party's, runs it with one
#       `storage_suite!` invocation;
#   (b) the black-box wire suite (`wire`) and its runner binary
#       (`mkit-server-conformance wire --base-url URL ...`): it drives any
#       `mkit.transport.v1` server over real HTTP and knows nothing of the
#       server's internals.
# Native only: it drives each case on a tokio runtime.
#
# `publish = false` during the epic; WP-REL decides publication. Never a
# dependency of `mkit-cli`.
[package]
name = "mkit-server-conformance"
description = "Conformance suites for mkit-server storage backends and mkit.transport.v1 servers"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Lets the pipeline baseline serve with mkit-server's `test-faults` seam
# (the clock-skew directive, plus the baseline's `GET /__mkit_test/stats`)
# so the `TestFaults` wire cases run. The wire suite itself never needs it.
test-faults = ["mkit-server/test-faults"]
# `fake_s3`: a strict in-memory S3 server (path-style objects, SigV4
# verification, conditional puts, ranges) for testing S3 blob stores in
# normal CI without Docker. A test utility: never in a release binary.
fake-s3 = ["dep:axum", "dep:sha2", "dep:hmac", "tokio/net"]

[dependencies]
mkit-server = { version = "0.4", path = "../mkit-server", features = ["memory"] }
mkit-core = { version = "0.4", path = "../mkit-core", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
bytes = "1"
futures = "0.3"
# The wire suite. Only the generated `mkit.transport.v1` messages of this
# crate are used; requests go out as raw Connect HTTP through connectrpc's
# client transport, so a case controls every byte, header and frame (and
# can send deliberately invalid ones) and sees the HTTP status.
# `client-tls` reaches https deployments.
mkit-transport-connect = { version = "0.4", path = "../mkit-transport-connect" }
connectrpc = { version = "0.9.1", default-features = false, features = ["client", "client-tls", "gzip", "json"] }
buffa = "0.9.1"
http = "1"
http-body-util = "0.1"
webpki-roots = "1"
flate2 = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
getrandom = "0.4"
url = "2"
clap = { version = "4", default-features = false, features = ["std", "help", "error-context", "usage", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# `fake-s3`: the server, and an independent SigV4 verifier (not
# `mkit-transport-s3`'s signer, so a signing bug cannot verify itself).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
sha2 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }

[dev-dependencies]
# tests/fs_backends.rs: the `.mkit`-layout stores (native only, like this
# crate).
mkit-server = { version = "0.4", path = "../mkit-server", features = ["fs"] }
# The SQLite backend under test (tests/sqlite_backends.rs).
mkit-server-native = { path = "../mkit-server-native" }
tempfile = "3"
# The automated wire baselines serve over real HTTP on 127.0.0.1:0.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["net"] }
# tests/baseline_legacy_connect.rs: today's `mkit serve --http`
# (`mkit_transport_connect::router` over `FileTransport`).
mkit-transport-connect = { version = "0.4", path = "../mkit-transport-connect", features = ["server"] }
mkit-transport-file = { version = "0.4", path = "../mkit-transport-file" }

[[bin]]
name = "mkit-server-conformance"
path = "src/bin/mkit-server-conformance.rs"

[[test]]
name = "s3_backends"
required-features = ["fake-s3"]
