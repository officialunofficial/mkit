# mkit-server-conformance (production server work §5.1, §5.3), in two parts:
#   (a) the storage-trait suite: every `NamespaceStore` / `BlobStore`
#       backend, in this workspace or a third party's, runs it with one
#       `storage_suite!` invocation;
#   (b) the black-box wire suite (`wire`) and its runner binary
#       (`mkit-server-conformance wire --base-url URL ...`): it drives any
#       `mkit.transport.v1` server over real HTTP and knows nothing of the
#       server's internals.
# Native only: it drives each case on a tokio runtime.
#
# Published as a library and standalone runner with the next release.
# Never a dependency of `mkit-cli`.
[package]
name = "mkit-server-conformance"
include = ["src/**", "fixtures/**", "README.md", "Cargo.toml"]
description = "Portable wire and server-control conformance suites for mkit servers"
keywords = ["mkit", "vcs", "conformance", "testing", "connectrpc"]
categories = ["network-programming", "development-tools::testing"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Optional extra suite for servers built on the reference storage SPI.
storage-spi = ["dep:mkit-server"]
# Lets the pipeline baseline serve with mkit-server's `__test-faults` seam
# (the clock-skew directive, plus the baseline's `GET /__mkit_test/stats`)
# so the `TestFaults` wire cases run. The wire suite itself never needs it.
__test-faults = ["storage-spi", "mkit-server/__test-faults"]
http-objects = ["storage-spi", "mkit-server/http-objects"]
# `stubs`: in-process stand-ins for external services a server talks to.
# `stubs::hook` is a `mkit.server.hooks.v1` hook service that verifies every
# SPEC-SERVER §7.1 signed request (with mkit-server's `HookVerifier`), answers from a script and records calls
# (WP-3.8; WP-3.12 builds its payment stub on it). A test utility: never in a
# production artifact.
stubs = [
    "storage-spi",
    "dep:axum",
    "dep:hmac",
    "tokio/net",
    "mkit-server/remote-hooks",
    "mkit-rpc/hooks",
]
# Test-only in-process server for contract consumers. It is deliberately
# opt-in; optimized builds additionally require `reference-runner`.
test-host = [
    "storage-spi",
    "__test-faults",
    "http-objects",
    "stubs",
    "dep:axum",
    "dep:reqwest",
    "dep:tower-http",
    "dep:tower",
    "tokio/io-util",
    "tokio/net",
]

# Explicit opt-in for the optimized standalone differential test utility.
# This feature is never enabled by production binaries.
reference-runner = ["test-host"]

[dependencies]
mkit-rpc = { version = "0.5", path = "../mkit-rpc" }
base64 = "0.23"
mkit-server = { version = "0.5", path = "../mkit-server", features = ["memory"], optional = true }
mkit-core = { version = "0.5", path = "../mkit-core", default-features = false }
mkit-attest = { version = "0.5", path = "../mkit-attest", default-features = false, features = ["grants"] }
k256 = { version = "0.14", features = ["ecdsa"] }
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
bytes = "1"
futures = "0.3"
# The wire suite. Only the generated `mkit.transport.v1` messages of this
# crate are used; requests go out as raw Connect HTTP through connectrpc's
# client transport, so a case controls every byte, header and frame (and
# can send deliberately invalid ones) and sees the HTTP status.
# `client-tls` reaches https deployments.
mkit-transport-connect = { version = "0.5", path = "../mkit-transport-connect" }
connectrpc = { version = "0.9.1", default-features = false, features = ["client", "client-tls", "gzip", "json"] }
buffa = "0.9.1"
http = "1"
http-body-util = "0.1"
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "tokio"] }
webpki-roots = "1"
flate2 = "1"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
getrandom = "0.4"
url = { version = "2", features = ["serde"] }
clap = { version = "4", default-features = false, features = ["std", "help", "error-context", "usage", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Loopback test host and signed hook stubs.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "tokio",
    "json",
], optional = true }
hmac = { version = "0.13", optional = true }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "stream",
], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", default-features = false, features = ["cors"], optional = true }

[dev-dependencies]
mkit-client = { version = "0.5", path = "../mkit-client" }
base64 = "0.23"
mkit-cli = { version = "0.5", path = "../mkit-cli" }
# The `.mkit`-layout stores `mkit serve` uses, for tests/fs_backends.rs.
mkit-server = { version = "0.5", path = "../mkit-server", features = ["memory", "fs"] }
tempfile = "3"
# The automated wire baselines serve over real HTTP on 127.0.0.1:0.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["net"] }

[[bin]]
name = "mkit-server-conformance"
path = "src/bin/mkit-server-conformance.rs"

[[test]]
name = "memory_backends"
required-features = ["storage-spi"]

[[test]]
name = "fs_backends"
required-features = ["storage-spi"]

[[test]]
name = "suite_selftest"
required-features = ["storage-spi"]

[[test]]
name = "baseline_pipeline_memory"
required-features = ["storage-spi"]
