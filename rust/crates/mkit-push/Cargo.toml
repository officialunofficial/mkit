[package]
name = "mkit-push"
description = "Deprecated: a re-export of mkit-client, the runtime-independent async protocol client"
readme = "README.md"
keywords = ["mkit", "vcs", "push", "wasm", "client"]
categories = ["network-programming", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["pack-ruzstd"]
pack-zstd = ["mkit-client/pack-zstd"]
pack-ruzstd = ["mkit-client/pack-ruzstd"]

[dependencies]
mkit-client = { version = "0.5", path = "../mkit-client", default-features = false }

[dev-dependencies]
mkit-core = { version = "0.5", path = "../mkit-core", default-features = false }
