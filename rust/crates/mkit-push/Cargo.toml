[package]
name = "mkit-push"
description = "Runtime-independent async ticketed push for native and wasm mkit clients"
readme = "README.md"
keywords = ["mkit", "vcs", "push", "wasm", "client"]
categories = ["network-programming", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
mkit-core = { version = "0.5", path = "../mkit-core", default-features = false }
mkit-rpc = { version = "0.5", path = "../mkit-rpc", features = ["transport-messages"] }
buffa = "0.9.1"
http = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
