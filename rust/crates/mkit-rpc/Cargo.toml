[package]
name = "mkit-rpc"
description = "Versioned wire protocols for mkit cross-system speech: external signers (signer.proto), SSH transport frames (ssh.proto), shared types (common.proto). Schemas defined in protobuf via buffa, with length-prefixed framing."
keywords = ["mkit", "rpc", "protobuf", "buffa"]
categories = ["encoding", "data-structures"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# buffa-generated code inherits docstrings from our .proto comments,
# which clippy flags for missing backticks around protocol-name
# tokens (WebAuthn, ClientDataJSON, ED25519, …). The .proto is the
# source of truth and we don't want to backtick-hell the human
# documentation there. Override the workspace lint set for this crate
# only.
[lints.clippy]
# Drop pedantic + nursery + cargo for this crate. The buffa-generated
# code (~640 KiB into $OUT_DIR) inherits docstrings from our .proto
# files and uses code patterns that pedantic flags hundreds of times.
# We keep `clippy::all` (the correctness + style baseline) and our
# own hand-written code in src/ stays under it.
all = { level = "warn", priority = -1 }

# Kani proof harnesses live in `#[cfg(kani)]` modules (`cargo kani` sets
# the cfg); declare it so normal builds don't flag it as unexpected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
# Shared wasm-clean TransportService and health messages and Connect bindings.
transport = ["dep:connectrpc", "dep:connectrpc-build", "dep:serde", "buffa/json"]
# Runtime-free public hook messages, JSON codec and Ed25519 authentication.
hooks = ["buffa/json", "dep:ed25519-dalek", "dep:zeroize", "dep:serde", "dep:serde_json"]
# Opt-in `arbitrary::Arbitrary` derives on all generated wire types,
# for fuzzing / property tests (used by the rust/fuzz harness). Off by
# default so downstream consumers don't pull in `arbitrary`.
arbitrary = ["dep:arbitrary", "buffa/arbitrary"]

[dependencies]
connectrpc = { version = "0.9.1", default-features = false, features = ["gzip", "json"], optional = true }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"], optional = true }
zeroize = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
arbitrary = { version = "1", optional = true }
buffa = "0.9.1"
thiserror = "2"
# mkit-rpc now also re-exports a small set of shared transport-side
# frame helpers (cond_to_wire, rpc_error_to_transport, ref_entry_to_ref,
# unexpected_frame, body_name, MAX_REF_NAME, CHUNK_DATA_MAX) — used by
# both mkit-transport-ssh and mkit-transport-enc. Those helpers need
# `TransportError`, `Ref`, `RefWriteCondition`, and `validate_ref_name`
# from mkit-core. mkit-core does NOT depend on mkit-rpc, so this is
# acyclic.
#
# `default-features = false`: same wasm32-safety rationale as
# mkit-attest's edge to mkit-core (see that crate's Cargo.toml) — this
# crate sits on the mkit-wasm -> mkit-attest -> mkit-rpc -> mkit-core
# path, and mkit-core's default `pack-zstd` feature (issue #646) pulls
# a non-wasm32-buildable C dependency. Every other consumer of
# mkit-rpc (mkit-cli, mkit-attest, mkit-transport-enc,
# mkit-transport-ssh) also depends on mkit-core directly with default
# features on, so their builds still get `pack-zstd` via that edge.
mkit-core = { version = "0.5", path = "../mkit-core", default-features = false }

[build-dependencies]
connectrpc-build = { version = "0.9.0", optional = true }
buffa-build = "0.9.1"

[dev-dependencies]
hex = "0.4"

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
