// SPDX-License-Identifier: MIT OR Apache-2.0
//
// mkit SSH transport wire protocol v1.
//
// The protocol mkit v0.1.0 speaks over its `ssh(1)` child process to
// a remote `mkit-server`. v1 is the only protocol; there is no
// fallback. A future breaking revision will introduce a sibling
// `ssh2.proto` rather than mutating the v1 schema in place.
//
// ## Wire framing
//
// Every message on the wire is a length-prefixed `SshFrame`:
//
//     [u32 LE length][N bytes protobuf-encoded SshFrame]
//
// The 4-byte length prefix is the encoded length of the SshFrame in
// bytes (NOT including the prefix itself). Length is bounded by
// `MAX_FRAME_BYTES = 1 MiB` for control frames; pack data flows
// through a separate streaming channel (see PackChunk below) with
// per-chunk caps.
//
// ## Transport
//
// The SSH child process (`ssh user@host -- mkit-server`) receives
// SshFrame messages on its stdin and emits SshFrame messages on its
// stdout. The forced-command server pattern from SPEC-TRANSPORT §4.1
// remains: trust is delegated to the user's `ssh(1)` configuration
// (host-key verification, identity selection).
//
// ## Conversation flow
//
//   client -> server:    Hello{ proto = PROTOCOL_VERSION_1, ... }
//   server -> client:    HelloResponse{ proto, server_id }
//                         OR
//   server -> client:    Error
//
//   then any sequence of:
//
//   client -> server:    ListRefs{ prefix }
//   server -> client:    ListRefsResponse{ refs[] }    OR Error
//
//   client -> server:    ReadRef{ name }
//   server -> client:    ReadRefResponse{ object_id }   OR Error
//
//   client -> server:    UpdateRef{ name, expected_id, new_id }
//   server -> client:    UpdateRefResponse{}            OR Error
//
//   client -> server:    PackExists{ pack_id }
//   server -> client:    PackExistsResponse{ exists }   OR Error
//
//   client -> server:    UploadPack{ pack_id, total_bytes }
//   client -> server:    PackChunk{ pack_id, offset, data, last }
//                         (... repeated until last=true ...)
//   server -> client:    UploadPackResponse{}           OR Error
//
//   client -> server:    DownloadPack{ pack_id }
//   server -> client:    DownloadPackHeader{ total_bytes }
//   server -> client:    PackChunk{ pack_id, offset, data, last }
//                         (... repeated until last=true ...)
//                         OR Error before any chunk is sent
//
//   client -> server:    Close{}    (advisory; either side MAY just
//                                    close the underlying stream)

edition = "2023";

package mkit.rpc.v1.ssh;

import "common.proto";

// ----------------------------------------------------------------------------
// SshFrame — the union of every control / data message on the wire.

message SshFrame {
  oneof body {
    // Connection lifecycle.
    Hello hello = 1;
    HelloResponse hello_response = 2;
    Error error = 3;
    Close close = 4;

    // Refs.
    ListRefs list_refs = 10;
    ListRefsResponse list_refs_response = 11;
    ReadRef read_ref = 12;
    ReadRefResponse read_ref_response = 13;
    UpdateRef update_ref = 14;
    UpdateRefResponse update_ref_response = 15;

    // Packs.
    PackExists pack_exists = 20;
    PackExistsResponse pack_exists_response = 21;
    UploadPack upload_pack = 22;
    UploadPackResponse upload_pack_response = 23;
    DownloadPack download_pack = 24;
    DownloadPackHeader download_pack_header = 25;
    PackChunk pack_chunk = 26;
  }
}

// ----------------------------------------------------------------------------
// Connection lifecycle.

message Hello {
  ProtocolVersion proto = 1;

  // Caller binary name and version, advisory. Logged by the server,
  // not used for auth.
  string client_id = 2;
}

message HelloResponse {
  ProtocolVersion proto = 1;
  string server_id = 2;
}

// Advisory close. Either side MAY simply close the underlying stream.
message Close {
  // Optional reason, advisory.
  string reason = 1;
}

// ----------------------------------------------------------------------------
// Refs.

message ListRefs {
  // Prefix filter, e.g. "refs/heads/". Empty means "all refs". Length
  // capped at MAX_REF_NAME (4096 bytes).
  string prefix = 1;
}

message ListRefsResponse {
  message RefEntry {
    string name = 1;
    bytes object_id = 2;  // raw 32-byte BLAKE3 digest
  }
  repeated RefEntry refs = 1;
}

message ReadRef {
  string name = 1;
}

message ReadRefResponse {
  // Empty bytes means the ref does not exist (distinguish from
  // Error which means "lookup failed").
  bytes object_id = 1;
}

// Compare-and-swap ref update. `expected_id` MUST match the current
// ref state (or be empty for "ref MUST not exist"). Atomic on the
// server.
message UpdateRef {
  string name = 1;
  bytes expected_id = 2;
  bytes new_id = 3;       // empty new_id deletes the ref
}

message UpdateRefResponse {
  // Empty body is success. Server returns Error for CAS mismatch
  // (ERROR_CODE_INVALID_REQUEST with details = current id) or any
  // other failure.
}

// ----------------------------------------------------------------------------
// Packs.

message PackExists {
  bytes pack_id = 1;  // raw 32-byte BLAKE3 digest
}

message PackExistsResponse {
  bool exists = 1;
}

// Upload begins the streaming upload of a pack. `total_bytes` is
// advisory and lets the server reject before allocating buffers if
// the pack is too large.
message UploadPack {
  bytes pack_id = 1;
  uint64 total_bytes = 2;
}

message UploadPackResponse {
  // Empty body is success.
}

message DownloadPack {
  bytes pack_id = 1;
}

// Server emits this once before the first PackChunk on a download.
message DownloadPackHeader {
  uint64 total_bytes = 1;
}

// Streaming pack data. Chunks arrive in offset order (ascending,
// no gaps). The final chunk has `last = true`. Per-chunk data size
// is bounded by MAX_FRAME_BYTES (1 MiB) less envelope overhead.
message PackChunk {
  bytes pack_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool last = 4;
}
