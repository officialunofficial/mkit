[package]
name = "mkit-benches"
description = "Benchmark harness + chart generator for mkit. Runs criterion benches across hashing, sign/verify, object-commit, and pack-create paths, then renders the results into buffa-style SVG charts under benchmarks/charts/."
keywords = ["mkit", "benchmark", "criterion"]
categories = ["development-tools::profiling"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Bench code is not production: relax pedantic lints. We keep
# `clippy::all` for correctness baseline.
[lints.clippy]
all = { level = "warn", priority = -1 }
doc_lazy_continuation = "allow"

[[bin]]
name = "render-charts"
path = "src/bin/render-charts.rs"

# Each `[[bench]]` entry is a discrete criterion suite.
[[bench]]
name = "hashing"
harness = false

[[bench]]
name = "sign_verify"
harness = false

[[bench]]
name = "object_commit"
harness = false

[[bench]]
name = "pack_create"
harness = false

# Issue #646 — SPEC-PACKFILE v2 zstd compression: pack-byte comparison
# ({v1 uncompressed, v2 compressed}) for a small multi-commit text-file
# corpus. Not gated on any feature — `pack-zstd` is a default feature
# of `mkit-core`, so a plain `cargo bench -p mkit-benches --bench
# pack_compression` exercises the real compressed path.
[[bench]]
name = "pack_compression"
harness = false

[[bench]]
name = "store_write"
harness = false

# `ObjectStore::bulk_writer` ingest cost (the `git-import` object-sink
# path) — regression guard for the shard-dir `create_dir_all`
# memoization in `BulkWriter::write`. No feature gate: bulk_writer is
# always compiled.
[[bench]]
name = "bulk_writer"
harness = false

# Issue #644 — refs::update_ref CAS-variant latency + list_refs at
# increasing ref counts. No feature gate: refs are always compiled.
[[bench]]
name = "refs_ops"
harness = false

# Issue #644 — repo_lock acquire/release round trip + contended-handoff
# latency. Also the regression guard for issue #635's lock-primitive
# fix. No feature gate: repo_lock is always compiled.
[[bench]]
name = "lock_contention"
harness = false

# Issue #708 — `mkit add -A` staging cost (10k/100k synthetic files),
# guarding against the `Index::find_entry`/`remove_file_directory_conflicts`
# O(n)-scan-per-file regression that made bulk staging O(N^2). No feature
# gate: `add` is always compiled.
[[bench]]
name = "add_staging"
harness = false

# PR #951 Slack thread — sequential-vs-rayon crossover for the
# per-file hash fan-out `add -A`/`add .` uses, isolated from the
# walk/index/commit overhead `add_staging` above also measures. No
# feature gate: worktree hashing is always compiled.
[[bench]]
name = "add_hash_fanout"
harness = false

# Push-path pack building's per-entry compression fan-out —
# `PackWriter::prepare_raw`/`prepare_delta`, added alongside
# `mkit-cli`'s `build_and_upload_packs` rayon fan-out so a push
# serialising many objects compresses them across threads instead of
# one at a time. Same isolation shape as `add_hash_fanout` above: just
# the fan-out decision, not the surrounding plan/seal/upload cost. No
# feature gate: `pack-zstd` is a default feature of `mkit-core`.
[[bench]]
name = "pack_build_fanout"
harness = false

# Issue #159 — sharded vs monolithic 100 MiB pack transfer
# with simulated network jitter. Default-off (the `pack-shards`
# feature on mkit-core pulls in the commonware dep stack, which is
# heavy). Run with:
#
#     cargo bench -p mkit-benches --features pack-shards \
#                 --bench pack_shard_transfer
#
# Not gated on in CI — exists for future regression tracking.
[[bench]]
name = "pack_shard_transfer"
harness = false
required-features = ["pack-shards"]

# Issue #157 / #644 — journaled commit-history MMR: open_at (cold +
# warm), a warm single append, and a backfill series. Default-off (the
# `history-mmr` feature on mkit-core pulls in the same heavy
# commonware-storage/-runtime + tokio stack as `pack-shards`). Run
# with:
#
#     cargo bench -p mkit-benches --features history-mmr \
#                 --bench history_mmr
#
# Not gated on in CI — exists for future regression tracking, mirroring
# `pack_shard_transfer` above.
[[bench]]
name = "history_mmr"
harness = false
required-features = ["history-mmr"]

[features]
default = []
pack-shards = ["mkit-core/pack-shards"]
# Mirrors mkit-core's `history-mmr` feature so `history_mmr.rs` can be
# conditionally compiled and run via
# `cargo bench -p mkit-benches --features history-mmr`. Issue #644 —
# this feature did not exist on the bench crate at all before this.
history-mmr = ["mkit-core/history-mmr"]

# The lib + render-charts bin only need serde for the Sample/Unit
# contract; the bench suites pull in their measurement deps below.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["plotters", "cargo_bench_support", "html_reports"] }
mkit-core = { path = "../crates/mkit-core" }
# add_staging.rs drives the real `mkit add -A` CLI path in-process (issue
# #708) — mkit-cli's library surface is unstable/internal-only (see its
# Cargo.toml header), which is fine for a dev-dependency exercising it as
# a black box, same as the CLI's own integration tests do.
mkit-cli = { path = "../crates/mkit-cli" }
blake3 = "1"
sha1 = "0.11"
sha2 = "0.11"
blake2 = "0.11"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
tempfile = "3"
git2 = "0.21"
# add_hash_fanout.rs benchmarks the same sequential-vs-rayon fan-out
# `mkit-cli`'s add.rs uses (rayon = "1" there too).
rayon = "1"
