# cargo-deny schema v2 (EmbarkStudios/cargo-deny >= 0.16). Severity keywords
# moved from per-check settings to the top level; what remains here are
# "scope" values: which dep set each check applies to.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Transitive through yubikey 0.9.0-pre.0 for certificate parsing; mkit does
    # not expose RSA private-key decryption, and no fixed yubikey release exists.
    #
    # TODO(2026-08-21): re-justify this ignore or drop it. cargo-deny v0.19's
    # advisories schema does not yet support a native `expires` field on
    # ignore entries (unexpected-keys error on `expires`), so we encode the
    # 90-day expiry in this TODO comment plus a reminder block in
    # .github/workflows/rust-security.yml. When cargo-deny adds `expires`
    # natively, replace this with the structured form.
    #
    # The regression test in rust/crates/mkit-keystore/tests/no_rsa_decrypt.rs
    # asserts the yubikey RSA decrypt entrypoint stays unreferenced workspace-
    # wide; if that test is removed, this ignore MUST go too.
    { id = "RUSTSEC-2023-0071", reason = "transitive via yubikey 0.9.0-pre.0 cert parsing; mkit never calls the affected RSA decrypt path (see mkit-keystore/tests/no_rsa_decrypt.rs). Re-justify by 2026-08-21." },
    # `paste` (macro crate) marked unmaintained 2024-10-07. Pulled
    # transitively by commonware-* (via blst/aws-lc-sys macro
    # expansion) when the optional `history-mmr` / `sparse-checkout`
    # / `pack-shards` / `bls-threshold` features are enabled. No
    # runtime exposure: paste expands at compile time, produces no
    # binary code we own. Tracked upstream in
    # https://github.com/anthropics/buffa/issues — once commonware
    # migrates off paste this ignore goes. Re-justify by 2026-08-21.
    { id = "RUSTSEC-2024-0436", reason = "transitive via commonware-* feature-gated deps; macro-only, no runtime exposure. Re-justify by 2026-08-21." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    # libfuzzer-sys ships its LLVM-derived C shim under NCSA alongside
    # its Rust MIT/Apache-2.0. Pulled in only when --features libfuzzer
    # is enabled (not our default).
    "NCSA",
    # `option-ext` (transitive dep of ctap-hid-fido2 via the dirs-sys
    # path) ships under MPL-2.0. MPL-2.0 is a file-level copyleft —
    # modifications to MPL-licensed files must remain MPL, but
    # combining with differently-licensed code is allowed. Widely used
    # (Firefox, Thunderbird). Accepted for transitive use.
    "MPL-2.0",
    # webpki-roots / cert bundles used by rustls ship under the
    # Community Data License (CDLA) Permissive 2.0 — an OSI-aligned
    # permissive data license for the Mozilla CA trust store snapshot.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other via `path = "..."` without a
# version pin, which cargo-deny treats as a wildcard. This is the normal
# shape for a Rust workspace that never publishes; whitelist it.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
