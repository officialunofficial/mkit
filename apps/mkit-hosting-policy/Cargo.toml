[package]
name = "mkit-hosting-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hosting-wasm = ["dep:wasm-bindgen", "dep:serde_json", "dep:base64"]

[dependencies]
mkit-core = { path = "../../rust/crates/mkit-core", default-features = false }
ed25519-dalek = { version = "3", default-features = false }
blake3 = "1"
commonware-codec = { version = "=2026.9.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
ed25519-dalek = { version = "3", default-features = false, features = ["rand_core"] }
serde_json = "1"
