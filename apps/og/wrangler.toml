name = "mkit-og"
# No account_id here — deploys to the same Official Unofficial, Inc. account
# (owner of the mkit.sh zone) that mkit-mcp deploys to, resolved via the
# CLOUDFLARE_ACCOUNT_ID env var at deploy time like apps/repo-worker,
# apps/keys-worker, apps/mcp.
main = "src/index.ts"
compatibility_date = "2026-02-25"

[observability]
enabled = true

# Custom domain on the mkit.sh zone (mirrors mcp.mkit.sh in apps/mcp/wrangler.jsonc).
# Wrangler auto-creates the proxied DNS record + cert on deploy.
[[routes]]
pattern = "og.mkit.sh"
custom_domain = true
