# mkit reference `mkit.transport.v1` server — a Rust Cloudflare Worker
# (workers-rs). Since WP-M0-17 it is a thin deployment of
# `mkit-server-worker` (rust/crates/mkit-server-worker): the fetch handler
# and the RefStore Durable Object call its adapter, which serves the
# production pipeline's Connect binding over R2 and Durable Object SQLite.
# No protocol logic and no generated code live here.
#
# Built with `worker-build` (see wrangler.jsonc `[build] command`), which
# compiles this cdylib to `wasm32-unknown-unknown` and emits the ES-module
# shim + bindings glue. A standalone package, not a member of rust/'s
# workspace: `worker-build` builds it with this directory's own Cargo.lock,
# which every PR that changes mkit-server* dependencies refreshes
# (`cargo check --target wasm32-unknown-unknown` here).
[package]
name = "mkit-vcs-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The `#[event(fetch)]` and `#[durable_object]` macros. Same pin and
# features as mkit-server-worker and apps/mkit-worker-common.
worker = { version = "0.8", features = ["http"] }
# The adapter: its default features keep `mkit-core`'s `pack-zstd`
# (zstd-sys, C) out of this wasm32 graph.
mkit-server-worker = { path = "../../rust/crates/mkit-server-worker" }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true

[features]
# Local-only fault injection and test hooks (the pipeline's
# `x-mkit-test-fault`/clock-skew directives, the store faults,
# `GET /__mkit_test/stats`, `TEST_QUOTA_*`); omitted from production builds.
test-faults = ["mkit-server-worker/test-faults"]
