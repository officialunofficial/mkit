[package]
name = "mkit-embedding-conformance-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8", features = ["http"] }
mkit-server-worker = { path = "../../../../rust/crates/mkit-server-worker", features = ["http-objects", "pack-ruzstd"] }
mkit-server = { path = "../../../../rust/crates/mkit-server", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true

[workspace]

[patch.crates-io]
ruzstd = { path = "../../../../rust/vendor/ruzstd" }
