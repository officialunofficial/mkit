[package]
name = "mkit-keys-worker"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

# Standalone Worker workspace. Auth v2 uses the same pure verifier and durable
# replay transaction adapter as the repository Workers.
[workspace]

[lib]
crate-type = ["cdylib"]

[features]
# Local runtime fault injection only; production build commands do not enable it.
test-faults = []

[dependencies]
mkit-core = { path = "../../rust/crates/mkit-core", default-features = false }
mkit-worker-common = { path = "../mkit-worker-common" }
# workers-rs provides the request and Durable Object JS/Wasm bindings.
worker = { version = "0.8", features = ["http"] }

# BLAKE3 content-address primitive — the envelope's body digest + signing digest
# are plain BLAKE3, matching the web client's `api.blake3_hex`.
blake3 = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
