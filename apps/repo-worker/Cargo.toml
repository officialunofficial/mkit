# SPDX-License-Identifier: MIT OR Apache-2.0
#
# mkit anonymous-multiplayer repo server — a Rust Cloudflare Worker
# (workers-rs) speaking ConnectRPC over the `mkit.repo.v1.RepoService`
# contract in proto/mkit/repo/v1/repo.proto.
#
# Built with `worker-build` (see wrangler.jsonc `[build] command`), which
# compiles this cdylib to `wasm32-unknown-unknown` and emits the ES-module
# shim + bindings glue.
[package]
name = "mkit-repo-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# workers-rs: the user-facing crate. Request/Response, Env, Bucket (R2),
# State/Storage + SqlStorage (DO), WebSocket — all wrappers over the
# JS/WASM interop. We never touch worker-sys directly.
worker = { version = "0.8", features = ["http"] }

# ConnectRPC core — the tower::Service is `ConnectRpcService` and the Router
# both live in the default/core path (no feature needed). We pin the same
# crates.io version the sibling `rust/crates/mkit-repo-client` resolves, so
# the pair stays on a single version, with `default-features = false` to drop
# the `streaming` default (it pulls tokio-based `async-compression`, which
# won't build on wasm32) plus `server`/`client`/`axum`/`tls` (hyper +
# tokio/net). `gzip` matches the client and is wasm-clean. As of 0.8 `json`
# is a default-on FEATURE that default-features = false would drop; we
# re-enable it explicitly so the buffa-generated message types keep their
# serde derives and JSON error / end-of-stream frames keep working
# (serde_json is wasm-safe). The Router runs without a tokio runtime — its
# wasm32 internal spawn is wasm_bindgen_futures::spawn_local. connectrpc 0.9
# requires buffa ^0.9.1 (matched codegen), matching the main workspace's pin.
connectrpc = { version = "0.9.0", default-features = false, features = ["gzip", "json"] }
buffa = "0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CORS/body-cap/fetch-adapter glue shared with apps/vcs-worker (mkit#797) —
# a standalone sibling crate, not a rust/ workspace member (same pattern as
# the mkit-core/mkit-attest path deps below).
mkit-worker-common = { path = "../mkit-worker-common" }

# mkit crates by path (BLAKE3 hashing + native Ed25519 strict verify).
# Both are wasm-clean in their default builds (no tokio / no commonware
# heavy features). mkit-wasm depends on these same paths and ships to
# wasm32, which is our parity proof that they compile to the target.
# `default-features = false` on mkit-core drops `pack-zstd` (on by
# default for native consumers): zstd-sys can't target
# wasm32-unknown-unknown, and this worker compiles to that target via
# worker-build same as mkit-wasm — mirror its opt-out here too.
mkit-core = { path = "../../rust/crates/mkit-core", default-features = false }
mkit-attest = { path = "../../rust/crates/mkit-attest" }

# Ed25519 strict verify for the write-envelope. The envelope is a PLAIN
# BLAKE3 digest (no mkit commit/remix/tag domain prefix), so we cannot use
# mkit_core::sign::verify (which applies domain_digest). We strict-verify
# directly with the SAME dalek `verify_strict` mkit-core uses under the
# hood — byte-for-byte the same RFC-8032/ZIP-215-off line.
ed25519-dalek = { version = "2", default-features = false }

# http / body plumbing for the worker::Request <-> connectrpc adapter.
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
hex = "0.4"

# The WatchRefs Connect-streaming bridge (worker_impl/service.rs): an owned
# mpsc channel is the `Send + 'static` boundary the bridge crosses, and
# `spawn_local` (not a `Send`-bounded spawn) is what lets the task on the
# other end own the borrowed `WebSocket::events()` stream without that
# borrow ever needing to escape. Already in the dep graph transitively via
# `worker`; declared directly because this crate's own code names them.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
wasm-bindgen-futures = "0.4"

# Activate browser randomness backends for getrandom in the dep graph on
# wasm32 (mirrors mkit-wasm's posture — dalek/mkit-core pull getrandom 0.4,
# the k256/p256 stack in mkit-attest pulls 0.2; each needs its own feature).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[build-dependencies]
connectrpc-build = "0.9.0"

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
rand_core = "0.6"
# Host-side WatchRefs Connect-streaming integration test
# (tests/watch_refs_stream.rs) needs an executor for `#[tokio::test]`; the
# worker itself never depends on tokio (its runtime is wasm_bindgen_futures on
# wasm32), so this is a test-only, host-only addition.
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
opt-level = "s"
lto = true
