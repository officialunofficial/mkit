# DEV-ONLY local config (not committed). Same as wrangler.toml but the build
# command is a no-op: the wasm bundle is prebuilt with `worker-build --release`,
# and letting wrangler re-run worker-build on its file-watcher causes an infinite
# rebuild/reload loop (it watches the build/ dir it writes into).
name = "mkit-repo-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-09-23"

[build]
command = "true"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "mkit-repo-objects"

[[durable_objects.bindings]]
name = "REFSTORE"
class_name = "RefStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RefStore"]
