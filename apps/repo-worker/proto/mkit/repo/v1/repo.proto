// SPDX-License-Identifier: MIT OR Apache-2.0
//
// mkit anonymous multiplayer repo — ConnectRPC wire protocol v1.
//
// A single shared mkit repository that anyone may push to anonymously, each
// write signed with an Ed25519 key (the key is the whole identity; no
// accounts, no allow-list). See
// docs/research/passkey-multiplayer-architecture.md.
//
// Storage model (framework-independent):
//   - Immutable mkit objects (commits / trees / blobs) are content-addressed
//     by their 32-byte BLAKE3 id and stored once (idempotent).
//   - Refs are the only mutable state, advanced via compare-and-swap.
//   - WatchRefs streams live ref advances for the multiplayer UI.
//
// Conventions mirror mkit-rpc/proto/ssh.proto + common.proto:
//   - edition 2023.
//   - All object/ref ids are raw `bytes` = 32-byte BLAKE3 digests (never hex
//     on the wire).
//   - The CAS enum is `RefExpectation` with the SAME wire numbers as ssh.proto
//     (ANY=1, MISSING=2, MATCH=3; UNSPECIFIED=0 is a protocol error).
//   - `RefEntry { string name; bytes object_id; }` matches
//     ListRefsResponse.RefEntry in ssh.proto.
//
// AUTH (transport-level, not in this proto): every unary/stream call carries
// the signed-write envelope as request metadata (headers) — `X-Public-Key`,
// `X-Signature`, `X-Digest`, `X-Created-At`, `Idempotency-Key`. The canonical
// signed string is defined in src/lib/envelope.ts and the README. Verification
// is open-write/demo-mode: any valid Ed25519 key may write any ref. Carrying
// auth in metadata (rather than proto fields) keeps the message shapes clean
// and lets the same envelope guard every procedure uniformly.

edition = "2023";

package mkit.repo.v1;

// ----------------------------------------------------------------------------
// CAS semantics for UpdateRef. Wire numbers are load-bearing and match
// mkit.rpc.v1.ssh.RefExpectation — do NOT renumber; new variants append.

enum RefExpectation {
  // Protocol error if sent (the proto default). Servers MUST reject.
  REF_EXPECTATION_UNSPECIFIED = 0;

  // "Clobber" / last-writer-wins. `expected_id` MUST be empty.
  REF_EXPECTATION_ANY = 1;

  // "Create only". The ref MUST NOT already exist. `expected_id` MUST be
  // empty. (ANY overwrites an existing ref; MISSING conflicts on it.)
  REF_EXPECTATION_MISSING = 2;

  // Compare-and-swap. `expected_id` MUST be the 32-byte current value.
  REF_EXPECTATION_MATCH = 3;
}

// A single ref and the object it points at. Matches ssh.proto RefEntry.
message RefEntry {
  string name = 1;        // e.g. "refs/heads/main" (mkit ref-name grammar)
  bytes object_id = 2;    // raw 32-byte BLAKE3 digest
}

// ----------------------------------------------------------------------------
// RepoService — the full anonymous-push + multiplayer surface.

service RepoService {
  // Store a loose mkit object. The server MUST verify BLAKE3(bytes)==object_id
  // and store idempotently (a re-PUT of the same id is a no-op).
  rpc PutObject(PutObjectRequest) returns (PutObjectResponse);

  // Fetch a loose object by id. `found=false` if absent.
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);

  // Read a ref's current value. `exists=false` if absent.
  rpc GetRef(GetRefRequest) returns (GetRefResponse);

  // Advance a ref under a CAS condition. `committed` on success, `conflict`
  // on a precondition failure (the existing value is returned in
  // `current_id` so the client can rebase/retry).
  rpc UpdateRef(UpdateRefRequest) returns (UpdateRefResponse);

  // List refs under an optional prefix.
  rpc ListRefs(ListRefsRequest) returns (ListRefsResponse);

  // Server-streaming live ref advances for the room — one RefEvent per
  // successful UpdateRef, to every subscriber.
  rpc WatchRefs(WatchRefsRequest) returns (stream RefEvent);

  // Post a signed chat message to the room. The write envelope (request
  // metadata) authenticates the author exactly like UpdateRef — the verified
  // Ed25519 pubkey IS the author, no accounts. The server content-addresses
  // the canonical message bytes by BLAKE3 (stored once in the object store,
  // like a commit), assigns a monotonic per-room sequence, and broadcasts a
  // chat frame to every `/watch/<room>` subscriber. Rate-limited + length-
  // capped server-side; `rate_limited=true` (with `accepted=false`) when the
  // author posted too recently.
  rpc PostMessage(PostMessageRequest) returns (PostMessageResponse);

  // Recent messages for the room, oldest-first (chat reading order), capped by
  // `limit`. Unauthenticated — reading the lobby is open to everyone.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // Toggle a signed emoji reaction on a feed item (a chat message or a commit),
  // keyed by its hex id. Signed like PostMessage — the verified Ed25519 pubkey
  // is the reactor. Idempotent per (author, target, emoji): a second call from
  // the same author removes it. Broadcasts a reaction frame to subscribers.
  rpc React(ReactRequest) returns (ReactResponse);

  // All reactions in the room (target_id → emoji → reactors); the client
  // aggregates counts + "did I react". Unauthenticated read.
  rpc ListReactions(ListReactionsRequest) returns (ListReactionsResponse);

  // Walk the commit chain server-side from a ref head (or a `start_id` cursor)
  // by first-parent, returning a bounded page of RAW commit/remix objects in ONE
  // round-trip — instead of the client issuing O(depth) sequential GetObject
  // calls that can't be pipelined (each parent id is only known after decoding
  // the previous object). The client decodes the bytes with its existing
  // decoder, so the server needs no field-by-field parity. Unauthenticated read.
  rpc ListCommits(ListCommitsRequest) returns (ListCommitsResponse);
}

// ----------------------------------------------------------------------------
// Objects.

message PutObjectRequest {
  string room = 1;
  bytes object_id = 2;    // 32-byte BLAKE3 of `bytes`
  bytes bytes = 3;        // raw mkit object bytes
}

message PutObjectResponse {
  bool stored = 1;        // true if this call wrote the object
  bool duplicate = 2;     // true if the object already existed (no-op write)
}

message GetObjectRequest {
  string room = 1;
  bytes object_id = 2;
}

message GetObjectResponse {
  bool found = 1;
  bytes bytes = 2;        // empty when found=false
}

// Server-side commit-log walk (one round-trip per page).
message ListCommitsRequest {
  string room = 1;
  string ref = 2;         // ref name to resolve as the head; empty = "main"
  bytes start_id = 3;     // optional cursor: walk from here instead of the ref head
  uint32 page_size = 4;   // max commits to return; the server caps this
}

// A denormalized commit-log entry served straight from the DO index — the
// fields the client renders, so it needs NO raw object bytes and NO decode.
// Hex strings throughout (matches the client's row shape 1:1).
message CommitEntry {
  string hash = 1;            // 64-hex commit/remix id
  string parent = 2;          // 64-hex first parent; empty if root
  string author_pubkey = 3;   // 64-hex signer
  string message = 4;
  int64 created_at_unix = 5;  // unix seconds (client renders ISO)
  string kind = 6;            // "commit" | "remix"
  string sources_json = 7;    // [[upstreamHex, commitHex], …]; "[]" for a commit
}

message ListCommitsResponse {
  repeated CommitEntry commits = 1;
  string next_cursor = 2; // 64-hex first-parent of the last entry; empty when the chain ended
}

// ----------------------------------------------------------------------------
// Refs.

message GetRefRequest {
  string room = 1;
  string name = 2;
}

message GetRefResponse {
  bool exists = 1;
  bytes object_id = 2;    // empty when exists=false
}

message UpdateRefRequest {
  string room = 1;
  string name = 2;
  bytes new_id = 3;             // 32-byte target value
  RefExpectation expectation = 4;  // REQUIRED; UNSPECIFIED is a protocol error
  bytes expected_id = 5;        // 32 bytes for MATCH; MUST be empty for ANY/MISSING
}

message UpdateRefResponse {
  bool committed = 1;
  bool conflict = 2;            // true on CAS precondition failure
  bytes current_id = 3;         // the server's current value (for retry); empty if ref absent
}

message ListRefsRequest {
  string room = 1;
  string prefix = 2;            // empty = all refs
}

message ListRefsResponse {
  repeated RefEntry refs = 1;
}

// ----------------------------------------------------------------------------
// Multiplayer event stream.

message WatchRefsRequest {
  string room = 1;
}

message RefEvent {
  string name = 1;
  bytes object_id = 2;
  bytes author_pubkey = 3;      // 32-byte Ed25519 pubkey of the writer
}

// ----------------------------------------------------------------------------
// Chat — signed messages that share the room (and the live event stream) with
// commits, so the front-page lobby renders one merged feed of a player's
// signed activity (chatter + pushes). The message body the author signs is
// just `{ room, text }`; the server stamps `created_at` + `seq` (ordering is
// server-authoritative, not client-clock).

message PostMessageRequest {
  string room = 1;
  string text = 2;             // UTF-8; server caps the character count
}

message PostMessageResponse {
  bytes message_id = 1;        // 32-byte BLAKE3 of the canonical message bytes
  bool accepted = 2;           // stored + broadcast
  bool rate_limited = 3;       // refused: the author posted too recently
}

message ListMessagesRequest {
  string room = 1;
  uint32 limit = 2;            // 0 = server default; clamped to a server max
}

// One stored chat message. `message_id` is the content address (BLAKE3 of the
// canonical bytes); `created_at` is server epoch-ms; `seq` is the monotonic
// per-room order used to merge against commits in the feed.
message ChatMessage {
  bytes message_id = 1;
  bytes author_pubkey = 2;     // 32-byte Ed25519 pubkey of the signer
  string text = 3;
  int64 created_at = 4;        // server-stamped epoch milliseconds
  uint64 seq = 5;              // monotonic per-room sequence
}

message ListMessagesResponse {
  repeated ChatMessage messages = 1;  // oldest-first
}

// ----------------------------------------------------------------------------
// Reactions — signed emoji on a feed item (chat message OR commit), keyed by
// the item's hex id. One row per (target, emoji, author); React toggles it.

message ReactRequest {
  string room = 1;
  string target_id = 2;  // hex id of the feed item (message_id or commit hash)
  string emoji = 3;      // the reaction emoji (e.g. "👍")
}

message ReactResponse {
  bool active = 1;       // true if the reaction is now ON for this author
  uint32 count = 2;      // total reactors for (target, emoji) after the toggle
}

message ListReactionsRequest {
  string room = 1;
}

message Reaction {
  string target_id = 1;
  string emoji = 2;
  bytes author_pubkey = 3;  // 32-byte Ed25519 pubkey of the reactor
}

message ListReactionsResponse {
  repeated Reaction reactions = 1;
}
