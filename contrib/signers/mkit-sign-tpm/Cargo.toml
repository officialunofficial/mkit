[package]
name = "mkit-sign-tpm"
# Crate lives outside `rust/`, so Cargo cannot auto-discover the
# workspace root. Point at it explicitly so the `*.workspace = true`
# inheritance below resolves against `rust/Cargo.toml`. Same trick
# mkit-sign-file uses.
workspace = "../../../rust"
description = "External-signer binary: signs a DSSE PAE with a P-256 key held inside a TPM 2.0 device. Linux-native analog of mkit-sign-se."
keywords = ["mkit", "attestation", "signer", "tpm", "tpm2"]
categories = ["command-line-utilities", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Reference Rust signer for TPM 2.0 hardware. Not shipped to crates.io:
# consumers build from source so the TCTI linkage resolves against
# their host's `tss2-esys` stack.
publish = false
# Build script detects `pkg-config --exists tss2-esys` at compile time
# and sets the `tpm_available` cfg so integration tests can gate
# themselves without breaking compilation on TPM-less hosts (macOS,
# stripped CI images).
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "mkit-sign-tpm"
path = "src/main.rs"

[features]
# `tpm2` gates the real `tss-esapi` dependency. Default is OFF so
# `cargo build --workspace` / `cargo test --workspace` from `rust/`
# still works on macOS and on CI runners without libtss2-dev
# installed. Unit tests (ASN.1 ↔ compact conversion, SEC1 encoding,
# protocol JSON round-trip) do NOT need this feature.
default = []
tpm2 = ["dep:tss-esapi"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Pinned to 7.7 (the most recent stable minor on crates.io at the time
# of writing). The 8.0 series is still in alpha. `tss-esapi` wraps the
# upstream tpm2-tss C library; see README for the native package list
# (`libtss2-dev` on Debian/Ubuntu, `tpm2-tss-devel` on Fedora).
#
# Optional so a macOS developer with no TPM stack installed can still
# build / test the non-TPM paths with `cargo test -p mkit-sign-tpm`.
tss-esapi = { version = "7.7", optional = true }

[dev-dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
