[package]
name = "mkit-sign-ctap"
# Crate lives outside `rust/`; point at the workspace root explicitly.
workspace = "../../../rust"
description = "Reference external-signer binary: FIDO2/WebAuthn roaming authenticator (YubiKey / Nitrokey / SoloKey) over CTAP-HID. Speaks mkit protocol v1.1 with WebAuthn wrapping."
keywords = ["mkit", "attestation", "signer", "webauthn", "fido2"]
categories = ["command-line-utilities", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Reference implementation — not published to crates.io. Requires a
# physical FIDO2 authenticator plugged in to produce real signatures.
publish = false

[lints]
workspace = true

[[bin]]
name = "mkit-sign-ctap"
path = "src/main.rs"

[features]
# `ctap-hw` (default) pulls in the `ctap-hid-fido2` driver and lets
# the binary talk to a real authenticator. Disable when building in
# environments without `hidapi` / `libudev` (e.g. some CI containers,
# `wasm32-unknown-unknown`); the resulting binary still compiles and
# unit-tests run with the in-process mock device, but `enroll` /
# `sign` / `list-credentials` against real hardware are unavailable.
default = ["ctap-hw"]
ctap-hw = ["dep:ctap-hid-fido2"]

[dependencies]
mkit-attest = { path = "../../../rust/crates/mkit-attest" }
# mkit-rpc owns the wire schemas (signer.proto, common.proto) and the
# length-prefixed framing helpers used by the subprocess protocol.
mkit-rpc = { path = "../../../rust/crates/mkit-rpc" }
buffa = "0.6"
# CTAP-HID driver, optional behind the `ctap-hw` feature.
ctap-hid-fido2 = { version = "3.5", optional = true }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Key store for the enrolled credential_id + pubkey mapping. Plain JSON
# under $HOME/.mkit-sign-ctap/credentials.json; no keyring dep — the
# authenticator holds the private key, the store is just metadata.
dirs = "5"

[dev-dependencies]
mkit-attest = { path = "../../../rust/crates/mkit-attest" }
mkit-rpc = { path = "../../../rust/crates/mkit-rpc" }
buffa = "0.6"
# For the crypto cross-check in tests/protocol_shape.rs — generate a
# P-256 signature in-process so we don't need hardware just to lock
# down the wire shape.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
sha2 = { version = "0.10", default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
