name = "mkit-og"
# Official Unofficial, Inc. — the account that owns the mkit.sh zone (same one
# mkit-mcp deploys to), so the og.mkit.sh custom domain provisions.
account_id = "0bc82bff4439c556f9dc1b054d2de6d7"
main = "src/index.ts"
compatibility_date = "2026-02-25"

[observability]
enabled = true

# Custom domain on the mkit.sh zone (mirrors mcp.mkit.sh in mcp/wrangler.jsonc).
# Wrangler auto-creates the proxied DNS record + cert on deploy.
[[routes]]
pattern = "og.mkit.sh"
custom_domain = true
