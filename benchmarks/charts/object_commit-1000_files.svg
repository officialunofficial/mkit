<svg xmlns="http://www.w3.org/2000/svg" width="800" height="178" viewBox="0 0 800 178">
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 16px; font-weight: 600; fill: #24292f; }
.label { font-size: 12px; fill: #24292f; }
.value { font-size: 11px; fill: #57606a; }
.axis-label { font-size: 11px; fill: #57606a; }
.grid { stroke: #d0d7de; stroke-width: 0.5; }
</style>
  <rect width="100%" height="100%" fill="white"/>
  <text x="400.0" y="30" text-anchor="middle" class="title">Object Commit Wallclock — 1000 files (ops/s — higher is better)</text>
  <line x1="200.0" y1="52.0" x2="200.0" y2="138.0" class="grid"/>
  <text x="200.0" y="152.0" text-anchor="middle" class="axis-label">0</text>
  <line x1="274.3" y1="52.0" x2="274.3" y2="138.0" class="grid"/>
  <text x="274.3" y="152.0" text-anchor="middle" class="axis-label">100</text>
  <line x1="348.6" y1="52.0" x2="348.6" y2="138.0" class="grid"/>
  <text x="348.6" y="152.0" text-anchor="middle" class="axis-label">200</text>
  <line x1="422.9" y1="52.0" x2="422.9" y2="138.0" class="grid"/>
  <text x="422.9" y="152.0" text-anchor="middle" class="axis-label">300</text>
  <line x1="497.1" y1="52.0" x2="497.1" y2="138.0" class="grid"/>
  <text x="497.1" y="152.0" text-anchor="middle" class="axis-label">400</text>
  <line x1="571.4" y1="52.0" x2="571.4" y2="138.0" class="grid"/>
  <text x="571.4" y="152.0" text-anchor="middle" class="axis-label">500</text>
  <line x1="645.7" y1="52.0" x2="645.7" y2="138.0" class="grid"/>
  <text x="645.7" y="152.0" text-anchor="middle" class="axis-label">600</text>
  <line x1="720.0" y1="52.0" x2="720.0" y2="138.0" class="grid"/>
  <text x="720.0" y="152.0" text-anchor="middle" class="axis-label">700</text>
  <text x="460.0" y="168.0" text-anchor="middle" class="axis-label">ops/s</text>
  <text x="190.0" y="77.2" text-anchor="end" class="label">mkit</text>
  <rect x="200.0" y="60.0" width="485.8" height="18.2" rx="2" fill="#4C78A8"/>
  <text x="693.8" y="77.2" class="value">654 ops/s (1.53 ms)</text>
  <text x="190.0" y="103.2" text-anchor="end" class="label">git2 (libgit2)</text>
  <rect x="200.0" y="86.0" width="31.3" height="18.2" rx="2" fill="#E45756"/>
  <text x="239.3" y="103.2" class="value">42 ops/s (23.76 ms)</text>
  <text x="190.0" y="129.2" text-anchor="end" class="label">git CLI</text>
  <rect x="200.0" y="112.0" width="0.1" height="18.2" rx="2" fill="#B279A2"/>
  <text x="208.1" y="129.2" class="value">0.09 ops/s (11153 ms)</text>
</svg>
