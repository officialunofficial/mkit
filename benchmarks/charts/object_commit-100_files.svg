<svg xmlns="http://www.w3.org/2000/svg" width="800" height="178" viewBox="0 0 800 178">
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 16px; font-weight: 600; fill: #24292f; }
.label { font-size: 12px; fill: #24292f; }
.value { font-size: 11px; fill: #57606a; }
.axis-label { font-size: 11px; fill: #57606a; }
.grid { stroke: #d0d7de; stroke-width: 0.5; }
</style>
  <rect width="100%" height="100%" fill="white"/>
  <text x="400.0" y="30" text-anchor="middle" class="title">Object Commit Wallclock — 100 files (ops/s — higher is better)</text>
  <line x1="200.0" y1="52.0" x2="200.0" y2="138.0" class="grid"/>
  <text x="200.0" y="152.0" text-anchor="middle" class="axis-label">0</text>
  <line x1="330.0" y1="52.0" x2="330.0" y2="138.0" class="grid"/>
  <text x="330.0" y="152.0" text-anchor="middle" class="axis-label">5</text>
  <line x1="460.0" y1="52.0" x2="460.0" y2="138.0" class="grid"/>
  <text x="460.0" y="152.0" text-anchor="middle" class="axis-label">10</text>
  <line x1="590.0" y1="52.0" x2="590.0" y2="138.0" class="grid"/>
  <text x="590.0" y="152.0" text-anchor="middle" class="axis-label">15</text>
  <line x1="720.0" y1="52.0" x2="720.0" y2="138.0" class="grid"/>
  <text x="720.0" y="152.0" text-anchor="middle" class="axis-label">20</text>
  <text x="460.0" y="168.0" text-anchor="middle" class="axis-label">ops/s</text>
  <text x="190.0" y="77.2" text-anchor="end" class="label">mkit</text>
  <rect x="200.0" y="60.0" width="24.9" height="18.2" rx="2" fill="#4C78A8"/>
  <text x="232.9" y="77.2" class="value">1 (1045 ms)</text>
  <text x="190.0" y="103.2" text-anchor="end" class="label">git2 (libgit2)</text>
  <rect x="200.0" y="86.0" width="464.9" height="18.2" rx="2" fill="#E45756"/>
  <text x="672.9" y="103.2" class="value">18 (55.92 ms)</text>
  <text x="190.0" y="129.2" text-anchor="end" class="label">git CLI</text>
  <rect x="200.0" y="112.0" width="24.2" height="18.2" rx="2" fill="#B279A2"/>
  <text x="232.2" y="129.2" class="value">1 (1075 ms)</text>
</svg>
