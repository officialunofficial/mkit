<svg xmlns="http://www.w3.org/2000/svg" width="800" height="204" viewBox="0 0 800 204">
  <style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 16px; font-weight: 600; fill: #24292f; }
.label { font-size: 12px; fill: #24292f; }
.value { font-size: 11px; fill: #57606a; }
.axis-label { font-size: 11px; fill: #57606a; }
.grid { stroke: #d0d7de; stroke-width: 0.5; }
</style>
  <rect width="100%" height="100%" fill="white"/>
  <text x="400.0" y="30" text-anchor="middle" class="title">Hash Throughput — 1 MiB</text>
  <line x1="200.0" y1="52.0" x2="200.0" y2="164.0" class="grid"/>
  <text x="200.0" y="178.0" text-anchor="middle" class="axis-label">0</text>
  <line x1="304.0" y1="52.0" x2="304.0" y2="164.0" class="grid"/>
  <text x="304.0" y="178.0" text-anchor="middle" class="axis-label">500</text>
  <line x1="408.0" y1="52.0" x2="408.0" y2="164.0" class="grid"/>
  <text x="408.0" y="178.0" text-anchor="middle" class="axis-label">1,000</text>
  <line x1="512.0" y1="52.0" x2="512.0" y2="164.0" class="grid"/>
  <text x="512.0" y="178.0" text-anchor="middle" class="axis-label">1,500</text>
  <line x1="616.0" y1="52.0" x2="616.0" y2="164.0" class="grid"/>
  <text x="616.0" y="178.0" text-anchor="middle" class="axis-label">2,000</text>
  <line x1="720.0" y1="52.0" x2="720.0" y2="164.0" class="grid"/>
  <text x="720.0" y="178.0" text-anchor="middle" class="axis-label">2,500</text>
  <text x="460.0" y="194.0" text-anchor="middle" class="axis-label">MiB/s</text>
  <text x="190.0" y="77.2" text-anchor="end" class="label">BLAKE3 (mkit)</text>
  <rect x="200.0" y="60.0" width="461.8" height="18.2" rx="2" fill="#4C78A8"/>
  <text x="669.8" y="77.2" class="value">2,220</text>
  <text x="190.0" y="103.2" text-anchor="end" class="label">BLAKE2b</text>
  <rect x="200.0" y="86.0" width="306.7" height="18.2" rx="2" fill="#54A24B"/>
  <text x="514.7" y="103.2" class="value">1,474</text>
  <text x="190.0" y="129.2" text-anchor="end" class="label">SHA-1 (git)</text>
  <rect x="200.0" y="112.0" width="274.8" height="18.2" rx="2" fill="#F58518"/>
  <text x="482.8" y="129.2" class="value">1,321</text>
  <text x="190.0" y="155.2" text-anchor="end" class="label">SHA-256 (git-sha256)</text>
  <rect x="200.0" y="138.0" width="115.7" height="18.2" rx="2" fill="#EEAE62"/>
  <text x="323.7" y="155.2" class="value">556</text>
