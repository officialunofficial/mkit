# pnpm settings (pnpm 10+ reads these from pnpm-workspace.yaml, not
# package.json). Approves the postinstall scripts of the listed packages —
# esbuild/workerd install their platform binaries, sharp builds its native
# bindings; without approval pnpm skips them and the waku/wrangler build
# fails with ERR_PNPM_IGNORED_BUILDS.
#
# Both spellings are intentional: pnpm >= 11 reads `allowBuilds`, pnpm 10
# (pinned in web.yml CI) reads `onlyBuiltDependencies`. Each version
# ignores the other's key.
# sharp is explicitly denied: its postinstall tries a from-source native
# build that fails offline, and the site never invokes it (no image
# optimization at build time) — the skip has been harmless in CI all along.
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - workerd
