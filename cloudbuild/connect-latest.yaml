# Optional Cloud Build reproduction of the scheduled/PR compatibility probe.
# The GitHub workflow owns automatic runs to avoid duplicate PR builds.
substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.99.1
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
timeout: 1800s
steps:
  - name: ${_CI_IMAGE}
    id: connect-latest
    entrypoint: bash
    env:
      - 'CARGO_TERM_COLOR=always'
      - 'CARGO_INCREMENTAL=0'
      - 'CARGO_PROFILE_DEV_DEBUG=0'
      - 'RUSTC_WRAPPER=sccache'
      - 'SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}'
      - 'SCCACHE_GCS_RW_MODE=READ_WRITE'
      - 'SCCACHE_GCS_KEY_PREFIX=connect-latest'
    args:
      - -c
      - |
        set -euo pipefail
        rustup target add wasm32-unknown-unknown
        bash scripts/check-connect-latest.sh
