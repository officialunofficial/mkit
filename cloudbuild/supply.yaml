# Supply-chain release gates on Cloud Build. This config ports:
#   - .github/workflows/third-party-notices.yml  (cargo about generate)
#   - .github/workflows/release-artifact-check.yml (release build + feature guard)
#
# Both steps run in parallel. They need the full repo checkout.
#
# third-party-notices: catches a new dependency with a license outside the
# rust/about.toml accepted list at PR time, not at tag time. cargo-about and
# cargo-deny parse SPDX expressions differently, so this check is distinct from
# the cargo-deny gate in security.yaml. It does not compile the workspace.
# GitHub gated it on dependency-graph paths; the trigger globs do that here.
#
# release-artifact-check: PR-time preview of the release mkit build and its
# artifact feature guard. The release profile (codegen-units=1) makes it slow,
# so the trigger runs it only when an input that can move the result changes.
#
# Triggers: mkit-supply-{pr,main}.

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.99.1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
timeout: 3600s

steps:
  - name: ${_CI_IMAGE}
    id: third-party-notices
    waitFor: ['-']
    timeout: 1200s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        # cargo-about is not in the baked image. Install the pinned prebuilt
        # binary, with a source build as the fallback.
        if ! cargo about --version 2>/dev/null | grep -q 0.9.1; then
          cargo binstall --no-confirm --force --version 0.9.1 --disable-strategies compile cargo-about \
            || cargo install --locked --version 0.9.1 cargo-about
        fi
        cd rust
        # Same invocation as the release job (release.yml), minus the artifact
        # upload. It must fail loudly on an unapproved license only.
        cargo about generate --all-features about.hbs -o /dev/null

  - name: ${_CI_IMAGE}
    id: release-artifact-check
    waitFor: ['-']
    timeout: 3000s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "TARGET=x86_64-unknown-linux-gnu"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        # Select only mkit-cli with -p to avoid workspace feature unification (D31).
        ( cd rust
          RUSTFLAGS="-C codegen-units=1 -C strip=symbols" cargo build \
            --release --locked --target "$$TARGET" -p mkit-cli --bin mkit \
            --message-format=json-render-diagnostics > /tmp/mkit-build.jsonl )
        bash scripts/check-release-artifact-features.sh \
          /tmp/mkit-build.jsonl "rust/target/$${TARGET}/release/mkit"
        # The golden package list must still match release.yml's targets
        # (`--update-golden` output is deterministic). This catches a Cargo.lock
        # or manifest change that adds a CLI dependency on another target only.
        # GitHub used `git diff`. The source upload has no .git, so compare files.
        cp scripts/release/mkit-packages.golden /tmp/golden.before
        bash scripts/check-release-artifact-features.sh --update-golden
        if ! cmp -s /tmp/golden.before scripts/release/mkit-packages.golden; then
          diff -u /tmp/golden.before scripts/release/mkit-packages.golden || true
          echo "ERROR: scripts/release/mkit-packages.golden is stale; run" >&2
          echo "  scripts/check-release-artifact-features.sh --update-golden" >&2
          echo "review the diff (every new name is a new dependency of the shipped mkit CLI) and commit it." >&2
          exit 1
        fi
        sccache --show-stats
