# Coverage on Cloud Build — replaces .github/workflows/coverage.yml.
# Runs the workspace under cargo-llvm-cov (nextest), emits an lcov report, and
# uploads it to Codecov (non-fatal, like the GitHub job). cargo-llvm-cov +
# llvm-tools-preview are baked into _CI_IMAGE (cloudbuild/Dockerfile.ci).
#
# Doctests are deliberately excluded (llvm-cov doctest coverage needs nightly),
# matching coverage.yml.
#
# Trigger: mkit-coverage-main — push to main only (coverage is informational, so
# it doesn't gate PRs).
#
# Codecov upload is DORMANT: it's gated on a CODECOV_TOKEN env var that nothing
# currently injects, so the upload step cleanly no-ops and the build still
# produces + logs the lcov report. This is deliberate — Cloud Build fetches any
# secret declared in `availableSecrets` BEFORE the first step runs, so declaring
# a secret that doesn't exist (CODECOV_TOKEN was never provisioned in this
# project's Secret Manager when coverage moved off GitHub Actions in #502) hard-
# fails the whole build before the "skip if absent" guard can run. Leaving the
# secret undeclared keeps coverage green while Codecov stays unconfigured.
#
# To RE-ENABLE Codecov:
#   1. Provision the secret:  printf '<token>' | gcloud secrets create CODECOV_TOKEN \
#        --project=official-unofficial --data-file=-      (token from codecov.io)
#   2. Grant the Cloud Build SA read access:
#        gcloud secrets add-iam-policy-binding CODECOV_TOKEN \
#          --project=official-unofficial \
#          --member=serviceAccount:545902902213@cloudbuild.gserviceaccount.com \
#          --role=roles/secretmanager.secretAccessor
#   3. Restore the two blocks marked "CODECOV: re-enable" below (availableSecrets
#      + the step's secretEnv). The upload logic already handles it via printenv.

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.95.0

# CODECOV: re-enable — restore this block (see the header) to wire up the upload.
# availableSecrets:
#   secretManager:
#     - versionName: projects/${PROJECT_ID}/secrets/CODECOV_TOKEN/versions/latest
#       env: CODECOV_TOKEN

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
timeout: 2400s

steps:
  - name: ${_CI_IMAGE}
    id: coverage
    entrypoint: bash
    # CODECOV: re-enable — restore this to inject the secret (see the header).
    # secretEnv: ["CODECOV_TOKEN"]
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail

        # Prebuild the mkit-sign-file fixture the attest tests drive (see ci.yaml).
        ( cd contrib/signers && cargo build --locked -p mkit-sign-file )

        ( cd rust
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report nextest --locked --workspace --all-features
          cargo llvm-cov report --lcov --output-path /workspace/coverage.lcov
          cargo llvm-cov report --summary-only | tee /workspace/coverage-summary.txt
        )
        sccache --show-stats

        # Upload to Codecov (non-fatal). Currently a no-op: nothing injects a
        # CODECOV_TOKEN env var (the secretEnv is commented out above until the
        # secret is provisioned — see the header), so this skips and the build
        # stays green while still producing the report.
        #
        # When re-enabled, CODECOV_TOKEN arrives as a secretEnv. It MUST be read
        # via `printenv` (bare name, no dollar), NOT a `$`-prefixed reference:
        # under `dynamicSubstitutions: true` Cloud Build runs bash-style parameter
        # expansion over this whole script string AT CONFIG TIME (it has no notion
        # of `#` comments), and a brace-wrapped `$`-reference to CODECOV_TOKEN —
        # even dollar-dollar-brace-escaped, even with a ":-" default — is taken as
        # a substitution reference to an undeclared key and rejects the build
        # pre-start ("key in the template CODECOV_TOKEN is not a valid built-in
        # substitution"). Copy into a lowercase bash var — lowercase keys never
        # match the substitution pattern, so `${codecov_token}` is safe (same
        # convention as ci.yaml). COMMIT_SHA / BRANCH_NAME below ARE valid
        # Cloud Build built-ins, so `${...}` is correct for them.
        codecov_token=$(printenv CODECOV_TOKEN 2>/dev/null || true)
        if [ -z "${codecov_token:-}" ]; then
          echo "CODECOV_TOKEN not set — skipping upload (report at /workspace/coverage.lcov)."
          exit 0
        fi
        curl -fLso codecov https://cli.codecov.io/latest/linux/codecov \
          && chmod +x codecov \
          && ./codecov upload-process \
               --fail-on-error \
               --file /workspace/coverage.lcov \
               --token "$codecov_token" \
               --sha "${COMMIT_SHA}" \
               --branch "${BRANCH_NAME}" \
          || echo "Codecov upload failed (non-fatal)."
