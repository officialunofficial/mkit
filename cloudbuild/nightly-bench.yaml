# Weekly benchmark freshness check on Cloud Build. Ports
# .github/workflows/bench-freshness.yml. It never gates a PR. A red build
# means a person should look and maybe regenerate the charts.
#
# Two checks. Both run even if one fails.
#   1. Chart freshness: do benchmarks/charts/*.svg match a fresh render?
#   2. Methodology freshness: does perf-data.ts methodology.commit match HEAD?
#
# GitHub Actions printed ::warning:: annotations. Here the step prints plain
# lines to the build log.
#
# The check needs a git checkout for the HEAD SHA. A trigger build has one.
# A manual submit uploads no .git, so the step clones _REPO_URL at _REF.
#
# Trigger: mkit-nightly-bench (manual-event trigger).
# Cloud Scheduler: '0 7 * * 0' UTC (Sunday).

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.99.1
  _REPO_URL: https://github.com/officialunofficial/mkit.git
  _REF: main

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
timeout: 3600s

steps:
  - name: ${_CI_IMAGE}
    id: bench-freshness
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=bench-freshness"
      - "REPO_URL=${_REPO_URL}"
      - "REF=${_REF}"
    args:
      - -c
      - |
        set -uo pipefail
        if [ ! -d .git ]; then
          git clone "$$REPO_URL" /workspace/src
          git -C /workspace/src checkout -q "$$REF"
          cd /workspace/src
        fi
        out=/tmp/bench
        mkdir -p "$$out"

        # Check 1: chart freshness.
        # --workspace -- --quick fails, so name the bench targets.
        ( cd rust &&
          cargo bench -p mkit-benches --bench hashing --bench sign_verify \
            --bench object_commit --bench pack_create -- --quick &&
          cargo run -p mkit-benches --bin render-charts ) || {
          echo "bench or render-charts failed"; exit 1; }
        if git diff --exit-code -- benchmarks/charts/ > /tmp/chart-diff.txt 2>&1; then
          chart_drift=false
        else
          echo "WARNING: benchmarks/charts/*.svg drifted from a fresh render-charts run"
          cat /tmp/chart-diff.txt
          chart_drift=true
        fi
        # Isolate check 2 from the regenerated SVGs.
        git checkout -- benchmarks/charts/

        # Check 2: methodology freshness.
        ( cd rust && cargo build --release --locked -p mkit-cli ) || {
          echo "mkit-cli build failed"; exit 1; }
        MKIT_BENCH_PROVENANCE_ONLY=1 scripts/bench-vs-git.sh rust/target/release/mkit "$$out/bench-provenance"
        fresh_commit=$$(sed -n 's/^mkit commit: \([0-9a-f]\{40\}\).*/\1/p' "$$out/bench-provenance/provenance.txt")
        if [ -z "$$fresh_commit" ]; then
          echo "ERROR: could not parse a commit SHA out of provenance.txt"
          exit 1
        fi
        baked_commit=$$(sed -n "s/^[[:space:]]*commit: '\([0-9a-f]\{40\}\)'.*/\1/p" apps/web/src/lib/perf-data.ts)
        echo "perf-data.ts methodology.commit: $$baked_commit"
        echo "HEAD (freshly measured):         $$fresh_commit"
        if [ -z "$$baked_commit" ]; then
          echo "ERROR: could not parse methodology.commit out of apps/web/src/lib/perf-data.ts"
          methodology_drift=true
        elif [ "$$baked_commit" != "$$fresh_commit" ]; then
          echo "WARNING: methodology.commit ($$baked_commit) is behind HEAD ($$fresh_commit)"
          methodology_drift=true
        else
          methodology_drift=false
        fi

        echo "chart drift:       $$chart_drift"
        echo "methodology drift: $$methodology_drift"
        sccache --show-stats || true
        if [ "$$chart_drift" = true ] || [ "$$methodology_drift" = true ]; then
          echo "ERROR: benchmark freshness drift detected. Non-gating: no PR depends on this."
          exit 1
        fi
