# Docs build gate on Cloud Build — replaces .github/workflows/docs.yml.
# Builds rustdoc for both workspaces with -D warnings so a broken intra-doc link
# or bad docstring fails CI. Compiles deps, so sccache + a roomy disk help.
#
# Trigger: mkit-docs-{pr,main} — runs unless the change is apps/web/docs-only.

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.95.0

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
timeout: 1800s

steps:
  - name: ${_CI_IMAGE}
    id: docs
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUSTDOCFLAGS=-D warnings"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        ( cd rust && cargo doc --locked --all-features --workspace --no-deps )
        ( cd contrib/signers && cargo doc --locked --all-features --no-deps )
        sccache --show-stats
