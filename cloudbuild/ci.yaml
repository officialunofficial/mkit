# Rust workspace CI on Cloud Build — replaces the Linux leg of the
# `build-and-test` + `msrv` jobs in .github/workflows/rust.yml. Failure-ordered,
# sequential main and ignored-test steps, both required for the build to pass.
#
# NOTE: mkit's Rust workspace lives in `rust/`, and the reference signers are a
# SEPARATE workspace in `contrib/signers/`. Steps cd into the right tree; this
# is the main difference from a root-workspace layout.
#
# Toolchain (Rust 1.99.1 + protoc + nextest + sccache + native deps) comes from
# the baked _CI_IMAGE (cloudbuild/Dockerfile.ci), so this config is just cargo.
#
# Triggers (see cloudbuild/README.md):
#   - mkit-ci-main  push to main (paths-ignore apps/web/docs/md)
#   - mkit-ci-pr    PRs, gated on a maintainer `/gcbrun` comment (the analog of
#                   rust.yml's approval-gated heavy jobs). Cloud Build checks out
#                   the PR head, so no SHA juggling is needed here.
#
# CACHING: sccache with a GCS backend. On Cloud Build the build runs *as* a
# service account, so sccache reaches the bucket through the metadata server
# with no key file and no WIF. The build SA needs roles/storage.objectAdmin on
# $_CACHE_BUCKET.
#
# Cross-platform note: the macOS leg of build-and-test and the
# keystore-backends matrix (macOS native keystores) CANNOT run on Cloud
# Build (Linux containers only) and stay on GitHub Actions. Windows is not
# a supported target (MKIT-6; see docs/INVARIANTS.md).

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.99.1

options:
  # The trigger runs this config as a dedicated service account, not the
  # default Cloud Build account. Cloud Build rejects a custom account with no
  # log option.
  logging: CLOUD_LOGGING_ONLY
  # 8 vCPUs keeps clippy+nextest brisk; 100 GB removes the disk pressure that
  # made rust.yml free the Android/.NET/Haskell trees on GitHub's ~14 GB runners.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  # _CACHE_BUCKET / _CI_IMAGE embed the built-in ${PROJECT_ID}; resolving a
  # built-in nested in a substitution value needs dynamic substitutions (auto-on
  # under triggers, off for a manual `gcloud builds submit` repro).
  dynamicSubstitutions: true

# The workspace grew from 3,218 to 6,780 tests: nextest rose from 88s to
# 499s, and test compilation from 63s to 209s. The old 40-minute build cap
# expired during the serial ignored lane, before later main-lane gates ran.
# Allow 60 minutes for the main step and 50 for the ignored lane, plus
# ten minutes for source/image setup. Both steps must pass; no tests move out
# of this required build.
timeout: 7200s

steps:
  # Run the required package gate before workspace compilation so an
  # unrelated workspace failure cannot cancel primitives verification.
  - name: ${_CI_IMAGE}
    id: primitives
    waitFor: ['-']
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "CARGO_BUILD_JOBS=3"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "MKIT_PRIMITIVES_CI=1"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        # Keep the package gate's Cargo artifacts separate from the workspace
        # step while sharing the existing sccache backend.
        mkdir /tmp/mkit-primitives-ci
        tar --exclude=.git --exclude=target -C /workspace -cf - . | tar -C /tmp/mkit-primitives-ci -xf -
        cd /tmp/mkit-primitives-ci
        python3 scripts/fmt-primitives.py --check
        python3 scripts/test-primitives-infrastructure.py
        python3 scripts/test-primitives-stability.py --compiler-tests
        python3 scripts/check-primitives-fixtures.py
        python3 scripts/check-primitives-graph.py
        python3 scripts/check-primitives-native-workspace.py
        python3 scripts/test-publish-primitives.py
        python3 scripts/publish-primitives.py check
        ( cd rust
          cargo clippy --locked -p mkit-primitives -p mkit-primitives-fuzz --all-targets --all-features -- -D warnings
          cargo check --locked -p mkit-primitives-fuzz --features libfuzzer --bins
          cargo nextest run --locked -p mkit-primitives -j 3
          cargo nextest run --locked -p mkit-primitives-fuzz -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --no-default-features --features pack-zstd -j 3
          cargo check --locked -p mkit-primitives --no-default-features --all-targets
          cargo check --locked -p mkit-primitives --all-features --all-targets
          cargo nextest run --locked -p mkit-primitives --no-default-features --test framing_backends --test framing_vectors -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --all-features --test framing_backends --test framing_vectors -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --no-default-features --lib -E 'test(resume_tests::) | test(pack_verify::verify::tests::compute::)' -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --all-features --lib -E 'test(resume_tests::) | test(pack_verify::verify::tests::compute::)' -j 3 --no-tests=fail
          cargo test --locked -p mkit-primitives --doc
          cargo test --locked -p mkit-primitives --no-default-features --doc
          RUSTDOCFLAGS=-Dwarnings cargo doc --locked -p mkit-primitives --all-features --no-deps
          cargo check --locked -p mkit-primitives --target wasm32-unknown-unknown
          cargo check --locked -p mkit-primitives --no-default-features --target wasm32-unknown-unknown
          # The existing image has cargo-binstall; one pinned prebuilt tool
          # keeps the feature sweep bounded without rebuilding the CI image.
          if ! cargo hack --version >/dev/null 2>&1; then
            cargo binstall --no-confirm --force --version 0.6.45 --disable-strategies compile cargo-hack
          fi
          cargo hack check --locked -p mkit-primitives --lib --feature-powerset
        )
        # Execute the selected portable fixtures on a real wasm32 runtime.
        # Neither runtime tool is guaranteed by the current baked image.
        if ! command -v node >/dev/null 2>&1; then
          # E2 uses x86_64; Node names that archive architecture x64.
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
          node_setup=$(mktemp -d)
          mkdir /tmp/mkit-primitives-node
          curl --fail --location --connect-timeout 20 --max-time 120 --retry 2 \
            https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz \
            -o "$node_setup/node-v22.14.0-linux-x64.tar.gz"
          curl --fail --location --connect-timeout 20 --max-time 120 --retry 2 \
            https://nodejs.org/dist/v22.14.0/SHASUMS256.txt -o "$node_setup/SHASUMS256.txt"
          ( cd "$node_setup"
            grep ' node-v22.14.0-linux-x64.tar.gz$' SHASUMS256.txt | sha256sum --check --strict
            tar -xzf node-v22.14.0-linux-x64.tar.gz --strip-components=1 -C /tmp/mkit-primitives-node
          )
          rm -rf "$node_setup"
          export PATH="/tmp/mkit-primitives-node/bin:$$PATH"
        fi
        if ! command -v wasm-pack >/dev/null 2>&1; then
          timeout 180 cargo binstall --no-confirm --force --version 0.13.1 --disable-strategies compile wasm-pack
        fi
        node --version
        wasm-pack --version
        wasm-pack test --node rust/crates/mkit-core-wasm-check --test primitives_portable --locked
        # Out-of-tree consumer of the packaged crates (no path overrides or
        # patches), native and wasm32, over the shipped portable fixtures.
        python3 scripts/check-primitives-consumer.py
        bash scripts/check-primitives-stability.sh
        sccache --show-stats

  - name: ${_CI_IMAGE}
    id: check
    waitFor: [primitives]
    timeout: 3600s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0" # required: sccache can't cache incremental builds
      - "RUST_BACKTRACE=short"
      # Drop debuginfo in CI (dominant target/ bloat; CI never opens a debugger).
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      # sccache → GCS. RW mode + bucket; ADC comes from the build SA.
      - "RUSTC_WRAPPER=/tmp/mkit-ci-rustc"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        # sccache replaces Cargo's jobserver, including for uncached binaries.
        # Preserve the serial compiler bound for the linked server lib-test.
        cat > /tmp/mkit-ci-rustc <<'SH'
        #!/bin/bash
        set -euo pipefail
        if [[ " $* " == *" --crate-name mkit_server "* &&
              " $* " == *" crates/mkit-server/src/lib.rs "* &&
              " $* " == *" --test "* &&
              " $* " == *" --emit=dep-info,link "* ]]; then
          exec "$@"
        fi
        # Cargo's JSON renderer drops raw stdout, including sccache's signal
        # diagnostics. Copy it to stderr on failure and preserve the exit code.
        output=$(mktemp)
        trap 'rm -f "$output"' EXIT
        status=0
        sccache "$@" >"$output" || status=$?
        cat "$output"
        if [ "$status" -ne 0 ]; then
          cat "$output" >&2
        fi
        exit "$status"
        SH
        chmod +x /tmp/mkit-ci-rustc

        # Every command after the workspace build + swtpm setup is attempted
        # even after a failure (a `cd` into a missing tree aborts only its
        # own subshell, via `|| exit 1`): each records into `status` — a
        # failure is never turned into a success or skipped — and the step
        # exits non-zero at the end, so one failing gate can no longer hide
        # the rest of the results.
        status=0

        # ── rust/ workspace: fmt → clippy → build ───────────────────────────
        ( cd rust
          cargo fetch --locked
          cargo fmt --check
          python3 ../scripts/check-feature-names.py
          cargo clippy --all-targets --all-features --workspace -- -D warnings
          cargo build --locked --workspace
        )

        # ── contrib/signers (separate workspace) ────────────────────────────
        # MUST run before the workspace nextest step: mkit-cli's attest_roundtrip
        # tests drive contrib/signers/target/debug/mkit-sign-file and only fall
        # back to building it on-the-fly when missing.
        #
        # TPM tests use disposable swtpm state, never the host's measured-boot
        # /dev/tpm0. Wait for both simulator ports before initializing it below.
        # Lowercase variables avoid Cloud Build's substitution scanner.
        swtpm_state_dir=$(mktemp -d)
        swtpm socket --tpmstate dir="$swtpm_state_dir" --tpm2 \
          --server type=tcp,port=2321 --ctrl type=tcp,port=2322 \
          --flags not-need-init &
        swtpm_pid=$!
        trap 'kill "$swtpm_pid" 2>/dev/null || true' EXIT
        export TCTI="swtpm:host=localhost,port=2321"
        # Wait for both swtpm ports to accept connections before poking them —
        # the daemon above starts asynchronously.
        for _ in $(seq 1 50); do
          (exec 3<>/dev/tcp/localhost/2321) 2>/dev/null && (exec 3<>/dev/tcp/localhost/2322) 2>/dev/null && break
          sleep 0.2
        done

        # A fresh swtpm instance is powered-on but not started — every TPM2
        # command fails with TPM_RC_INITIALIZE until TPM2_Startup(CLEAR) runs
        # once. No CLI tool for this is baked into the image (tpm2-tools isn't
        # installed, only libtss2-dev), so send the fixed 12-byte command
        # (TPM2 Part 3 §9.3, no session, no auth — deterministic wire bytes)
        # directly to the command port and check for TPM_RC_SUCCESS:
        #   tag=TPM_ST_NO_SESSIONS(0x8001) size=12 code=TPM2_Startup(0x144)
        #   body=TPM_SU_CLEAR(0x0000)
        exec 4<>/dev/tcp/localhost/2321
        printf '\x80\x01\x00\x00\x00\x0c\x00\x00\x01\x44\x00\x00' >&4
        startup_resp=$(head -c 10 <&4 | od -An -tx1 | tr -d ' \n')
        exec 4<&- 4>&-
        echo "TPM2_Startup response bytes: $startup_resp"
        if [ "${startup_resp: -8}" != "00000000" ]; then
          echo "TPM2_Startup did not return TPM_RC_SUCCESS" >&2
          exit 1
        fi

        # #505 PR 2/5: this Linux lane provisions both `git` (baked into
        # _CI_IMAGE) and a real TPM path (swtpm, wired above), so tests that
        # would otherwise silently `return` green when their tool/feature is
        # missing must instead fail loudly here — a config regression that
        # breaks one of those two must not report a green CI run.
        export MKIT_TEST_STRICT=1

        ( cd contrib/signers || exit 1
          failed=0
          cargo fmt --check || failed=1
          cargo clippy --locked --all-targets --all-features -- -D warnings || failed=1
          cargo build --locked --all-features || failed=1
          cargo nextest run --locked --all-features --no-fail-fast || failed=1
          exit "$failed"
        ) || status=1

        # ── apps/repo-worker, apps/keys-worker (separate standalone crates) ──
        # Neither is a member of the rust/ workspace (each pins its own
        # rust-toolchain.toml for the Cloudflare Workers Build image — see
        # their Cargo.toml headers), so `cargo test --workspace` above never
        # touches them. `cargo test` on the host target only compiles each
        # crate's pure, non-wasm-gated modules (chat/envelope/hashing/refs/
        # commit_log/audit for repo-worker; envelope/names/audit for
        # keys-worker) — the Durable Object / `#[event(fetch)]` worker glue
        # (repo-worker's `worker_impl`, all of keys-worker's `lib.rs`-level
        # handlers) is exercised for COMPILATION only, via the wasm32 build,
        # since it needs a live Workers runtime to actually run (see #695's
        # audit.rs module docs). This is what catches "a regression that
        # silently drops accepted/rejected-write logging" — the pure
        # audit::WriteAudit derivation is unit-tested; the wasm32 build
        # confirms the interceptor/handler wiring around it still compiles.
        #
        # `cargo fmt --check` / `cargo clippy -D warnings` are intentionally
        # NOT gated here for repo-worker: its wasm32-only worker_impl module
        # (predating #695) carries pre-existing fmt/clippy debt this issue
        # didn't introduce, and gating on it now would fail CI for unrelated
        # reasons. keys-worker has no such debt, so it gets the full sweep.
        ( cd apps/repo-worker || exit 1
          failed=0
          cargo fetch --locked || failed=1
          cargo test --locked --no-fail-fast || failed=1
          cargo build --locked --target wasm32-unknown-unknown || failed=1
          exit "$failed"
        ) || status=1
        ( cd apps/keys-worker || exit 1
          failed=0
          cargo fetch --locked || failed=1
          cargo fmt --check || failed=1
          cargo clippy --locked --all-targets --all-features -- -D warnings || failed=1
          cargo test --locked --no-fail-fast || failed=1
          cargo build --locked --target wasm32-unknown-unknown || failed=1
          exit "$failed"
        ) || status=1

        # ── rust/ workspace: tests ──────────────────────────────────────────
        # The unified server lib-test needs Cargo's single-job jobserver;
        # sccache substitutes CPU-count parallelism and exhausts memory.
        # The wrapper above bypasses it only for that linked test target.
        # Smaller codegen units and serial Cargo builds remain required.
        # Test selection and execution concurrency are unchanged.
        ( cd rust || exit 1
          failed=0
          cargo nextest run --locked --workspace --all-features --build-jobs 1 --no-fail-fast || failed=1
          # Indexed verification with one Extract step per slice (default chains).
          MKIT_TEST_EXTRACT_CHAIN=1 cargo nextest run --locked -p mkit-server --all-features --no-fail-fast -E 'test(~indexed::)' || failed=1

          # nextest doesn't run doctests; gate them separately.
          cargo test --manifest-path fuzz/Cargo.toml --no-fail-fast || failed=1
          cargo test --locked --doc --workspace --no-fail-fast || failed=1

          # Version contract: `mkit version` must print exactly "mkit <X.Y.Z>".
          cargo build --release --locked -p mkit-cli || failed=1
          out=$(./target/release/mkit version) || failed=1
          expected="mkit $(awk -F\" '/^version/ {print $2; exit}' Cargo.toml)" || failed=1
          echo "stdout:   [$out]"
          echo "expected: [$expected]"
          if [ "$out" != "$expected" ]; then
            echo "mkit version contract violated — stdout is not exactly 'mkit <X.Y.Z>'" >&2
            failed=1
          fi

          # enc-transport opt-in build + encrypted-transport e2e (issue #156).
          cargo build --locked -p mkit-cli --features enc-transport || failed=1
          cargo test --locked -p mkit-transport-enc --features tcp --no-fail-fast || failed=1

          # MSRV gate. The baked image is pinned to the MSRV, so a locked
          # all-targets check is the rust.yml `msrv` job's equivalent — but
          # assert the coupling instead of trusting a comment: fail loudly if
          # the image's rustc ever drifts from the declared rust-version (lower-
          # case/digit vars below don't match Cloud Build's substitution pattern).
          msrv=$(awk -F\" '/^[[:space:]]*rust-version[[:space:]]*=/ {print $2; exit}' Cargo.toml) || failed=1
          rustc_v=$(rustc --version | awk '{print $2}') || failed=1
          echo "declared MSRV=$msrv, image rustc=$rustc_v"
          if [ -n "$msrv" ] && [ "$rustc_v" != "$msrv" ]; then
            echo "MSRV drift: rust-version=$msrv but CI image rustc=$rustc_v — rebuild Dockerfile.ci or fix rust-version" >&2
            failed=1
          fi
          cargo check --workspace --locked --all-targets || failed=1
          exit "$failed"
        ) || status=1

        # ── mkit-server (server exit gate; `just ci-server`) ──
        # The workspace nextest above runs the memory storage suite and
        # wire suite over the memory-backed in-process host. These
        # add what it cannot: the runtime-agnostic core must build for wasm32,
        # the wasm32 graphs must stay free of C-toolchain crates, and the default `mkit` CLI must
        # stay server-free (docs/INVARIANTS.md). The triggers run on main
        # and PRs to main only (cloudbuild/README.md).
        ( cd rust || exit 1
          failed=0
          cargo build --locked -p mkit-client --target wasm32-unknown-unknown || failed=1
          cargo build --locked -p mkit-client --no-default-features --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --features remote-hooks --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --features http-objects --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --no-default-features --features test-support --target wasm32-unknown-unknown || failed=1
          cargo clippy --locked -p mkit-server --target wasm32-unknown-unknown -- -D warnings || failed=1
          exit "$failed"
        ) || status=1
        bash scripts/check-wasm-dep-graph.sh || status=1
        bash scripts/check-cli-baseline.sh || status=1
        bash scripts/check-sync-native-deps.sh || status=1

        sccache --show-stats
        exit "$status"

  # Run the same serial ignored-lane profile after the main gates. The
  # 75,000-ref D34 listing has an 1800s test ceiling; 3000s also covers the
  # 300s pack-residency test, the other real-I/O tests, and build headroom.
  # /workspace retains the main step's target artifacts, with identical
  # compilation flags, so this step does not need a second cold test build.
  - name: ${_CI_IMAGE}
    id: ignored-lane
    waitFor: [check]
    timeout: 3000s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "MKIT_TEST_STRICT=1"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        status=0
        cargo nextest run --locked --workspace --all-features --build-jobs 1 \
          --no-fail-fast --profile ignored-lane --run-ignored ignored-only || status=1
        sccache --show-stats
        exit "$status"

  # Separate cargo invocation keeps the C decoder out of the allocator probe.
  - name: ${_CI_IMAGE}
    id: server-allocator
    waitFor: [check]
    timeout: 600s
    entrypoint: bash
    env:
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        cargo test --locked -p mkit-server --no-default-features --features memory,pack-ruzstd --test zstd_slice_heap_bounds -- --ignored --test-threads=1 --nocapture

  - name: python:3.13.2-slim
    id: server-gates
    waitFor: ['-']
    timeout: 60s
    entrypoint: python3
    args: [scripts/test-server-gates.py, --hosted-only]
