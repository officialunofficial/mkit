# Rust workspace CI on Cloud Build — replaces the Linux leg of the
# `build-and-test` + `msrv` jobs in .github/workflows/rust.yml. The old serial
# `check` step is now independent steps that run in parallel on one VM (see
# "STEP GRAPH" below). Every step must pass for the build to pass.
#
# NOTE: mkit's Rust workspace lives in `rust/`, and the reference signers are a
# SEPARATE workspace in `contrib/signers/`. Steps cd into the right tree; this
# is the main difference from a root-workspace layout.
#
# Toolchain (Rust 1.99.1 + protoc + nextest + sccache + native deps) comes from
# the baked _CI_IMAGE (cloudbuild/Dockerfile.ci), so this config is just cargo.
#
# Triggers (see cloudbuild/README.md):
#   - mkit-ci-main  push to main (paths-ignore apps/web/docs/md)
#   - mkit-ci-pr    PRs, gated on a maintainer `/gcbrun` comment (the analog of
#                   rust.yml's approval-gated heavy jobs). Cloud Build checks out
#                   the PR head, so no SHA juggling is needed here.
#
# STEP GRAPH (all steps share one E2_HIGHCPU_32 VM and the /workspace volume):
#   primitives, lint, signers, apps-workers, indexed, tests-misc, release-cli,
#   wasm-gates, server-allocator, server-gates, nextest-archive   start at once
#   nextest-1..3   wait for nextest-archive and signers
#   ignored-lane   waits for nextest-archive
# nextest-archive builds all workspace test binaries once with
# `cargo nextest archive`. The partitions and the ignored lane run from it.
# Each compiling step has its own CARGO_TARGET_DIR, so no Cargo lock couples
# them. The two exceptions keep the default target directory on /workspace:
# signers (the mkit-cli attest tests need contrib/signers/target) and
# nextest-archive (the archived binaries run from that path).
#
# CACHING: sccache with a GCS backend. On Cloud Build the build runs *as* a
# service account, so sccache reaches the bucket through the metadata server
# with no key file and no WIF. The build SA needs roles/storage.objectAdmin on
# $_CACHE_BUCKET.
#
# Cross-platform note: the macOS leg of build-and-test and the
# keystore-backends matrix (macOS native keystores) CANNOT run on Cloud
# Build (Linux containers only) and stay on GitHub Actions. Windows is not
# a supported target (MKIT-6; see docs/INVARIANTS.md).

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.99.1

options:
  # The trigger runs this config as a dedicated service account, not the
  # default Cloud Build account. Cloud Build rejects a custom account with no
  # log option.
  logging: CLOUD_LOGGING_ONLY
  # 32 vCPUs and 32 GB run the parallel steps at the same time (the same
  # machine as cloudbuild/server.yaml). 300 GB holds the separate target
  # directories and the nextest archive, and removes the disk pressure that made
  # rust.yml free the Android/.NET/Haskell trees on GitHub's ~14 GB runners.
  machineType: E2_HIGHCPU_32
  diskSizeGb: 300
  # _CACHE_BUCKET / _CI_IMAGE embed the built-in ${PROJECT_ID}; resolving a
  # built-in nested in a substitution value needs dynamic substitutions (auto-on
  # under triggers, off for a manual `gcloud builds submit` repro).
  dynamicSubstitutions: true

# The workspace has 7,500 tests. The old serial `check` step took 60-75 minutes
# and the ignored lane another 10. Now the longest chain is nextest-archive
# (about 25 minutes) then the partitions. The 7200s cap stays as headroom for a
# cold sccache cache; each step has its own timeout.
timeout: 7200s

steps:
  # Run the required package gate before workspace compilation so an
  # unrelated workspace failure cannot cancel primitives verification.
  - name: ${_CI_IMAGE}
    id: primitives
    waitFor: ['-']
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "CARGO_BUILD_JOBS=3"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "MKIT_PRIMITIVES_CI=1"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        # Keep the package gate's Cargo artifacts separate from the workspace
        # step while sharing the existing sccache backend.
        mkdir /tmp/mkit-primitives-ci
        tar --exclude=.git --exclude=target -C /workspace -cf - . | tar -C /tmp/mkit-primitives-ci -xf -
        cd /tmp/mkit-primitives-ci
        python3 scripts/fmt-primitives.py --check
        python3 scripts/test-primitives-infrastructure.py
        python3 scripts/test-primitives-stability.py --compiler-tests
        python3 scripts/check-primitives-fixtures.py
        python3 scripts/check-primitives-graph.py
        python3 scripts/check-primitives-native-workspace.py
        python3 scripts/test-publish-primitives.py
        python3 scripts/publish-primitives.py check
        ( cd rust
          cargo clippy --locked -p mkit-primitives -p mkit-primitives-fuzz --all-targets --all-features -- -D warnings
          cargo check --locked -p mkit-primitives-fuzz --features libfuzzer --bins
          cargo nextest run --locked -p mkit-primitives -j 3
          cargo nextest run --locked -p mkit-primitives-fuzz -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --no-default-features --features pack-zstd -j 3
          cargo check --locked -p mkit-primitives --no-default-features --all-targets
          cargo check --locked -p mkit-primitives --all-features --all-targets
          cargo nextest run --locked -p mkit-primitives --no-default-features --test framing_backends --test framing_vectors -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --all-features --test framing_backends --test framing_vectors -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --no-default-features --lib -E 'test(resume_tests::) | test(pack_verify::verify::tests::compute::)' -j 3 --no-tests=fail
          cargo nextest run --locked -p mkit-primitives --all-features --lib -E 'test(resume_tests::) | test(pack_verify::verify::tests::compute::)' -j 3 --no-tests=fail
          cargo test --locked -p mkit-primitives --doc
          cargo test --locked -p mkit-primitives --no-default-features --doc
          RUSTDOCFLAGS=-Dwarnings cargo doc --locked -p mkit-primitives --all-features --no-deps
          cargo check --locked -p mkit-primitives --target wasm32-unknown-unknown
          cargo check --locked -p mkit-primitives --no-default-features --target wasm32-unknown-unknown
          # The existing image has cargo-binstall; one pinned prebuilt tool
          # keeps the feature sweep bounded without rebuilding the CI image.
          if ! cargo hack --version >/dev/null 2>&1; then
            cargo binstall --no-confirm --force --version 0.6.45 --disable-strategies compile cargo-hack
          fi
          cargo hack check --locked -p mkit-primitives --lib --feature-powerset
        )
        # Execute the selected portable fixtures on a real wasm32 runtime.
        # Neither runtime tool is guaranteed by the current baked image.
        if ! command -v node >/dev/null 2>&1; then
          # E2 uses x86_64; Node names that archive architecture x64.
          [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
          node_setup=$(mktemp -d)
          mkdir /tmp/mkit-primitives-node
          curl --fail --location --connect-timeout 20 --max-time 120 --retry 2 \
            https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.gz \
            -o "$node_setup/node-v22.14.0-linux-x64.tar.gz"
          curl --fail --location --connect-timeout 20 --max-time 120 --retry 2 \
            https://nodejs.org/dist/v22.14.0/SHASUMS256.txt -o "$node_setup/SHASUMS256.txt"
          ( cd "$node_setup"
            grep ' node-v22.14.0-linux-x64.tar.gz$' SHASUMS256.txt | sha256sum --check --strict
            tar -xzf node-v22.14.0-linux-x64.tar.gz --strip-components=1 -C /tmp/mkit-primitives-node
          )
          rm -rf "$node_setup"
          export PATH="/tmp/mkit-primitives-node/bin:$$PATH"
        fi
        if ! command -v wasm-pack >/dev/null 2>&1; then
          timeout 180 cargo binstall --no-confirm --force --version 0.13.1 --disable-strategies compile wasm-pack
        fi
        node --version
        wasm-pack --version
        wasm-pack test --node rust/crates/mkit-core-wasm-check --test primitives_portable --locked
        # Out-of-tree consumer of the packaged crates (no path overrides or
        # patches), native and wasm32, over the shipped portable fixtures.
        python3 scripts/check-primitives-consumer.py
        bash scripts/check-primitives-stability.sh
        sccache --show-stats

  # Lint and build gates for the rust/ workspace. This step is independent of
  # the test steps. It uses its own target directory so no Cargo lock couples
  # it to the archive step.
  - name: ${_CI_IMAGE}
    id: lint
    waitFor: ['-']
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-lint"
    args:
      - -c
      - |
        set -euo pipefail
        # Every gate runs even after an earlier failure. Each gate records into
        # `failed`; the step exits non-zero at the end.
        status=0
        ( cd rust || exit 1
          failed=0
          cargo fetch --locked || failed=1
          cargo fmt --check || failed=1
          python3 ../scripts/check-feature-names.py || failed=1
          cargo clippy --all-targets --all-features --workspace -- -D warnings || failed=1
          cargo build --locked --workspace || failed=1
          # MSRV gate. The baked image is pinned to the MSRV, so a locked all-targets
          # check is the rust.yml `msrv` job's equivalent. Fail if the image's rustc
          # drifts from the declared rust-version (lowercase vars avoid the Cloud Build
          # substitution scanner).
          msrv=$(awk -F\" '/^[[:space:]]*rust-version[[:space:]]*=/ {print $2; exit}' Cargo.toml) || failed=1
          rustc_v=$(rustc --version | awk '{print $2}') || failed=1
          echo "declared MSRV=$msrv, image rustc=$rustc_v"
          if [ -n "$msrv" ] && [ "$rustc_v" != "$msrv" ]; then
            echo "MSRV drift: rust-version=$msrv but CI image rustc=$rustc_v — rebuild Dockerfile.ci or fix rust-version" >&2
            failed=1
          fi
          cargo check --workspace --locked --all-targets || failed=1
          exit "$failed"
        ) || status=1
        sccache --show-stats
        exit "$status"

  # contrib/signers is a separate workspace. The nextest partitions wait for
  # the signers-bin step: mkit-cli's attest_roundtrip tests drive
  # contrib/signers/target/debug/mkit-sign-file and only fall back to building
  # it on the fly when it is missing. This step only builds the binary, so a
  # fmt, clippy, or test failure in signers cannot skip the partitions. It
  # keeps the default target directory (on the shared /workspace volume) so
  # the partitions find the binary.
  - name: ${_CI_IMAGE}
    id: signers-bin
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "MKIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        cd contrib/signers
        cargo build --locked --all-features
        sccache --show-stats

  # The signers gates. No other step waits for this one. It starts after
  # signers-bin so both share the warm default target directory.
  - name: ${_CI_IMAGE}
    id: signers
    waitFor: [signers-bin]
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "MKIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        # Software TPM for the TPM tests; also exports TCTI and MKIT_TEST_STRICT=1.
        source /workspace/scripts/ci-swtpm-setup.sh
        ( cd contrib/signers || exit 1
          failed=0
          cargo fmt --check || failed=1
          cargo clippy --locked --all-targets --all-features -- -D warnings || failed=1
          cargo nextest run --locked --all-features --no-fail-fast || failed=1
          exit "$failed"
        ) || status=1
        sccache --show-stats
        exit "$status"

  # apps/repo-worker and apps/keys-worker are standalone crates outside the
  # rust/ workspace (each pins its own rust-toolchain.toml for the Cloudflare
  # Workers Build image). `cargo test` on the host target compiles only the
  # pure, non-wasm-gated modules. The wasm32 build compiles the Durable Object
  # and `#[event(fetch)]` glue, which needs a live Workers runtime to run.
  # repo-worker skips fmt and clippy: its wasm32-only worker_impl module has
  # older fmt and clippy debt unrelated to its gates. keys-worker has none, so
  # it gets the full sweep.
  - name: ${_CI_IMAGE}
    id: apps-workers
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=2"
      - "MKIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        source /workspace/scripts/ci-swtpm-setup.sh
        ( cd apps/repo-worker || exit 1
          failed=0
          cargo fetch --locked || failed=1
          cargo test --locked --no-fail-fast || failed=1
          cargo build --locked --target wasm32-unknown-unknown || failed=1
          exit "$failed"
        ) || status=1
        ( cd apps/keys-worker || exit 1
          failed=0
          cargo fetch --locked || failed=1
          cargo fmt --check || failed=1
          cargo clippy --locked --all-targets --all-features -- -D warnings || failed=1
          cargo test --locked --no-fail-fast || failed=1
          cargo build --locked --target wasm32-unknown-unknown || failed=1
          exit "$failed"
        ) || status=1
        sccache --show-stats
        exit "$status"

  # Build every workspace test binary once. The partition steps and the
  # ignored lane run from this archive, so none of them compiles. The unified
  # server lib-test needs Cargo's single-job jobserver; sccache substitutes
  # CPU-count parallelism and exhausts memory. The wrapper bypasses sccache
  # only for that linked test target. Smaller codegen units and serial Cargo
  # builds remain required. The archive lives on the shared /workspace volume,
  # and so does the target directory that the archived binaries point to.
  - name: ${_CI_IMAGE}
    id: nextest-archive
    waitFor: ['-']
    timeout: 3000s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        status=0
        cargo nextest archive --locked --workspace --all-features --build-jobs 1 --archive-file /workspace/nextest-archive.tar.zst || status=1
        sccache --show-stats
        exit "$status"

  # Workspace nextest, split into 3 partitions that run at the same time.
  # Cloud Build steps share one VM, so each partition gets 9 test threads: 27
  # threads leave 5 vCPUs for the serial ignored lane. The slowest conformance
  # tests (about 300 s) set the floor for the whole stage. The swtpm setup and
  # MKIT_TEST_STRICT=1 match the old single check step.
  - name: ${_CI_IMAGE}
    id: nextest-1
    waitFor: [nextest-archive, signers-bin]
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "MKIT_TEST_STRICT=1"
      - "NEXTEST_TEST_THREADS=9"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        source /workspace/scripts/ci-swtpm-setup.sh
        cd rust
        cargo nextest run --archive-file /workspace/nextest-archive.tar.zst --workspace-remap /workspace/rust \
          --partition count:1/3 --no-fail-fast || status=1
        exit "$status"

  - name: ${_CI_IMAGE}
    id: nextest-2
    waitFor: [nextest-archive, signers-bin]
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "MKIT_TEST_STRICT=1"
      - "NEXTEST_TEST_THREADS=9"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        source /workspace/scripts/ci-swtpm-setup.sh
        cd rust
        cargo nextest run --archive-file /workspace/nextest-archive.tar.zst --workspace-remap /workspace/rust \
          --partition count:2/3 --no-fail-fast || status=1
        exit "$status"

  - name: ${_CI_IMAGE}
    id: nextest-3
    waitFor: [nextest-archive, signers-bin]
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "MKIT_TEST_STRICT=1"
      - "NEXTEST_TEST_THREADS=9"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        source /workspace/scripts/ci-swtpm-setup.sh
        cd rust
        cargo nextest run --archive-file /workspace/nextest-archive.tar.zst --workspace-remap /workspace/rust \
          --partition count:3/3 --no-fail-fast || status=1
        exit "$status"

  # Serial ignored-test lane (the nextest `ignored-lane` profile, test-threads
  # = 1). The 75,000-ref D34 listing has an 1800s test ceiling; 3000s also
  # covers the 300s pack-residency test and the other real-I/O tests. It runs
  # from the same archive as the partitions, so it needs no compile.
  - name: ${_CI_IMAGE}
    id: ignored-lane
    waitFor: [nextest-archive]
    timeout: 3000s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "MKIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        status=0
        cargo nextest run --archive-file /workspace/nextest-archive.tar.zst --workspace-remap /workspace/rust \
          --no-fail-fast --profile ignored-lane --run-ignored ignored-only || status=1
        exit "$status"

  # Indexed verification with one Extract step per slice (default chains).
  # A -p mkit-server build unifies features differently from the workspace
  # archive, so this step compiles its own test binaries.
  - name: ${_CI_IMAGE}
    id: indexed
    waitFor: ['-']
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-indexed"
      - "MKIT_TEST_STRICT=1"
      - "MKIT_TEST_EXTRACT_CHAIN=1"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        source /workspace/scripts/ci-swtpm-setup.sh
        cd rust
        cargo nextest run --locked -p mkit-server --all-features --no-fail-fast -E 'test(~indexed::)' || status=1
        sccache --show-stats
        exit "$status"

  # nextest does not run doctests; gate them here. The fuzz manifest tests
  # live in their own workspace.
  - name: ${_CI_IMAGE}
    id: tests-misc
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-misc"
      - "MKIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        source /workspace/scripts/ci-swtpm-setup.sh
        ( cd rust || exit 1
          failed=0
          cargo test --manifest-path fuzz/Cargo.toml --no-fail-fast || failed=1
          cargo test --locked --doc --workspace --no-fail-fast || failed=1
          exit "$failed"
        ) || status=1
        sccache --show-stats
        exit "$status"

  # Release-profile gates. The release profile shares little with the dev
  # builds, so this step has its own target directory.
  - name: ${_CI_IMAGE}
    id: release-cli
    waitFor: ['-']
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-release"
      - "MKIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        source /workspace/scripts/ci-swtpm-setup.sh
        ( cd rust || exit 1
          failed=0
          # Version contract: `mkit version` must print exactly "mkit <X.Y.Z>".
          cargo build --release --locked -p mkit-cli || failed=1
          out=$(/tmp/target-release/release/mkit version) || failed=1
          expected="mkit $(awk -F\" '/^version/ {print $2; exit}' Cargo.toml)" || failed=1
          echo "stdout:   [$out]"
          echo "expected: [$expected]"
          if [ "$out" != "$expected" ]; then
            echo "mkit version contract violated — stdout is not exactly 'mkit <X.Y.Z>'" >&2
            failed=1
          fi
          # enc-transport opt-in build + encrypted-transport e2e (issue #156).
          cargo build --locked -p mkit-cli --features enc-transport || failed=1
          cargo test --locked -p mkit-transport-enc --features tcp --no-fail-fast || failed=1
          exit "$failed"
        ) || status=1
        sccache --show-stats
        exit "$status"

  # mkit-server server exit gate (`just ci-server`). The workspace nextest runs
  # the memory storage suite and the wire suite over the in-process host. These
  # add what it cannot: the runtime-agnostic core must build for wasm32, the
  # wasm32 graphs must stay free of C-toolchain crates, and the default `mkit`
  # CLI must stay server-free (docs/INVARIANTS.md). cloudbuild/server.yaml also
  # runs the mkit-client builds, check-wasm-dep-graph.sh and
  # check-sync-native-deps.sh. The server trigger is path-gated, so this
  # config keeps its own copy.
  - name: ${_CI_IMAGE}
    id: wasm-gates
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-wasm"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        ( cd rust || exit 1
          failed=0
          cargo build --locked -p mkit-client --target wasm32-unknown-unknown || failed=1
          cargo build --locked -p mkit-client --no-default-features --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --features remote-hooks --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --features http-objects --target wasm32-unknown-unknown || failed=1
          cargo check --locked -p mkit-server --no-default-features --features test-support --target wasm32-unknown-unknown || failed=1
          cargo clippy --locked -p mkit-server --target wasm32-unknown-unknown -- -D warnings || failed=1
          exit "$failed"
        ) || status=1
        bash scripts/check-wasm-dep-graph.sh || status=1
        bash scripts/check-cli-baseline.sh || status=1
        bash scripts/check-sync-native-deps.sh || status=1
        sccache --show-stats
        exit "$status"

  # Separate cargo invocation keeps the C decoder out of the allocator probe.
  # It has its own target directory, so it runs next to the other steps.
  - name: ${_CI_IMAGE}
    id: server-allocator
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_INCREMENTAL=0"
      - "CARGO_BUILD_JOBS=4"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_TARGET_DIR=/tmp/target-allocator"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        cargo test --locked -p mkit-server --no-default-features --features memory,pack-ruzstd --test zstd_slice_heap_bounds -- --ignored --test-threads=1 --nocapture
        sccache --show-stats

  - name: python:3.13.2-slim
    id: server-gates
    waitFor: ['-']
    timeout: 60s
    entrypoint: python3
    args: [scripts/test-server-gates.py, --hosted-only]
