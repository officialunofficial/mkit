# Vendored codegen freshness on Cloud Build — replaces the `codegen-fresh` job
# in .github/workflows/rust.yml. Regenerates the vendored buffa/connectrpc
# codegen and fails if the committed copy drifted.
#
# Needs protoc (Edition 2023 → protoc >= 27) and the wasm32 target (the
# repo-worker regen builds for wasm32-unknown-unknown) — both baked into
# _CI_IMAGE (cloudbuild/Dockerfile.ci).
#
# scripts/check-generated-fresh.sh diffs the worktree via `git status`, so the
# checkout must be a git repo. Cloud Build's GitHub triggers fetch via git (.git
# present), so this works under triggers. A manual `gcloud builds submit` ships a
# .git-less tarball and will fail the git step — use a trigger (or a local
# `./scripts/check-generated-fresh.sh`) to repro.
#
# Trigger: mkit-codegen-{pr,main} — path-filtered to protos / build.rs /
# scripts/regen-*.sh / **/generated/**.
#
# Also runs `buf lint` + `buf breaking` against every module of the repo-root
# buf.yaml workspace, then the same two checks for the standalone
# rust/crates/mkit-trust-rpc/buf.yaml module. That module is outside the
# workspace, so the root run does not see it. A last step runs the
# server-hook golden JSON check. Together these replace
# .github/workflows/buf.yml and .github/workflows/proto.yml.
# The CI image bakes buf. The step downloads _BUF_VERSION only when the
# image has no buf. Keep _BUF_VERSION equal to the version in Dockerfile.ci.
#
# `buf breaking` compares against the target branch's `buf.yaml` module tip
# (`.git#branch=main,subdir=proto`) — a no-op the first time a module is
# added (nothing to break against yet), then enforced on every following
# proto change per `breaking.use: [FILE]` in buf.yaml.

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.99.1
  _BUF_VERSION: "1.66.0"

options:
  # The trigger runs this config as a dedicated service account, not the
  # default Cloud Build account. Cloud Build rejects a custom account with no
  # log option.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
timeout: 1800s

steps:
  - name: ${_CI_IMAGE}
    id: codegen-fresh
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        ./scripts/check-generated-fresh.sh
        sccache --show-stats

  - name: ${_CI_IMAGE}
    id: buf-lint-breaking
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if ! command -v buf >/dev/null; then
          curl -sSL -o /usr/local/bin/buf \
            "https://github.com/bufbuild/buf/releases/download/v${_BUF_VERSION}/buf-Linux-x86_64"
          chmod +x /usr/local/bin/buf
        fi
        buf --version
        # Workspace modules: rpc, repo-worker, proto.
        buf lint
        # A new module has nothing to compare against. buf errors with
        # "had no .proto files" instead of passing, so skip the check
        # when the module is new on this branch.
        if git cat-file -e main:proto 2>/dev/null; then
          buf breaking --against '.git#branch=main'
        else
          echo "proto/ does not exist on main yet — skipping buf breaking (nothing to compare)."
        fi
        # Standalone module outside the root workspace (proto.yml covered it).
        trust=rust/crates/mkit-trust-rpc
        buf lint "$$trust"
        if git cat-file -e "main:$$trust/buf.yaml" 2>/dev/null; then
          buf breaking "$$trust" --against ".git#branch=main,subdir=$$trust"
        else
          echo "$$trust is new on this branch — skipping buf breaking."
        fi

  - name: ${_CI_IMAGE}
    id: server-hook-goldens
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Replaces the second step of .github/workflows/buf.yml.
        if ! command -v buf >/dev/null; then
          curl -sSL -o /usr/local/bin/buf \
            "https://github.com/bufbuild/buf/releases/download/v${_BUF_VERSION}/buf-Linux-x86_64"
          chmod +x /usr/local/bin/buf
        fi
        bash scripts/check-server-hooks-goldens.sh
