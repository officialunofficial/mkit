# mkit-primitives crates.io release on Cloud Build. Ports
# .github/workflows/primitives-publish.yml.
#
# Trigger: mkit-publish-primitives — tag pattern
# ^mkit-primitives-v[0-9]+\.[0-9]+\.[0-9]+$
#
# Steps: verify-tag, guard, semver-gate, consumer-check, publish, smoke.
# Only "publish" uploads. The token reaches that step only.
#
# DRY RUN. _DRY_RUN=true runs `publish-primitives.py publish --dry-run`,
# skips the post-publish registry smoke, and reads no secret value:
#   gcloud builds submit . --region=us-east4 \
#     --config=cloudbuild/publish-primitives.yaml --substitutions=_DRY_RUN=true
# A manual submit has no tag. The guard then runs against the tree version.
#
# TAG TRUST. The GitHub workflow required an annotated tag, signed by an
# allowlisted GPG key, whose commit is reachable from origin/main. The
# verify-tag step ports that check. It clones the public repo, so it needs no
# git credential. Set _GPG_FINGERPRINTS (space list of 40-hex fingerprints) on
# the trigger. The step fails closed when the list is empty. It also checks
# that the tag commit equals the commit Cloud Build checked out. This step
# has NOT been run against a real tag. Test it with a throwaway tag first.
# Set _VERIFY_TAG=false only to disable it knowingly.
#
# NOT PORTED: nothing in this workflow uses GitHub OIDC. It uses a registry
# token (CRATES_PACKAGE_KEY). One dependency stays on GitHub:
# scripts/publish-primitives.py `check` reads .github/workflows/crates-publish.yml
# to confirm the train keeps `--exclude mkit-primitives`. Do not delete that
# file until the script reads cloudbuild/publish-crates.yaml instead.
#
# CONCURRENCY. No built-in lock. Never run this beside publish-crates. The
# publish step is idempotent: an identical published version is skipped.

substitutions:
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.99.1
  _DRY_RUN: "false"
  _VERIFY_TAG: "true"
  _GPG_FINGERPRINTS: ""
  _REPO_URL: https://github.com/officialunofficial/mkit.git
  _TAG: ""

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/CRATES_PACKAGE_KEY/versions/latest
      env: CARGO_REGISTRY_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
  substitution_option: ALLOW_LOOSE

timeout: 5400s

steps:
  - name: ${_CI_IMAGE}
    id: verify-tag
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        dry="${_DRY_RUN}"
        tag="${TAG_NAME}"
        if [[ -z "$$tag" && "$$dry" == "true" ]]; then tag="${_TAG}"; fi
        if [[ -z "$$tag" ]]; then
          if [[ "$$dry" == "true" ]]; then
            echo "dry run without a tag: tag trust check skipped"
            exit 0
          fi
          echo "ERROR: no TAG_NAME. A real publish must run from the tag trigger." >&2
          exit 1
        fi
        if [[ ! "$$tag" =~ ^mkit-primitives-v[0-9]+\.[0-9]+\.[0-9]+$$ ]]; then
          echo "ERROR: tag must match mkit-primitives-vMAJOR.MINOR.PATCH: $$tag" >&2
          exit 1
        fi
        if [[ "${_VERIFY_TAG}" != "true" ]]; then
          echo "WARNING: tag signature check disabled (_VERIFY_TAG != true)"
          exit 0
        fi
        if [[ "$$dry" == "true" && -z "${TAG_NAME}" ]]; then
          echo "dry run with a manual tag: would verify signature of $$tag"
          exit 0
        fi
        fps="$$(printf '%s' "${_GPG_FINGERPRINTS}" | tr '[:lower:]' '[:upper:]')"
        if [[ -z "$$fps" ]]; then
          echo "ERROR: _GPG_FINGERPRINTS is required" >&2
          exit 1
        fi
        work="$$(mktemp -d)"
        git clone --quiet --bare "${_REPO_URL}" "$$work/repo.git"
        cd "$$work/repo.git"
        for fp in $$fps; do
          [[ "$$fp" =~ ^[A-F0-9]{40}$$ ]] || { echo "ERROR: bad fingerprint $$fp" >&2; exit 1; }
          ok=0
          for ks in hkps://keyserver.ubuntu.com hkps://keys.openpgp.org; do
            gpg --batch --keyserver "$$ks" --recv-keys "$$fp" || true
            if gpg --list-keys "$$fp" >/dev/null 2>&1; then ok=1; break; fi
          done
          [[ "$$ok" == 1 ]] || { echo "ERROR: cannot import key $$fp" >&2; exit 1; }
        done
        ref="refs/tags/$$tag"
        git show-ref --verify --quiet "$$ref" || { echo "ERROR: tag $$tag missing" >&2; exit 1; }
        [[ "$$(git cat-file -t "$$ref")" == "tag" ]] \
          || { echo "ERROR: $$tag must be an annotated signed tag" >&2; exit 1; }
        log="$$(mktemp)"
        if ! git verify-tag --raw -v "$$ref" >"$$log" 2>&1; then
          cat "$$log" >&2
          echo "ERROR: $$tag has no valid GPG signature" >&2
          exit 1
        fi
        signer="$$(awk '/^\[GNUPG:\] VALIDSIG / { print $$3; exit }' "$$log" | tr '[:lower:]' '[:upper:]')"
        case " $$fps " in
          *" $$signer "*) ;;
          *) echo "ERROR: signer $${signer:-unknown} is not allowlisted" >&2; exit 1 ;;
        esac
        commit="$$(git rev-parse "$$ref^{commit}")"
        git merge-base --is-ancestor "$$commit" refs/heads/main \
          || { echo "ERROR: $$commit is not reachable from main" >&2; exit 1; }
        if [[ "$$commit" != "${COMMIT_SHA}" ]]; then
          echo "ERROR: tag commit $$commit != checked-out commit ${COMMIT_SHA}" >&2
          exit 1
        fi
        echo "tag trust ok: $$tag at $$commit signed by $$signer"

  - name: ${_CI_IMAGE}
    id: guard
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        tag="${TAG_NAME}"
        if [[ -z "$$tag" ]]; then tag="${_TAG}"; fi
        if [[ -n "$$tag" ]]; then
          python3 scripts/publish-primitives.py guard "$$tag"
        elif [[ "${_DRY_RUN}" == "true" ]]; then
          echo "dry run without a tag: running the tree checks only"
          python3 scripts/publish-primitives.py check
        else
          echo "ERROR: no TAG_NAME" >&2
          exit 1
        fi

  - name: ${_CI_IMAGE}
    id: semver-gate
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        baseline="$$(python3 ../scripts/publish-primitives.py baseline)"
        if [[ "$$baseline" == none ]]; then
          echo "no published mkit-primitives yet; skipping semver baseline"
        else
          cargo semver-checks -p mkit-primitives --all-features --baseline-version "$$baseline"
        fi

  - name: ${_CI_IMAGE}
    id: consumer-check
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        python3 scripts/check-primitives-consumer.py

  - name: ${_CI_IMAGE}
    id: publish
    entrypoint: bash
    secretEnv: ["CARGO_REGISTRY_TOKEN"]
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_DRY_RUN}" == "true" ]]; then
          # BOUNDED ALTERNATIVE. `publish --dry-run` verifies the package
          # against the crates.io mkit-core. That release lacks APIs the tree
          # needs until the next train ships, so the verify build fails
          # (E0432/E0599 in pack_verify). The consumer-check step already
          # builds the packaged crates with a local overlay. So the dry run
          # packages and dry-runs the upload without the registry verify.
          echo "DRY RUN (bounded): cargo publish --dry-run --no-verify"
          cd rust
          cargo publish -p mkit-primitives --locked --dry-run --no-verify
        else
          python3 scripts/publish-primitives.py publish
        fi

  - name: ${_CI_IMAGE}
    id: smoke
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_DRY_RUN}" == "true" ]]; then
          echo "dry run: post-publish registry smoke skipped"
          exit 0
        fi
        tag="${TAG_NAME}"
        python3 scripts/check-primitives-consumer.py --registry "$${tag#mkit-primitives-v}"
