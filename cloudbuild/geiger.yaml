# Unsafe-code ceiling gate on Cloud Build — replaces .github/workflows/geiger.yml.
# scripts/check-geiger-baseline.sh runs `cargo geiger` from rust/crates/mkit-cli
# and asserts per-crate unsafe-expression counts against hardcoded ceilings.
# cargo-geiger 0.13.0 is baked into _CI_IMAGE (cloudbuild/Dockerfile.ci).
#
# geiger compiles the dependency tree, so sccache + a roomy disk help.
#
# Trigger: mkit-geiger-{pr,main}.

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-mkit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/mkit-ci:rust-1.95.0

options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  dynamicSubstitutions: true
timeout: 1800s

steps:
  - name: ${_CI_IMAGE}
    id: geiger
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUSTC_WRAPPER=sccache"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        bash scripts/check-geiger-baseline.sh
        sccache --show-stats
