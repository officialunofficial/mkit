# Configuration for crate-ci/typos. Run locally with `typos` (no flags).
#
# Philosophy: deny by default, allowlist domain-specific terms here so
# the CI signal stays high. If typos flags a real word, prefer fixing
# the typo over expanding the allowlist.

[files]
extend-exclude = [
    # Generated / vendored content.
    "rust/Cargo.lock",
    "rust/target/**",
    # Test fixtures may contain intentional garbage / random hashes.
    "rust/crates/*/tests/fixtures/**",
    # Golden vectors are byte-exact git objects (incl. latin1 bytes).
    "rust/tests/golden/**",
    # Compiled / minified web assets.
    "web/dist/**",
    "web/node_modules/**",
    # The CHANGELOG records historical text verbatim; reflowing it
    # to fix old typos would churn the file. Lint going-forward only.
    "CHANGELOG.md",
]

[default]
# Don't flag identifiers that look like hashes / hex blobs / base64.
extend-ignore-re = [
    "\\b[0-9a-fA-F]{16,}\\b", # hex hashes (commit ids, object hashes)
    "\\b[A-Za-z0-9+/=]{32,}\\b", # base64-ish blobs
]

[default.extend-words]
# Project-specific shorthands the dictionary doesn't recognise.
mkit = "mkit"
remix = "remix" # mkit's signed-derivative object type
identicons = "identicons"

# COSE — CBOR Object Signing and Encryption (RFC 8152). Legitimate
# crypto term used in mkit-attest and the FIDO2 signer.
COSE = "COSE"
cose = "cose"

# Parser artifact: typos splits "INSERTs" into "INSER" + "Ts" and
# flags the former. The actual word in the docs is "INSERTs"
# (plural of the INSERT delta op in SPEC-DELTA.md).
INSER = "INSER"

# `nodejs_als` is a Cloudflare Workers compat flag (Async Local
# Storage). Used in web/scripts/patch-worker-config.mjs.
als = "als"

# Vendor name; "HashiCorp" appears in SPEC-KEYSTORE.md disambiguation
# ("not HashiCorp Vault"). Default dictionary wants Hashi → Hash.
Hashi = "Hashi"

# Hyphenated prefix: "mis-resolve" / "mis-designed" appear in docs
# and scripts; typos parses them as standalone "mis".
mis = "mis"

# `anc` — shorthand for "ancestor" used in the branch ancestry-filter
# closure (`anc(c, tip)`) and the mv tracked-ancestor guard. Default
# dictionary wants anc → and.
anc = "anc"

# `fo\0o` is a null-byte test fixture in object.rs validate_name tests.
fo = "fo"

# Variant spelling: mkit uses "unparseable" throughout. Both forms
# are accepted by major dictionaries.
unparseable = "unparseable"

# `thr` is the keyid prefix for BLS12-381 threshold signatures
# (`bls12381-thr:<hex>`). Default dictionary thinks it's a typo for "the".
thr = "thr"

[type.rust.extend-words]
# `crate` is the obvious one but typos already knows it. Add any
# Rust-specific terms here as they come up.
